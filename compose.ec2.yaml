services:
  # ALB origin. TLS is terminated at the PLA-247 ALB; Caddy serves plain HTTP on
  # :80 and host-routes wiki/mcp/hermes to the internal upstreams. No ACME, no
  # 443: the only ingress is the ALB security group (compute.tf). The bare :80
  # site (no host matcher) also answers the ALB target-group health check, whose
  # Host header is the instance IP, by routing it to the wiki UI.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - wiki-ui
      - mcp-proxy
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-mcp.agent.plady.io}
      HERMES_PUBLIC_HOST: ${HERMES_PUBLIC_HOST:-hermes.agent.plady.io}
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/caddy/Caddyfile <<'CADDY'
        {
          auto_https off
          admin off
        }

        :80 {
          encode gzip

          @mcp host {$$MCP_PUBLIC_HOST}
          @hermes host {$$HERMES_PUBLIC_HOST}

          handle @mcp {
            reverse_proxy mcp-proxy:18765
          }

          handle @hermes {
            reverse_proxy hermes-gateway:8642
          }

          # Default: wiki UI. Also serves the ALB health check (Host = instance IP).
          handle {
            reverse_proxy wiki-ui:1313
          }
        }
        CADDY
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
    restart: unless-stopped

  llm-wiki:
    image: ${LLM_WIKI_IMAGE:?Set LLM_WIKI_IMAGE}
    environment:
      LLM_WIKI_NAME: 100thieves
      LLM_WIKI_DESCRIPTION: 100 Thieves team LLM Wiki
      LLM_WIKI_CONFIG: /config/config.toml
      LLM_WIKI_WORKSPACE: /workspace
    volumes:
      - wiki-data:/workspace
      - llm-wiki-config:/config
    expose:
      - "18765"
    restart: unless-stopped

  mcp-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - llm-wiki
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN}
    command:
      - /bin/sh
      - -ec
      - |
        cat >/tmp/mcp.conf.template <<'NGINX'
        server {
          listen 18765;
          resolver 127.0.0.11 valid=10s ipv6=off;

          location / {
            if ($$http_authorization != "Bearer ${MCP_BEARER_TOKEN}") {
              add_header WWW-Authenticate "Bearer" always;
              return 401;
            }

            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Authorization $$http_authorization;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            set $$llm_wiki_upstream llm-wiki:18765;
            proxy_pass http://$$llm_wiki_upstream;
          }
        }
        NGINX
        envsubst '$${MCP_BEARER_TOKEN}' </tmp/mcp.conf.template >/etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
    expose:
      - "18765"
    restart: unless-stopped

  wiki-ui:
    image: ${WIKI_UI_IMAGE:?Set WIKI_UI_IMAGE}
    depends_on:
      - llm-wiki
    working_dir: /workspace/site
    environment:
      WIKI_DOMAIN_NAME: ${WIKI_DOMAIN_NAME:-wiki.agent.plady.io}
    # Sync the baked Hugo scaffold into the shared /workspace/site, ensure the
    # llm-wiki content dir exists (empty is fine — Hugo still renders), then serve.
    # Ensure both Hugo module-mount sources exist (../wiki and ../raw per
    # hugo.toml) before serving — on a fresh wiki-data volume neither is created
    # yet, and a missing mount source aborts the Hugo build. Wipe+recopy the
    # baked scaffold so files removed from the image don't linger in the volume.
    # Clear /workspace/site CONTENTS (not the dir itself — it is the working_dir,
    # so removing it pulls the cwd out from under the shell and Hugo dies with
    # `failed to read dir "."`). find -mindepth 1 -delete drops stale scaffold
    # files while keeping the inode. Both Hugo module-mount sources (../wiki and
    # ../raw per hugo.toml) must exist before serving — on a fresh wiki-data
    # volume neither is created yet, and a missing mount source aborts the build.
    command: >-
      sh -c 'mkdir -p /workspace/wiki /workspace/raw /workspace/site && find /workspace/site -mindepth 1 -delete && cp -a /opt/site-template/. /workspace/site/ && hugo server --bind 0.0.0.0 --port 1313 --baseURL https://$${WIKI_DOMAIN_NAME}/ --appendPort=false --buildDrafts --destination /tmp/hugo-public --cacheDir /tmp/hugo-cache --noBuildLock --disableFastRender'
    volumes:
      - wiki-data:/workspace
    expose:
      - "1313"
    restart: unless-stopped

  # Hermes Agent Gateway (NousResearch/hermes-agent). OpenAI-compatible API
  # server on port 8642, exposed only on the compose network (no host publish).
  # Public origin https://hermes.agent.plady.io and its /v1 base URL are routed
  # to hermes-gateway:8642 by PLA-247 (DNS/ACM/ALB). Gated behind the `hermes`
  # profile. See docs/hermes-gateway.md.
  hermes-gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.4.3}
    # Image publishes linux/amd64 only; pin platform so it pulls on Apple
    # Silicon (via emulation) and EC2 (native amd64) alike.
    platform: ${HERMES_PLATFORM:-linux/amd64}
    profiles:
      - hermes
    # llm-wiki MCP is reached internally (mcp-proxy:18765); start the proxy first
    # so the agent's first MCP tool call resolves. PLA-244.
    depends_on:
      - mcp-proxy
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # Required at runtime when the `hermes` profile is used (value from
      # /plady/agent-platform/<env>/hermes-api-server-key). Left optional here
      # (`:-`) on purpose: a `:?` guard would abort interpolation for the whole
      # file — including non-hermes `docker compose up`/`config` — because
      # Compose interpolates every service before profile filtering. Hermes
      # itself requires this key for every deployment and refuses to serve
      # without it, so an empty value fails fast in the container, not the file.
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      # Provider credential for the Claude Code runtime backend (PLA-273 decision:
      # subscription, not a raw API key). A long-lived OAuth token from
      # `claude setup-token` (Pro/Max login), injected from SSM by
      # scripts/ec2-deploy.sh when the parameter exists; empty otherwise so
      # /health and the auth boundary still come up. Claude Code reads this env
      # var natively for headless/CI auth. See docs/hermes-gateway.md.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Bearer token the agent presents to the llm-wiki MCP endpoint. Its
      # ~/.hermes/config.yaml carries only the ${LLM_WIKI_MCP_BEARER_TOKEN}
      # placeholder (no secret on disk / in repo); hermes resolves it from this
      # env var at MCP connect-time. Same value as the mcp-proxy bearer
      # (MCP_BEARER_TOKEN, from /plady/agent-platform/<env>/llm-wiki-mcp-bearer-token)
      # because the agent calls mcp-proxy internally. PLA-244. See docs/hermes-gateway.md.
      LLM_WIKI_MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-home:/opt/data
    expose:
      - "8642"
    restart: unless-stopped

  # One-shot: merge the llm-wiki MCP server mapping into the hermes config
  # (~/.hermes/config.yaml == /opt/data/config.yaml in the hermes-home volume),
  # idempotently and WITHOUT clobbering the human-managed model/provider section
  # (a full-file rewrite would wipe the provider set up by `hermes setup`). The
  # bearer token is never written here — config.yaml only carries the
  # ${LLM_WIKI_MCP_BEARER_TOKEN} placeholder, resolved by hermes from the
  # hermes-gateway container env at MCP connect-time. Runs before the stack comes
  # up (scripts/ec2-deploy.sh). Gated behind the `hermes` profile. PLA-244.
  #
  # Tool policy (config/mcp-registry.yaml, PLA-250): only the read-only `allow`
  # tier is whitelisted here. The write-capable `approve` tier (wiki_content_*,
  # wiki_ingest, wiki_export) is intentionally left out until the Slack
  # interactive write-approval gate ships (PLA-244-B) — default-deny by omission.
  hermes-config-init:
    image: mikefarah/yq:4
    profiles:
      - hermes
    # root so chown works on a fresh (root-owned) volume; the file is handed back
    # to HERMES_UID/GID below so the gateway (which runs as that uid) can read it.
    user: "0:0"
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-home:/opt/data
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        CONFIG=/opt/data/config.yaml
        # -s (exists AND non-empty): also re-seed a stray 0-byte config so the
        # merge always runs against a valid YAML document.
        [ -s "$$CONFIG" ] || printf '{}\n' > "$$CONFIG"
        cat > /tmp/llm-wiki.yaml <<'YAML'
        url: http://mcp-proxy:18765/mcp
        headers:
          Authorization: "Bearer $${LLM_WIKI_MCP_BEARER_TOKEN}"
        timeout: 120
        connect_timeout: 60
        tools:
          include:
            - wiki_search
            - wiki_list
            - wiki_content_read
            - wiki_resolve
            - wiki_stats
            - wiki_lint
            - wiki_history
            - wiki_suggest
            - wiki_graph
            - wiki_index_status
            - wiki_spaces_list
          resources: false
          prompts: false
        YAML
        yq -i '.mcp_servers."llm-wiki" = load("/tmp/llm-wiki.yaml")' "$$CONFIG"
        chown "$${HERMES_UID:-10000}:$${HERMES_GID:-10000}" "$$CONFIG"
        echo "hermes-config-init: merged mcp_servers.llm-wiki (read-only tier) into $$CONFIG"

  # Internal-only OpenTelemetry Collector (contrib distribution — needs the
  # redaction processor + file exporter). Receives OTLP on the compose network
  # ONLY: gRPC otel-collector:4317, HTTP otel-collector:4318. On EC2 it stays
  # internal: no host publish (`expose:` only, never `ports:`), not routed by
  # Caddy/ALB, no public endpoint. Real team telemetry is sanitized in
  # otel/collector-config.yaml and exported file/local-first to the otel-data
  # volume on the box (no external egress). Gated behind the `otel` profile.
  # See docs/otel-collector.md.
  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.154.0}
    profiles:
      - otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # The otel-data named volume is root-owned on first mount; run as root so
    # the file exporter can write /var/lib/otel. Internal-only service.
    user: "0:0"
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-data:/var/lib/otel
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # n8n — RESERVED PLACEHOLDER, INTENTIONALLY DISABLED (PLA-251).
  #
  # n8n.agent.plady.io is a reserved hostname only; the public ALB returns 503
  # for it (infra/terraform/platform/alb.tf reserved_unavailable rule) until a
  # real runtime exists. PLA-251 explicitly forbids a live n8n runtime, so this
  # block is COMMENTED OUT and cannot start. A future teammate owns enabling it;
  # the block is the reserved slot + internal-target convention (n8n:5678).
  # Public exposure happens only behind the PLA-247 ingress (Caddy/ALB), never
  # via a host `ports:` mapping. Enable checklist: docs/n8n-placeholder.md.
  #
  # n8n:
  #   image: ${N8N_IMAGE:-n8nio/n8n:<pin>}
  #   profiles:
  #     - n8n
  #   environment:
  #     N8N_PORT: "5678"
  #     # Secrets (DB creds, N8N_ENCRYPTION_KEY) come from SSM at enable time,
  #     # e.g. /plady/agent-platform/<env>/n8n-encryption-key. Never commit values.
  #   expose:
  #     - "5678"          # internal target n8n:5678; public via PLA-247 ingress only
  #   restart: unless-stopped
  # ---------------------------------------------------------------------------

volumes:
  wiki-data:
  llm-wiki-config:
  hermes-home:
  otel-data:
