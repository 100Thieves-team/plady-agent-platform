services:
  # ALB origin. TLS is terminated at the PLA-247 ALB; Caddy serves plain HTTP on
  # :80 and host-routes wiki/mcp/hermes to the internal upstreams. No ACME, no
  # 443: the only ingress is the ALB security group (compute.tf). The bare :80
  # site (no host matcher) also answers the ALB target-group health check, whose
  # Host header is the instance IP, by routing it to the wiki UI.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - wiki-ui
      - mcp-proxy
      - wiki-auth
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-mcp.agent.plady.io}
      HERMES_PUBLIC_HOST: ${HERMES_PUBLIC_HOST:-hermes.agent.plady.io}
      WIKI_PUBLIC_HOST: ${WIKI_DOMAIN_NAME:-wiki.agent.plady.io}
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/caddy/Caddyfile <<'CADDY'
        {
          auto_https off
          admin off
        }

        :80 {
          encode gzip

          @mcp host {$$MCP_PUBLIC_HOST}
          @hermes host {$$HERMES_PUBLIC_HOST}
          @wiki host {$$WIKI_PUBLIC_HOST}

          handle @mcp {
            reverse_proxy mcp-proxy:18765
          }

          handle @hermes {
            reverse_proxy hermes-gateway:8642
          }

          # Wiki UI: 팀 비밀번호 세션 뒤에만 노출 (docs/wiki-token-issuer.md).
          # /auth/* 는 로그인 페이지/세션 발급이라 인증 없이 wiki-auth 로 직행,
          # 나머지는 forward_auth 가 세션 쿠키를 검증하고 (없으면 wiki-auth 가
          # /auth/login 으로 302) 통과 시에만 wiki-ui 로 프록시한다.
          handle @wiki {
            handle /auth/* {
              reverse_proxy wiki-auth:8790
            }
            handle {
              forward_auth wiki-auth:8790 {
                uri /auth/verify-browser
              }
              reverse_proxy wiki-ui:1313
            }
          }

          # Default: ALB target-group health check (Host = instance IP) 와 미지정
          # host 만 온다. wiki 를 default 로 프록시하면 임의 Host 헤더로 세션
          # 게이트를 우회할 수 있으므로 plain 200 만 응답한다.
          handle {
            respond "ok" 200
          }
        }
        CADDY
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
    restart: unless-stopped

  llm-wiki:
    image: ${LLM_WIKI_IMAGE:?Set LLM_WIKI_IMAGE}
    environment:
      LLM_WIKI_NAME: 100thieves
      LLM_WIKI_DESCRIPTION: 100 Thieves team LLM Wiki
      LLM_WIKI_CONFIG: /config/config.toml
      LLM_WIKI_WORKSPACE: /workspace
    volumes:
      - wiki-data:/workspace
      - llm-wiki-config:/config
    expose:
      - "18765"
    restart: unless-stopped

  # 토큰 발급/검증 사이드카 (docs/wiki-token-issuer.md). mcp-proxy가
  # auth_request로 검증을 위임한다: 기존 정적 MCP_BEARER_TOKEN 또는
  # POST /auth/token 이 발급한 단기 JWT 둘 다 통과. 발급기는
  # WIKI_TOKEN_PASSWORD_HASH + WIKI_TOKEN_JWT_SECRET (SSM → .env.ec2,
  # scripts/ec2-deploy.sh) 둘 다 있어야 켜진다 — 없으면 503으로 죽지 않고
  # 정적 토큰 검증만 동작하므로 기존 스택과 완전히 동일하게 뜬다.
  wiki-auth:
    image: python:3.12-alpine
    volumes:
      - ./docker/wiki-auth/app.py:/app/app.py:ro
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN}
      WIKI_TOKEN_PASSWORD_HASH: ${WIKI_TOKEN_PASSWORD_HASH:-}
      WIKI_TOKEN_JWT_SECRET: ${WIKI_TOKEN_JWT_SECRET:-}
    command: ["python", "/app/app.py"]
    expose:
      - "8790"
    restart: unless-stopped

  mcp-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - llm-wiki
      - wiki-auth
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 18765;
          resolver 127.0.0.11 valid=10s ipv6=off;

          location = /auth/token {
            set $$wiki_auth_upstream wiki-auth:8790;
            proxy_http_version 1.1;
            proxy_pass http://$$wiki_auth_upstream;
          }

          location = /_wiki_auth_verify {
            internal;
            set $$wiki_auth_upstream wiki-auth:8790;
            proxy_pass http://$$wiki_auth_upstream/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $$http_authorization;
          }

          location @unauthorized {
            add_header WWW-Authenticate "Bearer" always;
            return 401;
          }

          location / {
            auth_request /_wiki_auth_verify;
            error_page 401 = @unauthorized;

            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Authorization $$http_authorization;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            set $$llm_wiki_upstream llm-wiki:18765;
            proxy_pass http://$$llm_wiki_upstream;
          }
        }
        NGINX
        nginx -g 'daemon off;'
    expose:
      - "18765"
    restart: unless-stopped

  wiki-ui:
    image: ${WIKI_UI_IMAGE:?Set WIKI_UI_IMAGE}
    depends_on:
      - llm-wiki
    working_dir: /workspace/site
    environment:
      WIKI_DOMAIN_NAME: ${WIKI_DOMAIN_NAME:-wiki.agent.plady.io}
      # Branch of the wiki-data checkout to watch; must match wiki-data-sync.
      WIKI_SYNC_BRANCH: ${WIKI_SYNC_BRANCH:-main}
    # Sync the baked Hugo scaffold into the shared /workspace/site, ensure the
    # llm-wiki content dir exists (empty is fine — Hugo still renders), then serve.
    # Ensure both Hugo module-mount sources exist (../wiki and ../raw per
    # hugo.toml) before serving — on a fresh wiki-data volume neither is created
    # yet, and a missing mount source aborts the Hugo build. Wipe+recopy the
    # baked scaffold so files removed from the image don't linger in the volume.
    # Clear /workspace/site CONTENTS (not the dir itself — it is the working_dir,
    # so removing it pulls the cwd out from under the shell and Hugo dies with
    # `failed to read dir "."`). find -mindepth 1 -delete drops stale scaffold
    # files while keeping the inode.
    #
    # Hugo's dev-server live-reload is NOT trusted for content changes: bulk
    # file changes from a `git pull` overwhelm its watcher (observed 2026-08-23:
    # a deleted section kept serving its stale route, and 10 of 11 newly added
    # pages never registered until the container was recreated). Instead, a
    # watcher polls the wiki-data checkout's branch ref every 30s and exits the
    # container when the content HEAD moves; `restart: unless-stopped` brings it
    # back for a clean full rebuild. /tmp/hugo-cache and /tmp/hugo-public are
    # wiped at startup so even a plain `docker compose restart` (which reuses
    # the container filesystem, including /tmp) always rebuilds from scratch.
    command: >-
      sh -c 'rm -rf /tmp/hugo-cache /tmp/hugo-public; mkdir -p /workspace/wiki/policy/viewer /workspace/raw /workspace/site && find /workspace/site -mindepth 1 -delete && cp -a /opt/site-template/. /workspace/site/ || exit 1; hugo server --bind 0.0.0.0 --port 1313 --baseURL https://$${WIKI_DOMAIN_NAME}/ --appendPort=false --buildDrafts --destination /tmp/hugo-public --cacheDir /tmp/hugo-cache --noBuildLock --disableFastRender & HUGO=$$!; REF="/workspace/.git/refs/heads/$${WIKI_SYNC_BRANCH}"; INIT="$$(cat "$$REF" 2>/dev/null)"; while kill -0 "$$HUGO" 2>/dev/null; do sleep 30; CUR="$$(cat "$$REF" 2>/dev/null)"; if [ "$$CUR" != "$$INIT" ]; then echo "[wiki-ui] content HEAD changed ($${INIT:-none} -> $${CUR:-none}); exiting for clean rebuild"; exit 0; fi; done; wait "$$HUGO"'
    volumes:
      - wiki-data:/workspace
    expose:
      - "1313"
    restart: unless-stopped

  # team-wiki-v2 backing sidecar (PLA-275). Makes the shared wiki-data volume an
  # actual checkout of 100Thieves-team/team-wiki-v2 and pushes MCP/runtime writes
  # back to it. Replaces the legacy host bind-mount + cloud-init + systemd
  # `llm-wiki-data-sync.timer` model (infra/terraform/ec2): this platform uses a
  # named volume + unmanned SSM deploy, so the sync is a compose service, not a
  # host unit. See docs/wiki-data-repo.md.
  #
  # The deploy key (write-enabled, base64) comes from SSM via scripts/ec2-deploy.sh
  # -> .env.ec2. NO key -> the sidecar idles (does NOT crash the stack): wiki-ui
  # keeps serving the local scaffold and MCP keeps read/writing the volume,
  # they just aren't backed by git until the key is in SSM.
  #
  # All env uses `${VAR:-default}` (never `:?`): Compose interpolates every
  # service before profile filtering, so a `:?` guard would abort `config`/`up`
  # for the whole file (same lesson as hermes-gateway's API_SERVER_KEY note).
  wiki-data-sync:
    image: ${WIKI_SYNC_IMAGE:-alpine/git:2.45.2}
    depends_on:
      - llm-wiki
    environment:
      TEAM_WIKI_V2_REPO_SSH: ${TEAM_WIKI_V2_REPO_SSH:-git@github.com:100Thieves-team/team-wiki-v2.git}
      TEAM_WIKI_V2_DEPLOY_KEY_B64: ${TEAM_WIKI_V2_DEPLOY_KEY_B64:-}
      WIKI_SYNC_INTERVAL: ${WIKI_SYNC_INTERVAL:-120}
      WIKI_SYNC_BRANCH: ${WIKI_SYNC_BRANCH:-main}
      # Slack incoming webhook for "wiki actually updated" notifications, fired
      # when a sync cycle lands new commits on the volume (the moment content is
      # live, unlike push-time GitHub notifications that lead reality by up to
      # one sync interval). Optional/fail-open; the URL is a secret — never log.
      WIKI_SLACK_WEBHOOK_URL: ${WIKI_SLACK_WEBHOOK_URL:-}
      # git identity for sync commits (GIT_* env is authoritative; no git config needed).
      GIT_AUTHOR_NAME: ${WIKI_SYNC_GIT_NAME:-llm-wiki-sync}
      GIT_AUTHOR_EMAIL: ${WIKI_SYNC_GIT_EMAIL:-llm-wiki-sync@agent.plady.io}
      GIT_COMMITTER_NAME: ${WIKI_SYNC_GIT_NAME:-llm-wiki-sync}
      GIT_COMMITTER_EMAIL: ${WIKI_SYNC_GIT_EMAIL:-llm-wiki-sync@agent.plady.io}
    # alpine/git's ENTRYPOINT is `git`; override so the command is a shell script.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        SSH_DIR=/root/.ssh
        WS=/workspace
        BRANCH="$${WIKI_SYNC_BRANCH:-main}"
        INTERVAL="$${WIKI_SYNC_INTERVAL:-120}"
        mkdir -p "$$SSH_DIR"; chmod 700 "$$SSH_DIR"

        if [ -z "$${TEAM_WIKI_V2_DEPLOY_KEY_B64}" ]; then
          echo "[wiki-data-sync] no deploy key (TEAM_WIKI_V2_DEPLOY_KEY_B64 empty) -> team-wiki-v2 backing DISABLED."
          echo "[wiki-data-sync] put the v2 write deploy key in SSM (/plady/agent-platform/<env>/team-wiki-v2-deploy-key) and redeploy."
          echo "[wiki-data-sync] idling; wiki-ui keeps serving the local scaffold and MCP keeps read/writing the volume."
          while true; do sleep 3600; done
        fi

        # Never log the key. Write it, lock it down, point ssh at it only.
        # Trailing `echo` restores the final newline: SSM read ($(...)) + ec2-deploy's
        # `printf %s | base64 -w0` strips the PEM's trailing newline, and OpenSSL
        # rejects a key without it ("error in libcrypto" -> Permission denied).
        { printf '%s' "$${TEAM_WIKI_V2_DEPLOY_KEY_B64}" | base64 -d; echo; } > "$$SSH_DIR/id_deploy"
        chmod 600 "$$SSH_DIR/id_deploy"
        touch "$$SSH_DIR/known_hosts"; chmod 644 "$$SSH_DIR/known_hosts"
        export GIT_SSH_COMMAND="ssh -i $$SSH_DIR/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$$SSH_DIR/known_hosts"
        git config --global --add safe.directory "$$WS"
        cd "$$WS"

        # /workspace may already be a git repo: llm-wiki initializes the workspace
        # with its own "create:" commit before this sidecar runs, so we can assume
        # NEITHER a fresh dir NOR an existing `origin`. Make the wiring idempotent —
        # the old `[ ! -d .git ]` branch wrongly took the redeploy path and then
        # `git remote set-url origin` failed ("No such remote 'origin'"), crash-looping.
        if [ ! -d "$$WS/.git" ]; then
          echo "[wiki-data-sync] first boot: initializing $$WS as a git repo"
          git init -q
        fi
        if git remote get-url origin >/dev/null 2>&1; then
          git remote set-url origin "$${TEAM_WIKI_V2_REPO_SSH}"
        else
          git remote add origin "$${TEAM_WIKI_V2_REPO_SSH}"
        fi
        git fetch origin "$$BRANCH"
        # Keep any uncommitted local changes before aligning with origin.
        if [ -n "$$(git status --porcelain)" ]; then
          git add -A
          git commit -q -m "chore(wiki-sync): local changes on boot $$(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
        fi
        if git merge-base HEAD "origin/$$BRANCH" >/dev/null 2>&1; then
          # Shared history (normal redeploy): keep unpushed local commits, rebase on remote.
          echo "[wiki-data-sync] syncing existing $$WS with origin/$$BRANCH"
          git pull --rebase --autostash origin "$$BRANCH" || { echo "[wiki-data-sync] boot rebase failed; aborting"; git rebase --abort 2>/dev/null || true; }
        else
          # No shared history (fresh repo, or llm-wiki's placeholder commit): adopt origin.
          # `checkout -f -B` fills tracked files (wiki/ raw/ inbox/ schemas/ wiki.toml)
          # and leaves untracked site/ (gitignored in v2, owned by wiki-ui) alone.
          echo "[wiki-data-sync] no shared history with origin/$$BRANCH; checking out origin"
          git checkout -f -B "$$BRANCH" "origin/$$BRANCH"
        fi

        echo "[wiki-data-sync] backing ENABLED -> sync loop every $${INTERVAL}s on $$BRANCH"
        while true; do
          sleep "$$INTERVAL"
          # Don't fight a manual git operation: if an admin exec'd in to resolve a
          # conflict (rebase/merge/cherry-pick in progress), skip this cycle so we
          # never commit a half-finished state or `rebase --abort` their work.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ] || [ -f .git/MERGE_HEAD ] || [ -f .git/CHERRY_PICK_HEAD ]; then
            echo "[wiki-data-sync] git operation in progress; skipping sync cycle for manual resolution"
            continue
          fi
          # HEAD before this cycle touches anything: local runtime/MCP commits and
          # pulled origin commits both land in OLD..HEAD for the Slack summary.
          OLD="$$(git rev-parse HEAD 2>/dev/null || true)"
          git add -A
          # Commit working-tree changes. If the tree is clean but we still have
          # unpushed local commits (e.g. a prior cycle committed but `push` failed,
          # or the boot commit never got pushed), fall through to pull/push instead
          # of idling forever until the next file change.
          if [ -n "$$(git status --porcelain)" ]; then
            git commit -q -m "chore(wiki-sync): runtime/MCP changes $$(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          fi
          # Always check the remote too: a clean tree + no unpushed local commits
          # used to `continue` here without ever fetching, so origin-only pushes
          # (e.g. from a developer's laptop, with no MCP write happening on this
          # box) were NEVER pulled down — `git cherry` only sees local-ahead, not
          # local-behind. Fetch first, then check both directions.
          git fetch origin "$$BRANCH" >/dev/null 2>&1 || true
          if [ -z "$$(git rev-list HEAD..origin/$$BRANCH 2>/dev/null)" ] && [ -z "$$(git cherry origin/$$BRANCH 2>/dev/null)" ]; then
            continue
          fi
          # Pull-then-push; a write landing between the two is caught next cycle.
          if ! git pull --rebase --autostash origin "$$BRANCH"; then
            echo "[wiki-data-sync] pull --rebase failed; aborting rebase, skipping push this cycle"
            git rebase --abort 2>/dev/null || true
            continue
          fi
          # Content is live on the volume right here (wiki-ui's HEAD watcher
          # rebuilds within ~30s) — THIS is the moment to notify Slack, not the
          # GitHub push that precedes it by up to one sync interval. Fail-open:
          # no webhook -> skip silently; notify errors never break the sync loop.
          # Never print the webhook URL.
          NEW="$$(git rev-parse HEAD 2>/dev/null || true)"
          if [ -n "$${WIKI_SLACK_WEBHOOK_URL}" ] && [ -n "$$OLD" ] && [ -n "$$NEW" ] && [ "$$NEW" != "$$OLD" ]; then
            COUNT="$$(git rev-list --count "$$OLD..$$NEW" 2>/dev/null || echo '?')"
            SUMMARY="$$(git log --oneline --no-decorate "$$OLD..$$NEW" 2>/dev/null | head -10 | sed 's/\\/\\\\/g;s/"/\\"/g' | awk '{printf "%s\\n", $$0}')"
            if wget -q -O /dev/null --header='Content-Type: application/json' \
                --post-data="{\"text\":\":books: *wiki.agent.plady.io 반영 완료* — 커밋 $${COUNT}건\\n$${SUMMARY}\"}" \
                "$${WIKI_SLACK_WEBHOOK_URL}"; then
              echo "[wiki-data-sync] slack notified ($${COUNT} commits)"
            else
              echo "[wiki-data-sync] slack notify failed (ignored)"
            fi
          fi
          if git push origin "HEAD:$$BRANCH"; then
            echo "[wiki-data-sync] pushed to origin/$$BRANCH"
          else
            echo "[wiki-data-sync] push failed; will retry next cycle"
          fi
        done
    volumes:
      - wiki-data:/workspace
    restart: unless-stopped

  # 정책서 자동 렌더 사이드카. wiki/policy/_src/상태-SSOT.yaml (SSOT 원본,
  # git push 또는 llm-wiki MCP asset write 로 도착)의 내용 해시를 폴링하다가
  # 바뀌면 team-wiki-v2 의 tools/policy-renderer/render_wiki.py 로
  # wiki/policy/ 파생 페이지들을 재렌더한다. 이후 체인은 기존 인프라가 잇는다:
  # wiki-data-sync 가 커밋/푸시 + Slack 알림, wiki-ui HEAD 워처가 재빌드.
  # 렌더 직후 내부 MCP(llm-wiki:18765, 프록시 인증 앞단 없음)로 검색 인덱스를
  # 재빌드한다. 렌더 실패 시 이전 페이지를 유지하고 Slack 으로만 알린다 —
  # 같은 깨진 판으로 매 주기 재시도해 스팸이 되지 않게 해시를 소진 처리한다.
  policy-renderer:
    image: ${POLICY_RENDERER_IMAGE:-python:3.12-alpine}
    depends_on:
      - llm-wiki
    environment:
      WIKI_SLACK_WEBHOOK_URL: ${WIKI_SLACK_WEBHOOK_URL:-}
      POLICY_RENDER_INTERVAL: ${POLICY_RENDER_INTERVAL:-60}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        pip install --quiet --no-cache-dir 'pyyaml==6.0.2'
        SRC="/workspace/wiki/policy/_src/상태-SSOT.yaml"
        OUT=/workspace/wiki/policy
        TOOLS=/workspace/tools/policy-renderer
        LAST=""
        if [ -f "$$OUT/sync-manifest.json" ]; then
          LAST="$$(python3 -c "import json;print(json.load(open('$$OUT/sync-manifest.json')).get('source_hash',''))" 2>/dev/null || true)"
        fi
        echo "[policy-renderer] watching $$SRC every $${POLICY_RENDER_INTERVAL}s (last=$${LAST:-none})"
        while :; do
          sleep "$$POLICY_RENDER_INTERVAL"
          [ -f "$$SRC" ] || continue
          [ -f "$$TOOLS/render_wiki.py" ] || continue
          CUR="$$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()[:12])" "$$SRC")"
          [ "$$CUR" = "$$LAST" ] && continue
          echo "[policy-renderer] source changed ($${LAST:-none} -> $$CUR); rendering"
          if python3 "$$TOOLS/render_wiki.py" -i "$$SRC" -o "$$OUT" --prd-dir /workspace/raw/product; then
            echo "[policy-renderer] rendered @$$CUR; wiki-data-sync will commit+push, wiki-ui will rebuild"
            python3 "$$TOOLS/rebuild_index.py" || echo "[policy-renderer] index rebuild failed (ignored)"
          else
            echo "[policy-renderer] RENDER FAILED @$$CUR — keeping previous pages"
            if [ -n "$${WIKI_SLACK_WEBHOOK_URL}" ]; then
              wget -q -O /dev/null --header='Content-Type: application/json' \
                --post-data="{\"text\":\":x: policy-renderer: 상태-SSOT.yaml@$$CUR 렌더 실패 — 이전 정책서 유지, EC2 로그 확인 필요\"}" \
                "$${WIKI_SLACK_WEBHOOK_URL}" || true
            fi
          fi
          LAST="$$CUR"
        done
    volumes:
      - wiki-data:/workspace
    restart: unless-stopped

  # Hermes Agent Gateway (NousResearch/hermes-agent). OpenAI-compatible API
  # server on port 8642, exposed only on the compose network (no host publish).
  # Public origin https://hermes.agent.plady.io and its /v1 base URL are routed
  # to hermes-gateway:8642 by PLA-247 (DNS/ACM/ALB). Gated behind the `hermes`
  # profile. See docs/hermes-gateway.md.
  hermes-gateway:
    # v2026.6.19 (v0.17.0): bumped from the original v2026.4.3 (v0.7.0) for mature
    # Slack support — v0.7.0 shipped only an early Slack adapter without the
    # `slack manifest` CLI or thread/approval-button UX (added v0.8.0+). PLA-244-B.
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.6.19}
    # Image publishes linux/amd64 only; pin platform so it pulls on Apple
    # Silicon (via emulation) and EC2 (native amd64) alike.
    platform: ${HERMES_PLATFORM:-linux/amd64}
    profiles:
      - hermes
    # llm-wiki MCP is reached internally (mcp-proxy:18765); start the proxy first
    # so the agent's first MCP tool call resolves. PLA-244.
    depends_on:
      - mcp-proxy
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # Required at runtime when the `hermes` profile is used (value from
      # /plady/agent-platform/<env>/hermes-api-server-key). Left optional here
      # (`:-`) on purpose: a `:?` guard would abort interpolation for the whole
      # file — including non-hermes `docker compose up`/`config` — because
      # Compose interpolates every service before profile filtering. Hermes
      # itself requires this key for every deployment and refuses to serve
      # without it, so an empty value fails fast in the container, not the file.
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      # Runtime LLM backend: openai-codex provider (PLA-277). The provider is set
      # declaratively in config.yaml by hermes-config-init (model.provider:
      # openai-codex); its credential is NOT an env var. Unlike the former Claude
      # Code path, Codex auth is a device-code OAuth session ("Sign in with
      # ChatGPT") persisted to /opt/data/auth.json in the hermes-home volume — a
      # human runs `hermes auth add openai-codex` once against this volume (see
      # docs/hermes-gateway.md §2). No API key, no Codex CLI, no SSM secret for
      # the provider. The volume below carries that credential across restarts.
      # Bearer token the agent presents to the llm-wiki MCP endpoint. Its
      # ~/.hermes/config.yaml carries only the ${LLM_WIKI_MCP_BEARER_TOKEN}
      # placeholder (no secret on disk / in repo); hermes resolves it from this
      # env var at MCP connect-time. Same value as the mcp-proxy bearer
      # (MCP_BEARER_TOKEN, from /plady/agent-platform/<env>/llm-wiki-mcp-bearer-token)
      # because the agent calls mcp-proxy internally. PLA-244. See docs/hermes-gateway.md.
      LLM_WIKI_MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      # Slack messaging platform (PLA-244-B). The single `gateway run` process
      # serves Slack alongside the OpenAI API; the platform auto-enables when the
      # bot+app tokens are present (Socket Mode — no public webhook/ALB route).
      # All three are optional (`:-`): absent → Slack simply stays off and the
      # API server still serves. Tokens are SECRETS (SSM, never committed);
      # SLACK_ALLOWED_USERS is a comma-separated Slack Member-ID allowlist and is
      # fail-closed (empty → every Slack user denied). Injected by
      # scripts/ec2-deploy.sh from SSM. See docs/hermes-gateway.md.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-home:/opt/data
    expose:
      - "8642"
    restart: unless-stopped

  # One-shot: merge the non-secret hermes config (model.provider +
  # mcp_servers.llm-wiki + platforms.slack) into ~/.hermes/config.yaml (==
  # /opt/data/config.yaml in the hermes-home volume), idempotently via surgical
  # leaf-`set` (other keys a human may have placed are preserved — no full-file
  # rewrite). The runtime backend is set declaratively here: model.provider =
  # openai-codex, model.default = gpt-5.5 (PLA-277). The bare "codex" alias is
  # rejected by the ChatGPT-account Codex backend (HTTP 400 unsupported-model);
  # ChatGPT-account auth requires a concrete model id (gpt-5.5). This selects the provider only
  # — the credential is the device-code OAuth session in /opt/data/auth.json,
  # written once by a human (`hermes auth add openai-codex`), NOT by this merge.
  # No secret is written here — the MCP bearer is a ${LLM_WIKI_MCP_BEARER_TOKEN}
  # placeholder resolved at connect-time, and the Slack tokens live only in the
  # gateway container env. Runs before the stack comes up (scripts/ec2-deploy.sh).
  # Gated behind the `hermes` profile. PLA-244, PLA-277.
  #
  # Tool policy (config/mcp-registry.yaml, PLA-250): only the read-only `allow`
  # tier is whitelisted. The write-capable `approve` tier (wiki_content_*,
  # wiki_ingest, wiki_export) is intentionally left out: hermes has NO approval
  # gate for MCP tool calls (its approvals.mode covers shell commands only), so
  # including write tools would let any allowlisted Slack user mutate the wiki
  # without confirmation — violating "writes only behind explicit approval".
  # Re-enabling writes needs a real approval mechanism (separate issue).
  #
  # Slack behavior keys live in TWO places (hermes v0.17 schema, verified against
  # gateway/config.py + messaging/slack.md): top-level `slack:` holds
  # require_mention + unauthorized_dm_behavior; `platforms.slack:` holds
  # reply_to_mode + extra.reply_*. The platform itself enables from the SLACK_*
  # env tokens, not from these keys; access control is SLACK_ALLOWED_USERS.
  hermes-config-init:
    image: mikefarah/yq:4
    profiles:
      - hermes
    # root so chown works on a fresh (root-owned) volume; the file is handed back
    # to HERMES_UID/GID below so the gateway (which runs as that uid) can read it.
    user: "0:0"
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-home:/opt/data
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        CONFIG=/opt/data/config.yaml
        # -s (exists AND non-empty): also re-seed a stray 0-byte config so the
        # merge always runs against a valid YAML document.
        [ -s "$$CONFIG" ] || printf '{}\n' > "$$CONFIG"
        cat > /tmp/llm-wiki.yaml <<'YAML'
        url: http://mcp-proxy:18765/mcp
        headers:
          Authorization: "Bearer $${LLM_WIKI_MCP_BEARER_TOKEN}"
        timeout: 120
        connect_timeout: 60
        tools:
          include:
            - wiki_search
            - wiki_list
            - wiki_content_read
            - wiki_resolve
            - wiki_stats
            - wiki_lint
            - wiki_history
            - wiki_suggest
            - wiki_graph
            - wiki_index_status
            - wiki_spaces_list
          resources: false
          prompts: false
        YAML
        yq -i '
          .model.provider = "openai-codex"
          | .model.default = "gpt-5.5"
          | .mcp_servers."llm-wiki" = load("/tmp/llm-wiki.yaml")
          | .slack.require_mention = true
          | .slack.unauthorized_dm_behavior = "ignore"
          | .platforms.slack.reply_to_mode = "first"
          | .platforms.slack.extra.reply_in_thread = true
          | .platforms.slack.extra.reply_broadcast = false
        ' "$$CONFIG"
        chown "$${HERMES_UID:-10000}:$${HERMES_GID:-10000}" "$$CONFIG"
        echo "hermes-config-init: merged model.provider=openai-codex + mcp_servers.llm-wiki (read-only) + slack settings into $$CONFIG"

  # Internal-only OpenTelemetry Collector (contrib distribution — needs the
  # redaction processor + file exporter). Receives OTLP on the compose network
  # ONLY: gRPC otel-collector:4317, HTTP otel-collector:4318. On EC2 it stays
  # internal: no host publish (`expose:` only, never `ports:`), not routed by
  # Caddy/ALB, no public endpoint. Real team telemetry is sanitized in
  # otel/collector-config.yaml and exported file/local-first to the otel-data
  # volume on the box (no external egress). Gated behind the `otel` profile.
  # See docs/otel-collector.md.
  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.154.0}
    profiles:
      - otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # The otel-data named volume is root-owned on first mount; run as root so
    # the file exporter can write /var/lib/otel. Internal-only service.
    user: "0:0"
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-data:/var/lib/otel
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # n8n — RESERVED PLACEHOLDER, INTENTIONALLY DISABLED (PLA-251).
  #
  # n8n.agent.plady.io is a reserved hostname only; the public ALB returns 503
  # for it (infra/terraform/platform/alb.tf reserved_unavailable rule) until a
  # real runtime exists. PLA-251 explicitly forbids a live n8n runtime, so this
  # block is COMMENTED OUT and cannot start. A future teammate owns enabling it;
  # the block is the reserved slot + internal-target convention (n8n:5678).
  # Public exposure happens only behind the PLA-247 ingress (Caddy/ALB), never
  # via a host `ports:` mapping. Enable checklist: docs/n8n-placeholder.md.
  #
  # n8n:
  #   image: ${N8N_IMAGE:-n8nio/n8n:<pin>}
  #   profiles:
  #     - n8n
  #   environment:
  #     N8N_PORT: "5678"
  #     # Secrets (DB creds, N8N_ENCRYPTION_KEY) come from SSM at enable time,
  #     # e.g. /plady/agent-platform/<env>/n8n-encryption-key. Never commit values.
  #   expose:
  #     - "5678"          # internal target n8n:5678; public via PLA-247 ingress only
  #   restart: unless-stopped
  # ---------------------------------------------------------------------------

volumes:
  wiki-data:
  llm-wiki-config:
  hermes-home:
  otel-data:
