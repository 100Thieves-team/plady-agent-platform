services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - wiki-ui
      - mcp-proxy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      WIKI_DOMAIN_NAME: ${WIKI_DOMAIN_NAME:?Set WIKI_DOMAIN_NAME}
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/caddy/Caddyfile <<'CADDY'
        {
          email {$$ACME_EMAIL}
          acme_ca https://acme.zerossl.com/v2/DV90
        }

        {$$WIKI_DOMAIN_NAME} {
          encode gzip

          handle /mcp* {
            reverse_proxy mcp-proxy:18765
          }

          handle {
            reverse_proxy wiki-ui:1313
          }
        }
        CADDY
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  llm-wiki:
    image: ${LLM_WIKI_IMAGE:?Set LLM_WIKI_IMAGE}
    environment:
      LLM_WIKI_NAME: 100thieves
      LLM_WIKI_DESCRIPTION: 100 Thieves team LLM Wiki
      LLM_WIKI_CONFIG: /config/config.toml
      LLM_WIKI_WORKSPACE: /workspace
    volumes:
      - ./wiki-workspace:/workspace
      - llm-wiki-config:/config
    expose:
      - "18765"
    restart: unless-stopped

  mcp-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - llm-wiki
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN}
    command:
      - /bin/sh
      - -ec
      - |
        cat >/tmp/mcp.conf.template <<'NGINX'
        server {
          listen 18765;
          resolver 127.0.0.11 valid=10s ipv6=off;

          location / {
            if ($$http_authorization != "Bearer ${MCP_BEARER_TOKEN}") {
              add_header WWW-Authenticate "Bearer" always;
              return 401;
            }

            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Authorization $$http_authorization;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            set $$llm_wiki_upstream llm-wiki:18765;
            proxy_pass http://$$llm_wiki_upstream;
          }
        }
        NGINX
        envsubst '$${MCP_BEARER_TOKEN}' </tmp/mcp.conf.template >/etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
    expose:
      - "18765"
    restart: unless-stopped

  wiki-ui:
    image: ${WIKI_UI_IMAGE:?Set WIKI_UI_IMAGE}
    depends_on:
      - llm-wiki
    working_dir: /workspace/site
    environment:
      WIKI_DOMAIN_NAME: ${WIKI_DOMAIN_NAME:?Set WIKI_DOMAIN_NAME}
    command: >-
      sh -c 'until [ -d /workspace/wiki ]; do echo "waiting for llm-wiki workspace..."; sleep 1; done; hugo server --bind 0.0.0.0 --port 1313 --baseURL https://$${WIKI_DOMAIN_NAME}/ --buildDrafts --destination /tmp/hugo-public --cacheDir /tmp/hugo-cache --noBuildLock --disableFastRender'
    volumes:
      - ./wiki-workspace:/workspace
      - ./llm-wiki-hugo-cms/site:/workspace/site:ro
    expose:
      - "1313"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  llm-wiki-config:
