      R7: 34cff5be
      C.room.create: 664b0379
      C.room.create_batch: 2e9644b6
      G.room.create#account-active: 2c88b3d6
      G.room.create#duplicate-slot-left: de0c2c20
      G.room.create#headcount-range: c60b43b0
      G.room.create#interview-stage-required: a7da0639
      G.room.create#login-required: 1fb811eb
      G.room.create#offline-region-required: f2f6d20e
      G.room.create#participation-slot-left: a402b414
      G.room.create#qna-type-only: a8802c6d
      G.room.create#schedule-not-passed: 4c515d31
      G.room.create_batch#each-schedule-passes-create: 34e5c6de
      G.room.create_batch#schedule-count-within-limit: 5b36f429

  - id: S2
    actor: qa-host
    gates:
      R146: [G.room.update]
      R147: [G.room.cancel]
      R148: [G.participation.cancel]
    variants:
      - key: happy
        kind: happy
        title: 방장이 모집 중인 룸의 정보를 고친다
        checks: [C.room.update]
        mode: manual
        manual_reason: no_api
      - key: cancel
        kind: branch
        at: R147
        title: 일반 참여자가 없는 모집 중인 룸을 방장이 취소한다
        given: 방장만 있는 모집 중인 룸
        then: 취소 200
        checks: [C.room.cancel]
        mode: manual
        manual_reason: no_api
      - key: host-leave
        kind: branch
        at: R148
        title: 일반 참여자가 있으면 방장이 나가고 가장 먼저 참여한 참여자가 방장이 된다
      - key: room-recruiting
        kind: reject
        at: R147
        title: 이미 취소한 룸을 다시 취소하면 E1410 으로 거절된다
        given: 방장이 한 번 취소한 룸
        then: 409 E1410
        checks: [G.room.cancel#room-recruiting]
        mode: manual
        manual_reason: no_api
      - key: update.host-only
        kind: reject
        at: R146
        title: 방장이 아닌 사람이 룸 정보를 고치면 E1406 으로 거절된다
        then: E1406
        checks: [G.room.update#host-only]
        mode: manual
        manual_reason: no_api
      - key: max-headcount-not-below-joined
        kind: reject
        at: R146
        title: 최대 모집 인원을 지금 참여 인원보다 적게 고치면 E1417 로 거절된다
        then: E1417
        checks: [G.room.update#max-headcount-not-below-joined]
        mode: manual
        manual_reason: no_api
      - key: update.room-recruiting
        kind: reject
        at: R146
        title: 모집 중이 아닌 룸을 고치면 E1418 로 거절된다
        then: E1418
        checks: [G.room.update#room-recruiting]
        mode: manual
        manual_reason: no_api
      - key: cancel.host-only
        kind: reject
        at: R147
        title: 방장이 아닌 사람이 룸을 취소하면 E1406 으로 거절된다
        then: E1406
        checks: [G.room.cancel#host-only]
        mode: manual
        manual_reason: no_api
      - key: no-other-joined-members
        kind: reject
        at: R147
        title: 일반 참여자가 있는 룸을 취소하면 E1420 으로 거절된다
        then: E1420
        checks: [G.room.cancel#no-other-joined-members]
        mode: manual
        manual_reason: no_api
      - key: own-participation
        kind: reject
        at: R148
        title: 다른 사람의 참여를 대신 취소하면 E1419 로 거절된다
        checks: [G.participation.cancel#own-participation]
        then: E1419
      - key: participation-joined
        kind: reject
        at: R148
        title: 이미 끝난 참여를 다시 취소하면 E1419 로 거절된다
        checks: [G.participation.cancel#participation-joined]
        then: E1419
