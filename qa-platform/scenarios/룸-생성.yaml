# 「룸 생성」 PRD 2장의 시나리오를 따른다. 시나리오 제목과 단계는 PRD 에서 읽는다 (docs/qa-platform-scenarios.md §5).
# 변형 상태와 테스트 없는 거절 규칙은 플랫폼이 스크립트·TC 목록·자동화 제외를 보고 계산한다.
feature: 룸 생성
scenarios:
  - id: S1
    actor: qa-host
    gates:
      R6: [G.room.create]
      R143: [G.room.create_batch]
    variants:
      - key: happy
        kind: happy
        title: 온라인 룸을 만들면 모집 중으로 열리고 상세의 방장이 본인이다
        given: 활성 룸이 없는 방장
        then: 생성 200, 상태 RECRUITING, 상세의 방장이 본인
        checks: [C.room.create, 'op.createRoom:200']
      - key: pasted-posting
        kind: branch
        at: R3
        title: 목록에 없는 공고는 링크를 붙여 그 자리에서 만든다
        checks: [PRD.룸-생성.4.1#1, 'op.createJobPosting:200']
      - key: batch
        kind: branch
        at: R143
        title: 진행 일정을 여러 개 고르면 같은 설정의 룸이 일정 수만큼 만들어진다
        checks: [C.room.create_batch]
      - key: headcount-range
        kind: reject
        at: R6
        title: 최대 모집 인원이 최소 진행 인원보다 작으면 E1402 로 거절된다
        given: minParticipants 4, maxParticipants 2
        then: E1402, 룸이 만들어지지 않는다
        checks: [G.room.create#headcount-range]
      - key: creation-limit
        kind: extra
        title: 중복 생성 제한 조회는 없는 공고 id 에도 404 가 아니라 0개로 답한다
        checks: ['op.roomCreationLimit:200']
      - key: account-active
        kind: reject
        at: R6
        title: 이용이 제한된 계정이 룸을 만들면 E1002 로 거절된다
        checks: [G.room.create#account-active]
        then: E1002
      - key: duplicate-slot-left
        kind: reject
        at: R6
        title: 같은 회사·공고·직무의 활성 룸이 이미 3개인데 또 만들면 E1427 로 거절된다
        checks: [G.room.create#duplicate-slot-left]
        then: E1427
      - key: login-required
        kind: reject
        at: R6
        title: 로그인하지 않고 룸을 만들면 E1102 로 거절된다
        checks: [G.room.create#login-required]
        then: E1102
      - key: participation-slot-left
        kind: reject
        at: R6
        title: 참여 중인 룸이 이미 3개인데 룸을 만들면 E1425 로 거절된다
        checks: [G.room.create#participation-slot-left]
        then: E1425
      - key: interview-stage-required
        kind: reject
        at: R6
        title: 면접 차수를 고르지 않고 룸을 만들면 거절된다
        checks: [G.room.create#interview-stage-required]
      - key: offline-region-required
        kind: reject
        at: R6
        title: 오프라인 룸에 지역을 넣지 않으면 거절된다
        checks: [G.room.create#offline-region-required]
      - key: qna-type-only
        kind: reject
        at: R6
        title: 질의응답형이 아닌 면접 유형을 고르면 거절된다
        checks: [G.room.create#qna-type-only]
      - key: each-schedule-passes-create
        kind: reject
        at: R143
        title: 여러 일정 중 하나라도 생성 조건에 맞지 않으면 거절된다
        checks: [G.room.create_batch#each-schedule-passes-create]
      - key: schedule-count-within-limit
        kind: reject
        at: R143
        title: 고를 수 있는 일정 개수를 넘기면 거절된다
        checks: [G.room.create_batch#schedule-count-within-limit]
    basis:
      R1: 77abae97
      R2: e7be3cf6
      R3: e273f459
      R4: ad7cc705
