# 「룸 진행 확정」 PRD 2장의 시나리오를 따른다. 시나리오 제목과 단계는 PRD 에서 읽는다 (docs/qa-platform-scenarios.md §5).
feature: 룸 진행 확정
scenarios:
  - id: S1
    actor: qa-host
    gates:
      R4: [G.room.confirm]
      R47: [G.room.change_schedule]
      R48: [G.participation.cancel]
    variants:
      - key: happy
        kind: happy
        title: 최소 진행 인원이 모인 모집 중 룸을 방장이 확정하면 진행 확정 상태가 된다
        given: 참여자가 최소 진행 인원만큼 모인 모집 중인 룸
        then: 확정 200, 룸 상태 CONFIRMED
        checks: [C.room.confirm, 'op.confirmRoom:200']
      - key: schedule-change-by-cs
        kind: branch
        at: R47
        title: 진행 확정 뒤 일정을 바꿔야 하면 서비스가 아니라 CS 문의로 처리한다
        mode: manual
        manual_reason: no_api
      - key: leave-after-confirm
        kind: branch
        at: R48
        title: 진행 확정 뒤에도 참여자가 직접 참여를 취소할 수 있고 취소 이력이 남는다
        given: 진행 확정된 룸의 참여자
        then: 나가기 200
        checks: [C.participation.cancel, 'op.roomLeave:200']
      - key: host-only
        kind: reject
        at: R4
        title: 방장이 아닌 참여자가 진행을 확정하면 E1406 으로 거절된다
        then: E1406
        checks: [G.room.confirm#host-only]
        written_by: hermes
      - key: min-headcount-met
        kind: reject
        at: R4
        title: 최소 진행 인원이 모이지 않은 룸을 확정하면 E1421 로 거절된다
        then: E1421
        checks: [G.room.confirm#min-headcount-met]
        written_by: hermes
      - key: confirm.room-recruiting
        kind: reject
        at: R4
        title: 이미 확정되었거나 모집 중이 아닌 룸을 확정하면 E1410 으로 거절된다
        then: E1410
        checks: [G.room.confirm#room-recruiting]
        written_by: hermes
      - key: schedule-not-passed
        kind: reject
        at: R4
        title: 진행 일정이 지난 룸을 확정하면 E1422 로 거절된다
        then: E1422
        checks: [G.room.confirm#schedule-not-passed]
        written_by: hermes
      - key: change-schedule.room-recruiting
        kind: reject
        at: R47
        title: 진행 확정 뒤 서비스에서 일정을 바꾸려 하면 거절된다
        checks: [G.room.change_schedule#room-recruiting]
        mode: manual
        manual_reason: no_api
      - key: own-participation
        kind: reject
        at: R48
        title: 다른 사람의 참여를 대신 취소하면 E1419 로 거절된다
        checks: [G.participation.cancel#own-participation]
        then: E1419
      - key: participation-joined
        kind: reject
        at: R48
        title: 이미 끝난 참여를 다시 취소하면 E1419 로 거절된다
        checks: [G.participation.cancel#participation-joined]
        then: E1419
    basis:
      R1: bce27098
      R2: c45af1eb
      R3: 5e5aec3d
