# 「회원 및 프로필」 PRD 2장의 시나리오를 따른다. 시나리오 제목과 단계는 PRD 에서 읽는다 (docs/qa-platform-scenarios.md §5).
feature: 회원 및 프로필
scenarios:
  - id: S1
    gates:
      R2: [G.member.mutate]
      R3: [G.member.login]
      R4: [G.member.signup]
      R168: [G.member.login, G.member.restore]
    variants:
      - key: happy
        kind: happy
        title: 비로그인 사용자가 Google 계정으로 최초 로그인해 계정 생성 후 기존 참여 또는 생성 흐름으로 복귀한다.
        given: 로그인 전에 참여할 룸이 있는지 확인하려는 신규 사용자
        then: 최초 로그인 시 계정이 생성되고 닉네임이 자동 부여되며 로그인 완료 후 기존 참여 또는 생성 흐름으로 바로 복귀한다.
        checks: [C.member.signup, C.member.login]
        written_by: hermes
      - key: login-required
        kind: reject
        at: R2
        title: 로그인하지 않고 참여·생성을 하려 하면 E1102 로 거절된다
        checks: [G.member.mutate#login-required]
        then: E1102
      - key: account-active
        kind: reject
        at: R2
        title: 이용이 제한된 계정이 참여·생성을 하려 하면 거절된다
        checks: [G.room.create#account-active, G.application.submit#account-active]
      - key: restore-withdrawn-google-account
        kind: happy
        at: R168
        title: 탈퇴했던 회원이 같은 Google 계정으로 로그인하면 계정 복구를 확인하고 복구된 계정으로 로그인한다.
        given: 탈퇴했던 회원이 같은 Google 계정으로 다시 로그인하려는 사용자
        then: 탈퇴한 계정이라는 안내와 계정 복구 확인을 거친 뒤, 복구된 계정으로 로그인한다.
        checks: [G.member.login#not-withdrawn, C.member.restore, G.member.restore#oauth-authenticated, G.member.restore#withdrawn, G.member.restore#confirmed-in-window, C.member.login]
        written_by: hermes
    basis:
      R1: 82e80c6c
      R2: '63959874'
      R3: ef20fc21
      R168: 51cab758
      R4: 752cc8b4
      R5: b7dfcc37
      C.member.login: 672eaf51
      C.member.restore: e20143d3
      C.member.signup: c62a6dad
      G.application.submit#account-active: 213037ad
      G.member.login#not-withdrawn: 0bc47ed0
      G.member.login#oauth-authenticated: c1c687c0
      G.member.login#oauth-id-matches-member: 9c0838ee
      G.member.mutate#account-active: c720dad5
      G.member.mutate#login-required: 5518d7de
      G.member.restore#confirmed-in-window: e66cff43
      G.member.restore#oauth-authenticated: e79f05fb
      G.member.restore#withdrawn: 39e3cae7
      G.member.signup#oauth-authenticated: 1bac2174
      G.member.signup#oauth-id-not-registered: 0db2473a
      G.member.signup#terms-agreed: baa5bf6f
      G.room.create#account-active: 2c88b3d6

  - id: S2
    actor: qa-guest
    gates:
      R6: [G.member.edit_profile]
      R129: [G.member.edit_profile, G.member.set_nickname]
      R130: [G.member.edit_profile]
      R131: [G.resume.create]
      R132: [G.resume.rename]
      R133: [G.resume.set_default]
      R134: [G.resume.delete]
      R136: [G.member.withdraw]
    variants:
      - key: happy
        kind: happy
        title: 사용자가 마이페이지에서 프로필과 이력서를 수정·보관·기본 지정·삭제한다.
        given: 직무나 자기소개를 변경하려는 기존 사용자
        then: 프로필을 조회·수정하고 이력서를 업로드해 보관하며 업로드 시점에 AI 요약이 함께 저장된다.
        checks: [C.member.update_profile, C.resume.create, C.resume.rename, C.resume.set_default, C.resume.delete]
        written_by: hermes
      - key: logout
        kind: branch
        at: R135
        title: 사용자가 현재 기기에서 로그아웃한다.
        given: 사용자는 마이페이지에서 프로필을 조회·수정한다.
        then: 현재 기기에서 로그아웃한다.
        written_by: hermes
        checks: ['op.authLogout:200']
      - key: withdraw
        kind: branch
        at: R136
        title: 사용자가 회원 탈퇴를 요청하고 탈퇴 전에 안내를 확인한다.
        given: 사용자는 회원 탈퇴를 요청할 수 있다.
        then: 탈퇴 전에 안내를 확인한다.
        checks: [C.member.withdraw]
        written_by: hermes
      - key: nickname-check
        kind: extra
        title: 닉네임을 바꾸기 전에 쓸 수 있는지 확인한다
        checks: ['op.nicknameAvailability:200']
      - key: own-profile-only
        kind: reject
        at: R6
        title: 다른 사람의 프로필을 고치면 거절된다
        checks: [G.member.edit_profile#own-profile-only]
        mode: manual
        manual_reason: structural
      - key: length-limit
        kind: reject
        at: R129
        title: 닉네임이 길이 제한을 넘으면 E1005 로 거절된다
        checks: [G.member.set_nickname#length-limit]
        then: E1005
      - key: nickname-not-taken
        kind: reject
        at: R129
        title: 다른 회원이 쓰는 닉네임으로 바꾸면 E1007 로 거절된다
        checks: [G.member.set_nickname#nickname-not-taken]
        then: E1007
      - key: no-forbidden-chars
        kind: reject
        at: R129
        title: 닉네임에 쓸 수 없는 문자를 넣으면 E1005 로 거절된다
        checks: [G.member.set_nickname#no-forbidden-chars]
        then: E1005
      - key: not-policy-violating
        kind: reject
        at: R129
        title: 운영 정책에 어긋나는 닉네임을 쓰면 E1005 로 거절된다
        checks: [G.member.set_nickname#not-policy-violating]
        then: E1005
      - key: resume-slot-left
        kind: reject
        at: R131
        title: 이력서가 이미 10개인데 또 올리면 E1011 로 거절된다
        checks: [G.resume.create#resume-slot-left]
        then: E1011
      - key: account-active
        kind: reject
        at: R131
        title: 이용이 제한된 계정이 이력서를 올리면 거절된다
        checks: [G.resume.create#account-active]
      - key: rename.resume-not-deleted
        kind: reject
        at: R132
        title: 지운 이력서의 이름을 고치면 E1010 으로 거절된다
        then: E1010
        checks: [G.resume.rename#resume-not-deleted]
        mode: manual
        manual_reason: no_api
      - key: rename.resume-owner-only
        kind: reject
        at: R132
        title: 다른 사람의 이력서 이름을 고치면 E1010 으로 거절된다
        then: E1010
        checks: [G.resume.rename#resume-owner-only]
        mode: manual
        manual_reason: no_api
      - key: set-default.resume-not-deleted
        kind: reject
        at: R133
        title: 지운 이력서를 기본으로 지정하면 E1010 으로 거절된다
        checks: [G.resume.set_default#resume-not-deleted]
        then: E1010
      - key: set-default.resume-owner-only
        kind: reject
        at: R133
        title: 다른 사람의 이력서를 기본으로 지정하면 E1010 으로 거절된다
        checks: [G.resume.set_default#resume-owner-only]
        then: E1010
      - key: summary-done
        kind: reject
        at: R133
        title: AI 요약이 끝나지 않은 이력서를 기본으로 지정하면 E1012 로 거절된다
        checks: [G.resume.set_default#summary-done]
        then: E1012
      - key: delete.resume-not-deleted
        kind: reject
        at: R134
        title: 이미 지운 이력서를 또 지우면 E1010 으로 거절된다
        checks: [G.resume.delete#resume-not-deleted]
        then: E1010
      - key: delete.resume-owner-only
        kind: reject
        at: R134
        title: 다른 사람의 이력서를 지우면 E1010 으로 거절된다
        checks: [G.resume.delete#resume-owner-only]
        then: E1010
    basis:
