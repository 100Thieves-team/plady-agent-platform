            application/json:
              schema:
                $ref: '#/components/schemas/v1-closing-questions-me910352763'
              examples:
                deleteQaRoom-e2201:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E2201\",\n    \"message\" : \"제목이 [QA]로 시작하는 테스트 데이터만 삭제할 수 있습니다.\",\n    \"data\" : null\n\
                    \  }\n}"
  /v1/rooms/{roomId}/applications/{applicationId}/accept:
    post:
      tags:
      - v1
      summary: 참가 신청 수락
      description: 방장이 대기 중인 신청을 수락한다(「룸 참여」 §4.4). 서버가 정원을 최종 확인한 뒤 신청자를 참여자로 등록하고
        현재 인원을 증가시킨다. 정원에 도달하면 모집 상태가 마감(CLOSED)으로 계산된다. 마지막 자리를 두고 동시 수락이 몰려도 1건만 성공한다(룸
        행 잠금). 방장만 처리할 수 있고(E1406), 이미 처리된 신청(E1409)·모집 중이 아닌 방(E1410)·정원 초과(E1411)는
        거부된다. 신청자의 참여 슬롯이 이미 차 있으면(참여 중인 룸 3개, 「룸 참여」 §4.1) 참여자로 등록하지 않고 그 신청을 SLOT_EXCEEDED
        로 정리한다. 방장의 요청은 실패하지 않으므로 200 이며, 결과는 status 로 구분한다.
      operationId: acceptApplication
      parameters:
      - name: roomId
        in: path
        description: 룸 id (UUID)
        required: true
      - name: applicationId
        in: path
        description: 수락할 신청 id
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                acceptApplication:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"applicationId\"\
                    \ : 3001,\n    \"status\" : \"ACCEPTED\",\n    \"statusLabel\" :\
                    \ \"수락\",\n    \"recruit\" : {\n      \"current\" : 2,\n      \"\
                    max\" : 6,\n      \"recruitStatus\" : \"RECRUITING\",\n      \"\
                    recruitStatusLabel\" : \"모집 중\"\n    }\n  },\n  \"error\" : null\n\
                    }"
