  /v1/dev/rooms/{roomId}:
    delete:
      tags:
      - v1
      summary: '[dev] QA 룸 삭제'
      description: local·local-dev·dev 프로파일에서만 등록되는 dev 전용 Test API 다(staging·live 에는 경로가 없다). QA 플랫폼이 테스트 데이터를 정리하는 용도이며 검증 대상 API 가 아니다. 룸 하나를 참가 신청·참여·출석·진행·질문·클로징·후기·방명록 등 룸에 매인 행까지 하드 삭제한다. 제목이 [QA]
        로 시작하지 않으면 409(E2201), 룸이 없으면 404(E1405), roomId 가 UUID 가 아니면 400(E400).
      operationId: deleteQaRoom
      parameters:
      - name: roomId
        in: path
        description: 삭제할 룸 id (UUID)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1-dev-rooms-roomId-1258339407'
              examples:
                deleteQaRoom:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"deleted\" : {\n      \"rooms\" : 1,\n      \"roomStatusLogs\" : 2,\n      \"applications\" : 4,\n      \"participants\" :\
                    \ 3,\n      \"resumeSubmissions\" : 3,\n      \"interviewPlans\" : 0,\n      \"interviewRounds\" : 0,\n      \"roundAssignments\" : 0,\n      \"roundFeedbacks\" : 2,\n      \"questions\"\
                    \ : 5,\n      \"answerSummaries\" : 2,\n      \"questionComments\" : 2,\n      \"closingResponses\" : 3,\n      \"questionVotes\" : 6,\n      \"attendances\" : 3,\n      \"reviews\"\
                    \ : 2,\n      \"reviewTags\" : 4,\n      \"reviewSkips\" : 1,\n      \"guestbooks\" : 1,\n      \"guestbookPosts\" : 2,\n      \"resumes\" : 0,\n      \"profiles\" : 0,\n      \"termsAgreements\"\
                    \ : 0,\n      \"refreshTokens\" : 0,\n      \"webPushSubscriptions\" : 0,\n      \"socialAccounts\" : 0,\n      \"members\" : 0,\n      \"total\" : 46\n    }\n  },\n  \"error\" : null\n\
                    }"
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1-closing-questions-me910352763'
              examples:
                deleteQaRoom-e400:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E400\",\n    \"message\" : \"요청 형식이 올바르지 않습니다.\",\n    \"data\" : {\n      \"roomId\" : \"type\
                    \ mismatch\"\n    }\n  }\n}"
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1-closing-questions-me910352763'
              examples:
                deleteQaRoom-e1405:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1405\",\n    \"message\" : \"방을 찾을 수 없습니다.\",\n    \"data\" : null\n  }\n}"
        '409':
          description: '409'
