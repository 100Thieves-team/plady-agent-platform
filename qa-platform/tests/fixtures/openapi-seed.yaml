openapi: 3.0.1
info:
  title: moimyeon dev (seed 케이스용 발췌, 2026-09-21)
  version: fixture
paths:
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                jobRoles:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"groups\" : [ {\n      \"code\" : \"IT_개발\",\n      \"displayName\" : \"IT·개발\",\n      \"roles\" : [ {\n        \"jobRoleId\"\
                    \ : 1,\n        \"code\" : \"서버_백엔드\",\n        \"displayName\" : \"서버·백엔드\"\n      }, {\n        \"jobRoleId\" : 2,\n        \"code\" : \"프론트엔드\",\n        \"displayName\" : \"프론트엔드\"\
                    \n      } ]\n    } ]\n  },\n  \"error\" : null\n}"
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 오프라인 룸 지역 선택 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가 관리하는 참조 데이터다.
      operationId: regions
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                regions:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"sidos\" : [ {\n      \"name\" : \"서울특별시\",\n      \"shortName\" : \"서울\",\n      \"sigungus\" : [ {\n        \"sigunguId\"\
                    \ : 1,\n        \"name\" : \"강남구\"\n      }, {\n        \"sigunguId\" : 2,\n        \"name\" : \"마포구\"\n      } ]\n    } ]\n  },\n  \"error\" : null\n}"
  /v1/rooms:
    get:
      tags:
      - v1
      summary: 룸 탐색 목록 조회
      description: 조건에 맞는 모집 중인 룸 목록을 조회한다(「룸 탐색」 §4.1~§4.3). 비로그인도 조회할 수 있다. 필터는 AND 로 결합하고, 완료·취소·일정 경과 룸은 제외된다. 커서 페이지네이션이며 nextCursor 가 null 이면 마지막 페이지다. 커서는 불투명 토큰이라 해석하지 말고 그대로 다시 보낸다. 잘못된 필터·정렬 값은
        그 값만 무시하고 나머지 조건으로 조회한다. 회사·공고·직무·지역 표시명은 참조가 끊어졌을 때(회사 미매칭 공고, 폐기된 직무 등) null 로 내려가고 룸 자체는 목록에 남는다.
      operationId: rooms
      parameters:
      - name: companyId
        in: query
        description: 회사 id 필터 (선택). 그 회사의 공고로 만든 룸만 남는다
        required: false
      - name: jobPostingId
        in: query
        description: 채용 공고 id 필터 (선택). 회사와 함께 주면 둘을 모두 만족하는 공고만 남는다
        required: false
      - name: jobRoleId
        in: query
        description: 직무 id 필터 (선택)
        required: false
      - name: round
        in: query
        description: 면접 단계 필터 (FIRST | SECOND | THIRD | ETC, 선택). 지원하지 않는 값은 이 조건만 무시한다
        required: false
      - name: method
        in: query
        description: 진행 방식 필터 (ONLINE | OFFLINE, 선택). 지원하지 않는 값은 이 조건만 무시한다
        required: false
      - name: sigunguId
        in: query
        description: 오프라인 지역 시군구 id 필터 (선택)
        required: false
      - name: startFrom
        in: query
        description: 조회 시작 일시 (ISO-8601, 선택). 시간까지 포함한 한 구간이다
        required: false
      - name: startTo
        in: query
        description: 조회 종료 일시 (ISO-8601, 선택). 시작보다 앞서면 400 이다
        required: false
      - name: availableOnly
        in: query
        description: 참여 가능한 룸만 보기 토글 (기본 false)
        required: false
      - name: sort
        in: query
        description: 정렬 (SCHEDULE 일정 빠른 순 | RECENT 최근 생성순, 기본 SCHEDULE). 지원하지 않는 값은 기본 정렬로 처리한다
        required: false
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor (선택). 정렬을 바꾸면 버리고 처음부터 조회한다
        required: false
      - name: size
        in: query
        description: 페이지 크기 (1~50, 기본 20). 범위 밖이면 기본값으로 조회한다
        required: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                rooms:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"rooms\" : [ {\n      \"roomId\" : \"01920000-0000-7000-8000-000000000001\",\n      \"title\" : \"달빛페이 프론트 1차, 실전처럼 봐요\",\n\
                    \      \"company\" : {\n        \"companyId\" : 1,\n        \"name\" : \"달빛페이\"\n      },\n      \"jobPosting\" : {\n        \"jobPostingId\" : 1,\n        \"postingName\" : \"프론트엔드\
                    \ 개발자 (결제플랫폼)\"\n      },\n      \"jobRole\" : {\n        \"jobRoleId\" : 1,\n        \"code\" : \"FRONTEND_DEVELOPER\",\n        \"displayName\" : \"프론트엔드 개발\"\n      },\n      \"round\"\
                    \ : \"FIRST\",\n      \"roundLabel\" : \"1차\",\n      \"type\" : \"JOB\",\n      \"typeLabel\" : \"직무 면접\",\n      \"method\" : \"OFFLINE\",\n      \"methodLabel\" : \"오프라인\",\n    \
                    \  \"region\" : {\n        \"sigunguId\" : 1,\n        \"label\" : \"서울 강남구\"\n      },\n      \"schedule\" : {\n        \"date\" : \"2026-09-05\",\n        \"startTime\" : \"14:00\"\
                    ,\n        \"durationMinutes\" : 90\n      },\n      \"recruit\" : {\n        \"current\" : 3,\n        \"max\" : 8,\n        \"pending\" : 5,\n        \"recruitStatus\" : \"RECRUITING\"\
                    ,\n        \"recruitStatusLabel\" : \"모집 중\"\n      },\n      \"viewer\" : {\n        \"isHost\" : false,\n        \"isParticipating\" : false,\n        \"hasRemovalHistory\" : false,\n\
                    \        \"latestApplicationStatus\" : null,\n        \"member\" : {\n          \"isActive\" : true,\n          \"participationSlots\" : {\n            \"occupied\" : 1,\n          \
                    \  \"limit\" : 3\n          },\n          \"pendingApplicationQuota\" : {\n            \"occupied\" : 0,\n            \"limit\" : 3\n          }\n        }\n      }\n    } ],\n    \"\
                    sort\" : \"SCHEDULE\",\n    \"totalCount\" : 1,\n    \"nextCursor\" : \"djE6U0NIRURVTEU6MjAyNi0wOS0wNVQxNDowMDowMTIzNA\"\n  },\n  \"error\" : null\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                rooms-e400-cursor:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E400\",\n    \"message\" : \"요청 형식이 올바르지 않습니다.\",\n    \"data\" : null\n  }\n}"
    post:
      tags:
      - v1
      summary: 룸 생성
      description: 생성 위저드(「룸 생성」 §4.1~§4.8)의 입력을 한 번에 받아 룸을 만들고 즉시 모집(RECRUITING) 상태로 등록한다(§4.8). 공고를 고르면 회사가 함께 확정되므로 룸에는 회사를 따로 저장하지 않는다(공고 → 회사 파생). 직무·지역·이력서는 카탈로그/보관함 참조 id 를 받는다. 더블클릭·재시도로 같은 요청이
        중복 전송되면 룸을 새로 만들지 않고 이미 만들어진 룸을 그대로 돌려준다 — 같은 방장의 같은 공고·직무·시각이면 같은 룸으로 본다. 이때 status 는 그 룸의 현재 상태라 RECRUITING 이 아닐 수 있다.
      operationId: createRoom
      requestBody:
        content:
          application/json:
            examples:
              createRoom-e1402-min-participants:
                value: "{\n  \"postingId\" : 1,\n  \"jobRoleId\" : 1,\n  \"round\" : \"FIRST\",\n  \"type\" : \"JOB\",\n  \"method\" : \"OFFLINE\",\n  \"sigunguId\" : 1,\n  \"minParticipants\" : 1,\n  \"\
                  maxParticipants\" : 6,\n  \"schedule\" : {\n    \"date\" : \"2026-08-01\",\n    \"startTime\" : \"14:00\",\n    \"durationMinutes\" : 90\n  },\n  \"title\" : \"달빛페이 프론트 1차, 실전처럼 봐요\",\n\
                  \  \"description\" : \"실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.\",\n  \"resumeId\" : \"01920000-0000-7000-8000-000000000101\",\n  \"resumePublic\" : true\n}"
              createRoom:
                value: "{\n  \"postingId\" : 1,\n  \"jobRoleId\" : 1,\n  \"round\" : \"FIRST\",\n  \"type\" : \"JOB\",\n  \"method\" : \"OFFLINE\",\n  \"sigunguId\" : 1,\n  \"minParticipants\" : 3,\n  \"\
                  maxParticipants\" : 6,\n  \"schedule\" : {\n    \"date\" : \"2026-08-01\",\n    \"startTime\" : \"14:00\",\n    \"durationMinutes\" : 90\n  },\n  \"title\" : \"달빛페이 프론트 1차, 실전처럼 봐요\",\n\
                  \  \"description\" : \"실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.\",\n  \"resumeId\" : \"01920000-0000-7000-8000-000000000101\",\n  \"resumePublic\" : true\n}"
              createRoom-e1402-max-participants:
                value: "{\n  \"postingId\" : 1,\n  \"jobRoleId\" : 1,\n  \"round\" : \"FIRST\",\n  \"type\" : \"JOB\",\n  \"method\" : \"OFFLINE\",\n  \"sigunguId\" : 1,\n  \"minParticipants\" : 3,\n  \"\
                  maxParticipants\" : 9,\n  \"schedule\" : {\n    \"date\" : \"2026-08-01\",\n    \"startTime\" : \"14:00\",\n    \"durationMinutes\" : 90\n  },\n  \"title\" : \"달빛페이 프론트 1차, 실전처럼 봐요\",\n\
                  \  \"description\" : \"실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.\",\n  \"resumeId\" : \"01920000-0000-7000-8000-000000000101\",\n  \"resumePublic\" : true\n}"
              createRoom-e1402:
                value: "{\n  \"postingId\" : 1,\n  \"jobRoleId\" : 1,\n  \"round\" : \"FIRST\",\n  \"type\" : \"JOB\",\n  \"method\" : \"OFFLINE\",\n  \"sigunguId\" : 1,\n  \"minParticipants\" : 3,\n  \"\
                  maxParticipants\" : 2,\n  \"schedule\" : {\n    \"date\" : \"2026-08-01\",\n    \"startTime\" : \"14:00\",\n    \"durationMinutes\" : 90\n  },\n  \"title\" : \"달빛페이 프론트 1차, 실전처럼 봐요\",\n\
                  \  \"description\" : \"실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.\",\n  \"resumeId\" : \"01920000-0000-7000-8000-000000000101\",\n  \"resumePublic\" : true\n}"
      responses:
        '400':
          description: '400'
          content:
            application/json:
              examples:
                createRoom-e1402-min-participants:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1402\",\n    \"message\" : \"허용된 인원수 범위가 아닙니다.\",\n    \"data\" : {\n      \"min\" : 1,\n \
                    \     \"max\" : 6\n    }\n  }\n}"
                createRoom-e1402-max-participants:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1402\",\n    \"message\" : \"허용된 인원수 범위가 아닙니다.\",\n    \"data\" : {\n      \"min\" : 3,\n \
                    \     \"max\" : 9\n    }\n  }\n}"
                createRoom-e1402:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1402\",\n    \"message\" : \"허용된 인원수 범위가 아닙니다.\",\n    \"data\" : {\n      \"min\" : 3,\n \
                    \     \"max\" : 2\n    }\n  }\n}"
        '200':
          description: '200'
          content:
            application/json:
              examples:
                createRoom:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"roomId\" : \"01920000-0000-7000-8000-000000000001\",\n    \"status\" : \"RECRUITING\"\n  },\n  \"error\" : null\n}"
  /v1/terms:
    get:
      tags:
      - v1
      summary: 현재 유효 약관 목록 조회
      description: 현재 유효한(ACTIVE) 약관 전체를 본문 포함으로 반환한다. 로그인 모달의 약관 링크에서 사용하므로 비로그인 접근을 허용한다.
      operationId: termsList
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                termsList:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"terms\" : [ {\n      \"termsId\" : \"7fd73936-4241-4a2d-891b-54eda590f94c\",\n      \"type\" : \"SERVICE\",\n      \"version\"\
                    \ : \"v1.0\",\n      \"title\" : \"모이면 이용약관\",\n      \"content\" : \"제1조(목적) 이 약관은 모이면 서비스의 이용 조건과 절차를 규정합니다.\",\n      \"required\" : true,\n      \"effectiveFrom\" : \"2026-07-01T00:00:00\"\
                    \n    }, {\n      \"termsId\" : \"f201b89a-6c58-495f-9fdb-05f0560f61c2\",\n      \"type\" : \"PRIVACY\",\n      \"version\" : \"v1.0\",\n      \"title\" : \"개인정보 처리방침\",\n      \"content\"\
                    \ : \"모이면은 회원 가입과 서비스 제공을 위해 최소한의 개인정보를 수집·이용합니다.\",\n      \"required\" : true,\n      \"effectiveFrom\" : \"2026-07-01T00:00:00\"\n    } ]\n  },\n  \"error\" : null\n}"
  /v1/auth/dev-sessions:
    post:
      tags:
      - v1
      summary: 개발 환경 액세스 토큰 발급
      description: local·local-dev·dev 프로파일에서 기존 회원 UUID로 Google OAuth를 거치지 않고 만료 없는 액세스 토큰을 응답한다. 회원이 없거나 탈퇴했으면 404(E1006), 요청 본문 형식이 잘못됐으면 400(E400)으로 응답한다.
      operationId: issueDevSession
      requestBody:
        content:
          application/json:
            examples:
              issueDevSession-e400:
                value: "{\n  \"memberId\" : \"not-a-uuid\"\n}"
              issueDevSession-e1006:
                value: "{\n  \"memberId\" : \"00000000-0000-0000-0000-000000000001\"\n}"
              issueDevSession:
                value: "{\n  \"memberId\" : \"00000000-0000-0000-0000-000000000001\"\n}"
      responses:
        '400':
          description: '400'
          content:
            application/json:
              examples:
                issueDevSession-e400:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E400\",\n    \"message\" : \"요청 형식이 올바르지 않습니다.\",\n    \"data\" : null\n  }\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                issueDevSession-e1006:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1006\",\n    \"message\" : \"회원을 찾을 수 없습니다.\",\n    \"data\" : null\n  }\n}"
        '200':
          description: '200'
          content:
            application/json:
              examples:
                issueDevSession:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"accessToken\" : \"access-token\"\n  },\n  \"error\" : null\n}"
  /v1/members/me:
    get:
      tags:
      - v1
      summary: 내 상태 조회
      description: 인증된 회원의 상태와 프로필을 반환한다. 닉네임은 가입 시 자동 부여되는 회원 속성이다. 프로필은 가입 시 빈 상태로 함께 만들어져 회원당 항상 하나 존재한다 — 아직 안 채운 값은 빈 문자열·빈 배열로 내려간다. profile 은 프로필 수정 응답의 data 와 동일한 모양이다. 액세스 토큰이 없거나 유효하지 않으면 401(E1102),
        토큰은 유효하지만 회원이 조회되지 않으면(탈퇴 등) 404(E1006)로 응답한다.
      operationId: memberMe
      responses:
        '401':
          description: '401'
          content:
            application/json;charset=UTF-8:
              examples:
                memberMe-e1102:
                  value: "{\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1102\",\n    \"data\" : null,\n    \"message\" : \"인증이 필요합니다.\"\n  },\n  \"result\" : \"ERROR\"\n}"
        '200':
          description: '200'
          content:
            application/json:
              examples:
                memberMe:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"data\" : {\n    \"memberId\" : \"2535d041-6cf3-40ae-a31f-1674a2eedbbf\",\n    \"email\" : \"user@example.com\",\n    \"nickname\" : \"차분한 펭귄\
                    \ 12\",\n    \"status\" : \"ACTIVE\",\n    \"profile\" : {\n      \"memberId\" : \"2535d041-6cf3-40ae-a31f-1674a2eedbbf\",\n      \"interestJobRoleIds\" : [ 1, 2 ],\n      \"bio\" :\
                    \ \"\",\n      \"interestCompanies\" : [ {\n        \"companyId\" : 1,\n        \"name\" : \"달빛페이\"\n      }, {\n        \"companyId\" : 2,\n        \"name\" : \"한빛커머스\"\n      } ]\n\
                    \    }\n  },\n  \"error\" : null\n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                memberMe-e1006:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"data\" : null,\n  \"error\" : {\n    \"code\" : \"E1006\",\n    \"message\" : \"회원을 찾을 수 없습니다.\",\n    \"data\" : null\n  }\n}"
  /v1/rooms/creation-limit:
    get:
      tags:
      - v1
      summary: 중복 생성 제한 조회
      description: 같은 회사·공고·직무로 내가 이미 만든 활성 룸이 몇 개인지 돌려준다(「룸 생성」 §4.7). 생성 화면이 경고를 띄울지 판단하는 데 쓴다. 활성은 모집 중·진행 확정·진행 중이며 취소·완료된 룸은 세지 않는다. 1~2개면 경고만 하고 생성은 통과하고, 3개면 생성이 409(E1427)로 거부된다. remaining 은 일정을
        여러 개 골라 일괄 생성할 때의 상한이기도 하다(§4.4). 존재하지 않는 공고·직무 id 를 보내도 404 가 아니라 0개로 답한다 — 참조 검증은 생성 시점의 일이다.
