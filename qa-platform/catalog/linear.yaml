# 백엔드 이슈를 Linear 에 만들 때의 설정 (docs/qa-platform-v2.md §17.5).
# 기능(시나리오 파일 이름 = PRD 문서) → Linear 프로젝트 이름. 표에 없으면 프로젝트를 비운다.
# Linear 프로젝트는 "세션 …", PRD 는 "룸 …" 이라 이름이 다르다.
projects:
  회원-및-프로필: 회원 및 프로필
  룸-생성: 세션 생성
  룸-탐색: 세션 탐색
  룸-참여-및-참여자-관리: 세션 참여(신청 및 수락) 및 참여자 관리
  룸-진행-확정: 세션 진행 확정
  룸-진행-마무리-및-출석: 세션 진행 마무리 및 출석
  룸-진행-준비: 세션 진행 준비
  룸-진행: 세션 진행
  유저-후기-및-신뢰-관리: 유저 후기 및 신뢰 관리

# 분류 → 라벨. bug 는 코드가 API 문서·규칙표와 다르다, decision 은 코드와 규칙표가 서로 달라 어느 쪽이 맞는지 정해야 한다
labels:
  bug: [Bug, Backend]
  decision: [Backend, 기획]
