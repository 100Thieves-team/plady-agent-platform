  - id: review.delete-and-resubmit
    title: 작성자가 제출한 후기를 삭제하고 같은 대상자에게 다시 제출한다
    suite: sanity
    variant: 유저-후기-및-신뢰-관리/S1/delete-and-resubmit
    domains:
    - review
    operations:
    - submitReview
    - deleteReview
    covers:
    - C.review.submit
    - C.review.delete
    - op.submitReview:201
    - op.deleteReview:200
    source:
    - PRD/유저 후기 및 신뢰 관리 §4.2
    - PRD/유저 후기 및 신뢰 관리 §4.3
    - PRD/유저 후기 및 신뢰 관리 §4.8
    - PRD/유저 후기 및 신뢰 관리 §6
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-ready-to-start
      with:
        title: '[QA] 후기 삭제 후 재제출 sanity {{rand}}'
    steps:
    - name: 룸 자동 완료 처리
      covers: []
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 대상 참여자에게 첫 번째 후기 제출
      covers:
      - C.review.submit
      - op.submitReview:201
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 시간을 잘 지켜요
          - 준비가 성실해요
          - 질문이 날카로워요
          content: '[QA] 삭제 후 재제출 검증을 위한 첫 번째 후기입니다.'
          anonymous: false
      expect:
        status: 201
        result: SUCCESS
        exists:
        - data.reviewId
      save:
        firstReviewId: data.reviewId
    - name: 작성자가 첫 번째 후기 삭제
      covers:
      - C.review.delete
      - op.deleteReview:200
      request:
        method: DELETE
        path: /v1/reviews/{{firstReviewId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 같은 대상 참여자에게 후기 재제출
      covers:
      - C.review.submit
      - op.submitReview:201
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 소통이 원활해요
          - 피드백이 구체적이에요
          content: '[QA] 삭제된 뒤 같은 대상자에게 다시 제출한 후기입니다.'
          anonymous: true
      expect:
        status: 201
        result: SUCCESS
        exists:
        - data.reviewId
      save:
        secondReviewId: data.reviewId
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

