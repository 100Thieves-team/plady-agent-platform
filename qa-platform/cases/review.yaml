  - id: review.delete-and-resubmit
    title: 작성자가 제출한 후기를 삭제하고 같은 대상자에게 다시 제출한다
    suite: sanity
    variant: 유저-후기-및-신뢰-관리/S1/delete-and-resubmit
    domains:
    - review
    operations:
    - submitReview
    - deleteReview
    covers:
    - C.review.submit
    - C.review.delete
    - op.submitReview:201
    - op.deleteReview:200
    source:
    - PRD/유저 후기 및 신뢰 관리 §4.2
    - PRD/유저 후기 및 신뢰 관리 §4.3
    - PRD/유저 후기 및 신뢰 관리 §4.8
    - PRD/유저 후기 및 신뢰 관리 §6
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-ready-to-start
      with:
        title: '[QA] 후기 삭제 후 재제출 sanity {{rand}}'
    steps:
    - name: 룸 자동 완료 처리
      covers: []
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 대상 참여자에게 첫 번째 후기 제출
      covers:
      - C.review.submit
      - op.submitReview:201
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 시간을 잘 지켜요
          - 준비가 성실해요
          - 질문이 날카로워요
          content: '[QA] 삭제 후 재제출 검증을 위한 첫 번째 후기입니다.'
          anonymous: false
      expect:
        status: 201
        result: SUCCESS
        exists:
        - data.reviewId
      save:
        firstReviewId: data.reviewId
    - name: 작성자가 첫 번째 후기 삭제
      covers:
      - C.review.delete
      - op.deleteReview:200
      request:
        method: DELETE
        path: /v1/reviews/{{firstReviewId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 같은 대상 참여자에게 후기 재제출
      covers:
      - C.review.submit
      - op.submitReview:201
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 소통이 원활해요
          - 피드백이 구체적이에요
          content: '[QA] 삭제된 뒤 같은 대상자에게 다시 제출한 후기입니다.'
          anonymous: true
      expect:
        status: 201
        result: SUCCESS
        exists:
        - data.reviewId
      save:
        secondReviewId: data.reviewId
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: review.not-already-written
    title: 같은 사람에게 후기를 두 번 쓰면 E2005 로 거절된다
    suite: sanity
    variant: 유저-후기-및-신뢰-관리/S1/not-already-written
    domains:
    - review
    operations:
    - submitReview
    covers:
    - G.review.write#not-already-written
    - op.submitReview:E2005
    source:
    - PRD/유저 후기 및 신뢰 관리 §3
    - PRD/유저 후기 및 신뢰 관리 §4.1
    - PRD/유저 후기 및 신뢰 관리 §4.3
    - PRD/유저 후기 및 신뢰 관리 §4.8
    - PRD/룸 진행 마무리 및 출석 §4.6
    - OpenAPI POST /v1/rooms/{roomId}/reviews
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 유저 후기 중복 제출 거절 sanity {{rand}}'
    steps:
    - name: 룸을 자동 완료 처리해 확정 참여자 전원을 출석으로 기록한다
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 첫 번째 후기를 제출한다
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 시간을 잘 지켜요
          - 준비가 성실해요
          - 질문이 날카로워요
          - 피드백이 구체적이에요
          - 소통이 원활해요
          content: '[QA] 첫 번째 후기입니다. 함께 출석한 참여자에게 작성합니다.'
          anonymous: false
      expect:
        status: 201
        result: SUCCESS
        exists:
        - data.reviewId
      save:
        reviewId: data.reviewId
      covers: []
    - name: 같은 대상자에게 두 번째 후기를 제출하면 E2005 로 거절된다
      covers:
      - G.review.write#not-already-written
      - op.submitReview:E2005
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 시간을 잘 지켜요
          - 준비가 성실해요
          - 질문이 날카로워요
          - 피드백이 구체적이에요
          - 소통이 원활해요
          content: '[QA] 같은 대상자에게 다시 제출하는 후기입니다.'
          anonymous: false
      expect:
        status: 409
        result: ERROR
        error_code: E2005
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: review.not-self
    title: 자기 자신에게 후기를 쓰면 E2004로 거절된다
    suite: sanity
    variant: 유저-후기-및-신뢰-관리/S1/not-self
    domains:
    - review
    operations:
    - submitReview
    covers:
    - G.review.write#not-self
    - op.submitReview:E2004
    source:
    - PRD/유저 후기 및 신뢰 관리 §3
    - PRD/유저 후기 및 신뢰 관리 §4.1
    - PRD/룸 진행 마무리 및 출석 §4.6
    - PRD/유저 후기 및 신뢰 관리 §4.3
    - PRD/유저 후기 및 신뢰 관리 §4.8
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 자기 자신 후기 거절 sanity {{rand}}'
    steps:
    - name: QA 룸 자동 완료로 확정 참여자 전원 출석 처리
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 자기 자신에게 후기 제출 시도
      covers:
      - G.review.write#not-self
      - op.submitReview:E2004
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-guest.memberId}}'
          tags:
          - 시간을 잘 지켜요
          - 준비가 성실해요
          - 질문이 날카로워요
          - 피드백이 구체적이에요
          - 소통이 원활해요
          content: 자기 자신에게 후기를 작성할 수 없는지 확인하는 QA 요청입니다.
          anonymous: false
      expect:
        status: 400
        result: ERROR
        error_code: E2004
        json:
          error.message: 자기 자신에게 후기를 작성할 수 없습니다.
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
