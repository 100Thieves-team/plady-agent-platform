# review — QA 플랫폼 폼으로 만든 파일.
cases:
  - id: review.submit-nickname-public
    title: 작성자가 닉네임 공개를 선택하고 후기를 제출한다
    suite: sanity
    variant: 유저-후기-및-신뢰-관리/S1/nickname-public
    domains:
    - review
    operations:
    - submitReview
    covers:
    - C.review.submit
    - op.submitReview:201
    source:
    - PRD/유저 후기 및 신뢰 관리 §4.2
    - PRD/유저 후기 및 신뢰 관리 §4.3
    - PRD/유저 후기 및 신뢰 관리 §4.8
    - PRD/유저 후기 및 신뢰 관리 §6
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-ready-to-start
      with:
        title: '[QA] 닉네임 공개 후기 제출 sanity {{rand}}'
    steps:
    - name: 룸 자동 완료 처리(dev 전용)
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 작성자가 닉네임 공개를 선택하고 후기를 제출한다
      covers:
      - C.review.submit
      - op.submitReview:201
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/reviews
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
          tags:
          - 시간을 잘 지켜요
          - 준비가 성실해요
          - 질문이 날카로워요
          - 피드백이 구체적이에요
          - 소통이 원활해요
          content: 꼬리질문이 날카로워서 실전 같았어요.
          anonymous: false
      expect:
        status: 201
        result: SUCCESS
        exists:
        - data.reviewId
      save:
        reviewId: data.reviewId
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: review.skip-participant
    title: 참여자가 완료된 룸에서 방장에 대한 후기 작성을 건너뛴다
    suite: sanity
    variant: 유저-후기-및-신뢰-관리/S1/skip-participant
    domains:
    - review
    operations:
    - skipReview
    covers:
    - op.skipReview:200
    source:
    - OpenAPI POST /v1/rooms/{roomId}/review-skips
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-ready-to-start
      with:
        title: '[QA] 후기 건너뛰기 sanity {{rand}}'
    steps:
    - name: 완료 상태 만들기(dev 전용 자동 완료)
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 참여자가 방장에 대한 후기 작성을 건너뛴다
      covers:
      - op.skipReview:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/review-skips
        body:
          targetMemberId: '{{actor.qa-host.memberId}}'
      expect:
        status: 200
        result: SUCCESS
        json:
          data: null
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

