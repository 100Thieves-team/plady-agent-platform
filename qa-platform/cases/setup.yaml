# 준비 작업(suite setup) — 버튼 하나로 dev 에 테스트 데이터를 만든다. docs/qa-platform-api.md §5.4.
# smoke·sanity 와 달리 covers 가 없고, 만든 데이터를 지우지 않는다(그게 목적). 제목 접두 [QA] 는 유지 — 사람이 지운다.
# inputs 는 준비 작업 화면의 입력칸, {{input.x}} 로 치환. outputs 는 끝나고 화면에 돌려줄 save 변수.
# uses 는 다른 카드의 단계를 앞에 붙인다(docs/qa-platform-scenarios.md §8). 룸 생성 요청 본문은 setup.room-open 한 곳에만 있다.
# 요청 본문은 cases/room.yaml 의 sanity(dev 에서 통과한 것)와 같다. 확정(confirm)까지 가는 셋째는 dev 에서 아직 안 돌려 봤다(§11.3).
cases:
  - id: setup.room-open
    title: 모집 중인 룸 하나 만들기
    suite: setup
    description: qa-host 가 룸을 하나 만든다(RECRUITING). 신청·탐색·상세 화면을 손으로 볼 때 쓴다. 만든 룸은 지우지 않는다.
    domains: [room]
    operations: [createRoom]
    actor: qa-host
    inputs:
      title: { label: 룸 제목, default: "[QA] 준비 작업 룸", required: true, hint: "[QA] 로 시작해야 나중에 찾아 지울 수 있다" }
      minParticipants: { label: 최소 진행 인원, default: 2 }
      maxParticipants: { label: 최대 모집 인원, default: 4 }
      daysFromNow: { label: 며칠 뒤 일정인가, default: 7, hint: 오늘 기준 N 일 뒤 14:00 }
    outputs: [roomId]
    steps:
      - name: 룸 생성
        request:
          method: POST
          path: /v1/rooms
          body:
            postingId: "{{fixture.postingId}}"
            jobRoleId: "{{fixture.jobRoleId}}"
            round: FIRST
            type: JOB
            method: ONLINE
            minParticipants: "{{input.minParticipants}}"
            maxParticipants: "{{input.maxParticipants}}"
            schedule: { date: "{{date:+{{input.daysFromNow}}}}", startTime: "14:00", durationMinutes: 90 }
            title: "{{input.title}} {{rand}}"
            description: "QA 플랫폼 준비 작업이 만든 룸. 지워도 된다."
            resumeId: "{{fixture.qa-host.resumeId}}"
            resumePublic: true
        expect: { status: 200, result: SUCCESS, json: { "data.status": RECRUITING } }
        save: { roomId: data.roomId }

  - id: setup.room-with-application
    title: 신청이 하나 들어온 룸 만들기
    suite: setup
    description: qa-host 가 룸을 만들고(setup.room-open) qa-guest 가 신청한다(PENDING). 방장의 신청 목록·수락·반려 화면을 볼 때 쓴다.
    domains: [room, application]
    operations: [createRoom, submitRoomApplication]
    actor: qa-host
    uses: { setup: setup.room-open, with: { title: "{{input.title}}", daysFromNow: 8 } }
    inputs:
      title: { label: 룸 제목, default: "[QA] 신청 들어온 룸", required: true }
      note: { label: 신청 한마디, default: "[QA] 준비 작업 신청" }
    outputs: [roomId, applicationId]
    steps:
      - name: 참가자가 신청
        actor: qa-guest
        request:
          method: POST
          path: "/v1/rooms/{{roomId}}/applications"
          body: { resumeId: "{{fixture.qa-guest.resumeId}}", note: "{{input.note}}" }
        expect: { status: 201, result: SUCCESS, json: { "data.status": PENDING } }
        save: { applicationId: data.applicationId }

  - id: setup.room-confirmed
    title: 참여자를 수락하고 진행 확정까지 간 룸 만들기
    suite: setup
    description: 신청 들어온 룸(setup.room-with-application) → 방장 수락 → 진행 확정. 확정된 룸의 상세·완료 화면을 볼 때 쓴다. 최소 진행 인원을 방장 포함 2명으로 잡았다 — dev 가 E1421(최소 인원 미달)을 주면 SSOT 의 인원 계산(방장 포함 여부)을 확인한다.
    domains: [room, application, participation]
    operations: [createRoom, submitRoomApplication, acceptApplication, confirmRoom]
    actor: qa-host
    uses: { setup: setup.room-with-application, with: { title: "{{input.title}}" } }
    inputs:
      title: { label: 룸 제목, default: "[QA] 확정된 룸", required: true }
    outputs: [roomId, applicationId]
    steps:
      - name: 방장이 수락
        request: { method: POST, path: "/v1/rooms/{{roomId}}/applications/{{applicationId}}/accept" }
        expect: { status: 200, result: SUCCESS, json: { "data.status": ACCEPTED } }
      - name: 방장이 진행 확정
        request: { method: POST, path: "/v1/rooms/{{roomId}}/confirmation" }
        expect: { status: 200, result: SUCCESS }

  # ---- dev 전용 QA API(백엔드 PR #135)를 쓰는 카드. /v1/dev/… 는 검증 대상이 아니라 TC 를 만들지 않는다 ----
  - id: setup.room-reschedule
    title: 룸 시작 시각 바꾸기 (진행 시작 가능하게)
    suite: setup
    description: 이미 있는 [QA] 룸의 진행 시작 시각을 옮긴다. 확정된 룸을 어제로 옮기면 공개 API 로 진행 시작 → 클로징 → 종료 → 후기까지 실제 경로로 갈 수 있다. 상태는 안 바뀐다. dev 전용 API(rescheduleQaRoom).
    domains: [room]
    operations: [rescheduleQaRoom]
    actor: qa-host
    inputs:
      roomId: { label: 룸 id, required: true, hint: "[QA] 룸만 된다 (아니면 E2201)" }
      daysFromNow: { label: 며칠 뒤로 옮기나, default: -1, hint: "음수면 과거 (-1 = 어제). 진행 시작은 시작 시각이 지나야 열린다" }
      time: { label: 시각, default: "09:00:00" }
    outputs: [roomId, startAt, roomStatus]
    steps:
      - name: 시작 시각 변경
        request:
          method: POST
          path: "/v1/dev/rooms/{{input.roomId}}/schedule"
          body: { startAt: "{{date:{{input.daysFromNow}}}}T{{input.time}}" }
        expect: { status: 200, result: SUCCESS }
        save: { roomId: data.roomId, startAt: data.startAt, roomStatus: data.status }

  - id: setup.room-ready-to-start
    title: 진행 시작 직전 상태의 룸 만들기 (확정 + 시작 시각 지남)
    suite: setup
    description: 확정된 룸(setup.room-confirmed) → dev 전용 API 로 시작 시각을 어제로. 그 다음은 공개 API 로 진행 시작·출석·클로징·후기 화면을 볼 수 있다. 최소 인원이 방장 포함 2명으로 세는지에 따라 확정이 E1421 로 막힐 수 있다 — 그러면 setup.room-confirmed 와 같은 원인이다.
    domains: [room, application, participation]
    operations: [createRoom, submitRoomApplication, acceptApplication, confirmRoom, rescheduleQaRoom]
    actor: qa-host
    uses: { setup: setup.room-confirmed, with: { title: "{{input.title}}" } }
    inputs:
      title: { label: 룸 제목, default: "[QA] 진행 직전 룸", required: true }
    outputs: [roomId, applicationId, startAt]
    steps:
      - name: 시작 시각을 어제로 (dev 전용 API)
        request:
          method: POST
          path: "/v1/dev/rooms/{{roomId}}/schedule"
          body: { startAt: "{{date:-1}}T09:00:00" }
        expect: { status: 200, result: SUCCESS, json: { "data.status": CONFIRMED } }
        save: { startAt: data.startAt }

  - id: setup.resume-list
    title: 테스트 계정의 이력서 목록 보기 (id 찾기)
    suite: setup
    description: 고른 테스트 계정으로 보관 이력서 목록을 읽어 첫 이력서의 id·이름·AI 요약 상태를 결과값으로 돌려준다. 요약 강제나 신청 카드에 넣을 resumeId 를 찾을 때 쓴다. 아무것도 만들지 않는다.
    domains: [resume]
    operations: [resumes]
    actor: qa-host
    inputs:
      actor: { label: 테스트 계정, default: qa-host, hint: "qa-host · qa-guest · 만든 QA 회원 이름" }
    outputs: [resumeCount, firstResumeId, firstResumeName, firstSummaryStatus]
    steps:
      - name: 내 이력서 목록
        actor: "{{input.actor}}"
        request: { method: GET, path: /v1/members/me/resumes }
        expect: { status: 200, result: SUCCESS, exists: [data.resumes] }
        save:
          resumeCount: data.maxCount
          firstResumeId: "data.resumes[0].resumeId"
          firstResumeName: "data.resumes[0].name"
          firstSummaryStatus: "data.resumes[0].aiSummary.status"

  - id: setup.resume-summary
    title: 이력서 AI 요약 강제 완료 (Bedrock 없이 DONE)
    suite: setup
    description: 이름이 [QA] 로 시작하는 이력서의 AI 요약을 주어진 문장으로 바로 완료(DONE)시킨다. 요약이 안 끝나 룸 신청이 막힐 때 쓴다. 회원에게 기본 이력서가 없으면 이것이 기본이 된다. dev 전용 API(completeQaResumeSummary).
    domains: [resume]
    operations: [completeQaResumeSummary]
    actor: qa-host
    inputs:
      resumeId: { label: 이력서 id, required: true, hint: "이름이 [QA] 로 시작하는 이력서만 (아니면 E2201). 위 '이력서 목록 보기' 카드로 찾는다" }
      summary: { label: 요약문, default: "[QA] 테스트용 이력서 요약입니다. 백엔드 3년차, Kotlin·Spring 기반 API 개발 경험이 있습니다.", hint: "1~1000자" }
    outputs: [resumeId, summaryStatus, isDefault]
    steps:
      - name: 요약 완료 강제
        request:
          method: POST
          path: "/v1/dev/resumes/{{input.resumeId}}/summary"
          body: { summary: "{{input.summary}}" }
        expect: { status: 200, result: SUCCESS, json: { "data.status": DONE } }
        save: { resumeId: data.resumeId, summaryStatus: data.status, isDefault: data.isDefault }
