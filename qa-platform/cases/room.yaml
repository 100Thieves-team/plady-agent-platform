# 룸 — 탐색은 비로그인 smoke, 생성·신청 흐름은 테스트 계정이 필요한 sanity.
# 쓰기 스크립트는 자기가 만든 데이터를 자기가 닫는다(취소·QA 룸 삭제). 정리 단계는 always: true 로 앞 단계가 실패해도 돈다. 제목 접두 [QA].
# 룸 시작 시각은 {{time:rand}} — 룸 생성은 (방장, 공고, 직무, 시작 시각)이 같은 활성 룸이 있으면 새로 만들지 않고 그 룸을 돌려준다.
# variant: 는 구현하는 시나리오 변형(scenarios/<기능>.yaml). 없는 것은 "시나리오 밖" 이다 (docs/qa-platform-scenarios.md §13).
cases:
  - id: room.form-options
    title: 룸 생성 폼 선택지를 조회한다
    suite: smoke
    domains: [room]
    operations: [roomFormOptions]
    covers: [op.roomFormOptions:200, PRD.룸-생성.4.1#1]
    source: ["PRD/룸 생성 §4.1"]
    steps:
      - name: 폼 선택지
        request: { method: GET, path: /v1/rooms/form-options }
        expect: { status: 200, result: SUCCESS, exists: [data.rounds, data.types, data.methods, data.durations] }

  - id: room.explore
    title: 비로그인으로 모집 중인 룸을 탐색한다
    suite: smoke
    domains: [room]
    operations: [rooms]
    covers: [op.rooms:200, PRD.룸-탐색.4.1#1]
    source: ["PRD/룸 탐색 §4.1~§4.3"]
    steps:
      - name: 탐색 목록
        request: { method: GET, path: /v1/rooms, query: { size: 5 } }
        expect: { status: 200, result: SUCCESS, exists: [data.rooms, data.totalCount] }

  - id: room.create
    title: 방장이 온라인 룸을 만들면 모집 중으로 열리고 상세의 방장이 본인이다
    suite: sanity
    variant: 룸-생성/S1/happy
    domains:
    - room
    operations:
    - createRoom
    - roomDetail
    covers:
    - C.room.create
    - op.createRoom:200
    - op.roomDetail:200
    source:
    - PRD/룸 생성 §4.8
    actor: qa-host
    reviewed:
      at: '2026-09-25'
      by: bebe
    written_by: hermes
    steps:
    - name: 룸 생성
      covers:
      - C.room.create
      - op.createRoom:200
      request:
        method: POST
        path: /v1/rooms
        body:
          postingId: '{{fixture.postingId}}'
          jobRoleId: '{{fixture.jobRoleId}}'
          round: FIRST
          type: JOB
          method: ONLINE
          minParticipants: 2
          maxParticipants: 4
          schedule:
            date: '{{date:+7}}'
            startTime: '{{time:rand}}'
            durationMinutes: 90
          title: '[QA] 룸 생성 sanity {{rand}}'
          description: QA 플랫폼 sanity 케이스가 만든 룸. 곧 취소된다.
          resumeId: '{{fixture.qa-host.resumeId}}'
          resumePublic: true
      expect:
        status: 200
        result: SUCCESS
        json:
          data.status: RECRUITING
      save:
        roomId: data.roomId
    - name: 상세 조회 — 방장이 테스트 계정이다
      covers:
      - op.roomDetail:200
      request:
        method: GET
        path: /v1/rooms/{{roomId}}
      expect:
        status: 200
        json:
          data.hostMemberId: '{{actor.qa-host.memberId}}'
          data.status: RECRUITING
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: room.cancel
    title: 일반 참여자가 없는 모집 중인 룸을 방장이 취소한다
    suite: sanity
    variant: 룸-생성/S2/cancel
    domains: [room]
    operations: [cancelRoom]
    source: ["PRD/룸 생성 §4.10"]
    actor: qa-host
    uses: { setup: setup.room-open, with: { title: "[QA] 룸 취소 sanity" } }
    steps:
      - name: 취소
        covers: [C.room.cancel, op.cancelRoom:200]
        request: { method: POST, path: "/v1/rooms/{{roomId}}/cancellation" }
        expect: { status: 200, result: SUCCESS }
      - name: 정리(QA 룸 삭제)
        always: true
        request: { method: DELETE, path: "/v1/dev/rooms/{{roomId}}" }
        expect: { status: 200 }

  - id: room.cancel-not-recruiting
    title: 이미 취소한 룸을 다시 취소하면 E1410 으로 거절된다
    suite: sanity
    variant: 룸-생성/S2/room-recruiting
    domains: [room]
    operations: [cancelRoom]
    source: ["PRD/룸 생성 §4.10"]
    actor: qa-host
    uses: { setup: setup.room-open, with: { title: "[QA] 룸 재취소 sanity" } }
    steps:
      - name: 취소
        request: { method: POST, path: "/v1/rooms/{{roomId}}/cancellation" }
        expect: { status: 200, result: SUCCESS }
      - name: 재취소는 모집 중이 아니라 E1410
        covers: ["G.room.cancel#room-recruiting", op.cancelRoom:E1410]
        request: { method: POST, path: "/v1/rooms/{{roomId}}/cancellation" }
        expect: { status: 409, error_code: E1410 }
      - name: 정리(QA 룸 삭제)
        always: true
        request: { method: DELETE, path: "/v1/dev/rooms/{{roomId}}" }
        expect: { status: 200 }

  - id: room.apply-and-withdraw
    title: 참가자가 신청하면 PENDING 이고 철회할 수 있다
    suite: sanity
    variant: 룸-참여-및-참여자-관리/S1/withdraw
    domains: [room, application]
    operations: [submitRoomApplication, myRoomApplication, withdrawRoomApplication]
    source: ["PRD/룸 참여 및 참여자 관리 §4.2"]
    actor: qa-host
    uses: { setup: setup.room-open, with: { title: "[QA] 참가 신청 sanity", daysFromNow: 8 } }
    steps:
      - name: 참가자가 신청
        covers: [C.application.submit, op.submitRoomApplication:201]
        actor: qa-guest
        request:
          method: POST
          path: "/v1/rooms/{{roomId}}/applications"
          body: { resumeId: "{{fixture.qa-guest.resumeId}}", note: "[QA] sanity 신청" }
        expect: { status: 201, result: SUCCESS, json: { "data.status": PENDING } }
      - name: 참가자가 내 신청 조회
        covers: [op.myRoomApplication:200]
        actor: qa-guest
        request: { method: GET, path: "/v1/rooms/{{roomId}}/applications/me" }
        expect: { status: 200, result: SUCCESS }
      - name: 참가자가 철회
        covers: [C.application.withdraw, op.withdrawRoomApplication:200]
        actor: qa-guest
        request: { method: DELETE, path: "/v1/rooms/{{roomId}}/applications/me" }
        expect: { status: 200, result: SUCCESS }
      - name: 정리(QA 룸 삭제)
        always: true
        request: { method: DELETE, path: "/v1/dev/rooms/{{roomId}}" }
        expect: { status: 200 }

  - id: room.creation-limit
    title: 중복 생성 제한 조회는 없는 공고 id 에도 404 가 아니라 0개로 답한다
    suite: sanity
    variant: 룸-생성/S1/creation-limit
    domains: [room]
    operations: [roomCreationLimit]
    covers: [op.roomCreationLimit:200, PRD.룸-생성.4.7#1]
    source: ["PRD/룸 생성 §4.7"]
    actor: qa-host
    steps:
      - name: 없는 공고·직무
        request: { method: GET, path: /v1/rooms/creation-limit, query: { jobPostingId: 999999999, jobRoleId: 999999 } }
        expect: { status: 200, result: SUCCESS, json: { "data.activeRoomCount": 0 }, exists: [data.limit, data.remaining] }

  - id: room.confirm-host-only
    title: 방장이 아닌 참여자가 진행을 확정하면 E1406으로 거절된다
    suite: sanity
    variant: 룸-진행-확정/S1/host-only
    domains:
    - room
    operations:
    - confirmRoom
    covers:
    - G.room.confirm#host-only
    source:
    - PRD/룸 진행 확정 R2
    - PRD/룸 진행 확정 R8
    - PRD/룸 진행 확정 R10
    - PRD/룸 진행 확정 R11
    - PRD/룸 진행 확정 R12
    - PRD/룸 진행 확정 R13
    - PRD/룸 진행 확정 R34
    - PRD/룸 진행 확정 R35
    - PRD/룸 진행 확정 R36
    - PRD/룸 진행 확정 §8
    actor: qa-host
    reviewed:
      at: '2026-09-28'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 진행 확정 host-only sanity {{rand}}'
    steps:
    - name: 참여자가 진행 확정을 시도하면 거절된다
      actor: qa-guest
      covers:
      - G.room.confirm#host-only
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/confirmation
      expect:
        status: 403
        result: ERROR
        error_code: E1406
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: room.complete
    title: 방장이 진행 완료를 누르고 출석을 입력하면 룸이 완료되고 출석이 기록된다
    suite: sanity
    variant: 룸-진행-마무리-및-출석/S2/happy
    domains:
    - room
    operations:
    - completeRoomProgress
    covers:
    - C.room.complete
    - op.completeRoomProgress:200
    source:
    - PRD/룸 진행 마무리 및 출석 §2
    - PRD/룸 진행 마무리 및 출석 §4.6
    actor: qa-host
    reviewed:
      at: '2026-10-06'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 진행 완료 sanity {{rand}}'
    steps:
    - name: 방장이 출석을 입력하며 룸 완료
      covers:
      - C.room.complete
      - op.completeRoomProgress:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/complete
        body:
          attendances:
          - memberId: '{{actor.qa-host.memberId}}'
            status: ATTENDED
          - memberId: '{{actor.qa-guest.memberId}}'
            status: ABSENT
      expect:
        status: 200
        result: SUCCESS
        json:
          data.status: COMPLETED
          data.attendances[0].memberId: '{{actor.qa-host.memberId}}'
          data.attendances[0].status: ATTENDED
          data.attendances[1].memberId: '{{actor.qa-guest.memberId}}'
          data.attendances[1].status: ABSENT
        exists:
        - data.attendances[0].nickname
        - data.attendances[1].nickname
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: room.complete-attendance-roster-matches
    title: 출석 명단이 확정 참여자와 다르면 E1706 으로 거절된다
    suite: sanity
    variant: 룸-진행-마무리-및-출석/S2/attendance-roster-matches
    domains:
    - room
    operations:
    - completeRoomProgress
    covers:
    - G.room.complete#attendance-roster-matches
    - op.completeRoomProgress:E1706
    source:
    - PRD/룸 진행 마무리 및 출석 R62
    - PRD/룸 진행 마무리 및 출석 R63
    - PRD/룸 진행 마무리 및 출석 R67
    - PRD/룸 진행 마무리 및 출석 R68
    - PRD/룸 진행 마무리 및 출석 R71
    - PRD/룸 진행 마무리 및 출석 R76
    - OpenAPI POST /v1/rooms/{roomId}/complete
    actor: qa-host
    reviewed:
      at: '2026-10-06'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 출석 명단 불일치 완료 거절 {{rand}}'
    steps:
    - name: 확정 참여자 중 일부만 출석 명단에 넣어 완료 요청하면 거절된다
      covers:
      - G.room.complete#attendance-roster-matches
      - op.completeRoomProgress:E1706
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/complete
        body:
          attendances:
          - memberId: '{{actor.qa-host.memberId}}'
            status: ATTENDED
      expect:
        status: 400
        result: ERROR
        error_code: E1706
        json:
          error.message: 출석 대상이 확정 참여자와 일치하지 않습니다.
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: room.complete-host-only
    title: 방장이 아닌 참여자가 진행 완료를 누르면 E1406 으로 거절된다
