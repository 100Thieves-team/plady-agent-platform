    domains:
    - room
    operations:
    - createRoom
    covers:
    - C.room.create_batch
    - op.createRoom:200
    source:
    - PRD/룸 생성 §4.4
    - PRD/룸 생성 §4.1
    - PRD/룸 생성 §4.2
    - PRD/룸 생성 §4.3
    - PRD/룸 생성 §4.5
    - PRD/룸 생성 §4.8
    - PRD/룸 생성 §6
    actor: qa-host
