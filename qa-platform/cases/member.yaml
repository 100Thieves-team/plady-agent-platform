  - id: member.restore-withdrawn-google-account
    title: 탈퇴했던 회원이 같은 Google 계정으로 복구 확인을 거치면 계정이 복구된다
    suite: sanity
    variant: 회원-및-프로필/S1/restore-withdrawn-google-account
    domains:
    - member
    - auth
    operations:
    - authRestore
    covers:
    - C.member.restore
    - op.authRestore:200
    source:
    - PRD/회원 및 프로필 §2
    - PRD/회원 및 프로필 §4.8
    - OpenAPI POST /v1/auth/restoration
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.member-withdrawn
    steps:
    - name: 같은 Google 계정으로 다시 로그인해 복구 확인 쿠키를 받는다
      cookie_jar: restoreFlow
      actor: qa-guest
      request:
        method: POST
        path: /v1/dev/members/{{memberId}}/social-login
      expect:
        status: 200
        result: SUCCESS
        cookies:
          DEV_RESTORE_TOKEN: set
      save: {}
      covers: []
    - name: 탈퇴 계정 복구 확인
      cookie_jar: restoreFlow
      actor: null
      covers:
      - C.member.restore
      - op.authRestore:200
      request:
        method: POST
        path: /v1/auth/restoration
      expect:
        status: 200
        result: SUCCESS
        json:
          data: null
      save: {}
    - name: 정리(QA 회원 삭제)
      always: true
      actor: qa-guest
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: member.profile-resume-happy
    title: 사용자가 마이페이지에서 프로필을 수정하고 이력서를 등록·기본 지정·삭제한다
    suite: sanity
    variant: 회원-및-프로필/S2/happy
    domains:
    - member
    - resume
    operations:
    - updateProfile
    - createResume
    - makeResumeDefault
    - deleteResume
    covers:
    - C.member.update_profile
    - C.resume.create
    - C.resume.set_default
    - C.resume.delete
    - op.updateProfile:200
    - op.createResume:201
    - op.makeResumeDefault:200
    - op.deleteResume:200
    source:
    - PRD/회원 및 프로필 §4.2
    - PRD/회원 및 프로필 §4.3
    - PRD/회원 및 프로필 §4.5
    - PRD/회원 및 프로필 §4.4-1
    - PRD/회원 및 프로필 §6
    - PRD/회원 및 프로필 §8
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 새 QA 회원 만들기 (dev 전용 API, 공용 계정 프로필을 바꾸지 않는다)
      covers: []
      request:
        method: POST
        path: /v1/dev/members
      expect:
        status: 200
        result: SUCCESS
      save:
        memberId: data.memberId
        memberToken: data.accessToken
    - name: 프로필 수정
      covers:
      - C.member.update_profile
      - op.updateProfile:200
      actor: null
      request:
        method: PUT
        path: /v1/members/me/profile
        headers:
          Authorization: Bearer {{memberToken}}
        body:
          nickname: QA 명랑한 해달 {{rand}}
          interestJobRoleIds:
          - '{{fixture.jobRoleId}}'
          bio: '[QA] 실전처럼 압박 질문을 주고받는 것을 좋아합니다.'
          interestCompanyIds: []
      expect:
        status: 200
        result: SUCCESS
        json:
          data.memberId: '{{memberId}}'
          data.interestJobRoleIds[0]: '{{fixture.jobRoleId}}'
          data.bio: '[QA] 실전처럼 압박 질문을 주고받는 것을 좋아합니다.'
        exists:
        - data.interestCompanies
    - name: 첫 이력서 등록 (기본이 된다)
      covers: []
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        multipart:
          file:
            sample: pdf
            filename: '[QA] 첫 이력서 {{rand}}.pdf'
      expect:
        status: 201
        result: SUCCESS
        json:
          data.isDefault: true
      save:
        firstResumeId: data.resumeId
    - name: 이력서 등록
      covers:
      - C.resume.create
      - op.createResume:201
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        multipart:
          file:
            sample: pdf
            filename: '[QA] 이력서 {{rand}}.pdf'
      expect:
        status: 201
        result: SUCCESS
        json:
          data.file.contentType: application/pdf
          data.aiSummary.status: DONE
          data.isDefault: false
        exists:
        - data.resumeId
        - data.name
        - data.file.originalName
        - data.file.sizeBytes
        - data.aiSummary.text
        - data.registeredAt
      save:
        resumeId: data.resumeId
        resumeName: data.name
    - name: 기본 이력서 지정
      covers:
      - C.resume.set_default
      - op.makeResumeDefault:200
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes/{{resumeId}}/make-default
        headers:
          Authorization: Bearer {{memberToken}}
      expect:
        status: 200
        result: SUCCESS
    - name: 이력서 삭제
      covers:
      - C.resume.delete
      - op.deleteResume:200
      actor: null
      request:
        method: DELETE
        path: /v1/members/me/resumes/{{resumeId}}
        headers:
          Authorization: Bearer {{memberToken}}
      expect:
        status: 200
        result: SUCCESS
    - name: 정리(QA 회원 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS

  - id: member.withdraw
    title: 사용자가 회원 탈퇴를 요청하면 탈퇴 처리가 성공한다
    suite: sanity
    variant: 회원-및-프로필/S2/withdraw
    description: 새로 만든 QA 회원으로 탈퇴한다. 공용 테스트 계정은 탈퇴시키지 않는다(2026-10-08 qa-guest 탈퇴 사고 뒤 고침).
    domains:
    - member
    operations:
    - memberWithdraw
    covers:
    - C.member.withdraw
    - op.memberWithdraw:200
    source:
    - PRD/회원 및 프로필 §4.8
    - PRD/회원 및 프로필 §2
    actor: qa-host
    steps:
    - name: 탈퇴할 QA 회원 만들기 (dev 전용 API)
      request:
        method: POST
        path: /v1/dev/members
      expect:
        status: 200
        result: SUCCESS
      save:
        memberId: data.memberId
        memberToken: data.accessToken
    - name: 회원 탈퇴
      covers:
      - C.member.withdraw
      - op.memberWithdraw:200
      actor: null
      request:
        method: DELETE
        path: /v1/members/me
        headers:
          Authorization: Bearer {{memberToken}}
      expect:
        status: 200
        result: SUCCESS
        json:
          data: null
        cookies:
          DEV_ACCESS_TOKEN: cleared
          DEV_REFRESH_TOKEN: cleared
    - name: 정리(QA 회원 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS

