# member — QA 플랫폼 폼으로 만든 파일.
cases:
  - id: member.signup-oauth-return-flow
    title: 비로그인 사용자가 Google 계정으로 최초 로그인해 계정 생성 후 기존 흐름으로 복귀한다
    suite: sanity
    variant: 회원-및-프로필/S1/happy
    domains:
    - member
    operations:
    - googleOAuthStart
    - googleOAuthCallback
    - socialSignUpQaMember
    - deleteQaMember
    covers:
    - C.member.signup
    - C.member.login
    source:
    - PRD/회원 및 프로필 §2
    - PRD/회원 및 프로필 §4.1
    - PRD/회원 및 프로필 §4.6
    - PRD/회원 및 프로필 §4.9
    - PRD/회원 및 프로필 §7
    - PRD/회원 및 프로필 §8
    actor: null
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: Google OAuth 로그인 시작
      covers:
      - C.member.signup
      - C.member.login
      cookie_jar: signupFlow
      request:
        method: GET
        path: /oauth2/authorization/google
      expect:
        status: 3xx
      save: {}
    - name: dev 소셜 가입으로 Google 최초 로그인 완료
      covers:
      - C.member.signup
      - C.member.login
      cookie_jar: signupFlow
      request:
        method: POST
        path: /v1/dev/members/social-signup
        body:
          returnTo: 'TODO: 로그인 전 진행하던 참여 또는 생성 흐름 URL'
      expect:
        status: 200
        result: SUCCESS
        json:
          data.accountStatus: ACTIVE
          data.role: MEMBER
        exists:
        - data.memberId
        - data.email
        - data.nickname
        - data.accessToken
        - data.termsAgreedAt
        - data.createdAt
        - data.lastLoginAt
      save:
        memberId: data.memberId
        memberToken: data.accessToken
    - name: 같은 QA 회원으로 다시 소셜 로그인해 중복 생성 없이 기존 계정 로그인
      covers:
      - C.member.login
      cookie_jar: signupFlow
      request:
        method: POST
        path: /v1/dev/members/{{memberId}}/social-login
      expect:
        status: 200
        result: SUCCESS
        json:
          data.memberId: '{{memberId}}'
        exists:
        - data.accessToken
      save:
        loginToken: data.accessToken
    - name: 정리(QA 회원 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: member.login-required
    title: 로그인하지 않고 룸 생성과 참가 신청을 하려 하면 E1102로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S1/login-required
    domains:
    - member
    operations:
    - createRoom
    - submitRoomApplication
    covers:
    - G.member.mutate#login-required
    source:
    - PRD/회원 및 프로필 §1
    - PRD/회원 및 프로필 §3
    - PRD/회원 및 프로필 §4.6
    - PRD/회원 및 프로필 §4.9
    actor: null
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-open
      with:
        title: '[QA] 로그인 필요 검증 룸 {{rand}}'
        minParticipants: 2
        maxParticipants: 4
        daysFromNow: 7
    steps:
    - name: 비로그인 사용자는 룸 생성을 할 수 없다
      covers:
      - G.member.mutate#login-required
      actor: null
      request:
        method: POST
        path: /v1/rooms
        body:
          postingId: '{{fixture.postingId}}'
          jobRoleId: '{{fixture.jobRoleId}}'
          round: FIRST
          type: JOB
          method: OFFLINE
          sigunguId: 1
          minParticipants: 3
          maxParticipants: 6
          schedule:
            date: '{{date:+7}}'
            startTime: '{{time:rand}}'
            durationMinutes: 90
          title: '[QA] 비로그인 룸 생성 거절 {{rand}}'
          description: QA 플랫폼이 비로그인 룸 생성 거절을 확인한다.
          resumeId: '{{fixture.qa-host.resumeId}}'
          resumePublic: true
      expect:
        status: 4xx
        result: ERROR
        error_code: E1102
      save: {}
    - name: 비로그인 사용자는 룸 참가 신청을 할 수 없다
      covers:
      - G.member.mutate#login-required
      actor: null
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/applications
        body:
          resumeId: '{{fixture.qa-guest.resumeId}}'
          note: QA 플랫폼이 비로그인 참가 신청 거절을 확인한다.
      expect:
        status: 4xx
        result: ERROR
        error_code: E1102
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: member.account-active
    title: 이용이 제한된 계정이 룸 생성을 하려 하면 거절된다
    suite: sanity
    variant: 회원-및-프로필/S1/account-active
    domains:
    - member
    operations:
    - createRoom
    covers:
    - G.member.mutate#account-active
    source:
    - PRD/회원 및 프로필 §1
    - PRD/회원 및 프로필 §3
    - PRD/회원 및 프로필 §4.6
    - PRD/회원 및 프로필 §4.9
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.member-restricted
    steps:
    - name: 이용 제한 계정으로 룸 생성 시도
      covers:
      - G.member.mutate#account-active
      actor: null
      request:
        method: POST
        path: /v1/rooms
        headers:
          Authorization: Bearer {{memberToken}}
        body:
          postingId: '{{fixture.postingId}}'
          jobRoleId: '{{fixture.jobRoleId}}'
          round: FIRST
          type: JOB
          method: ONLINE
          minParticipants: 2
          maxParticipants: 4
          schedule:
            date: '{{date:+7}}'
            startTime: '{{time:rand}}'
            durationMinutes: 90
          title: '[QA] 이용 제한 계정 룸 생성 거절 {{rand}}'
          description: QA 플랫폼 sanity 케이스가 이용 제한 계정의 상태 변경 행동 거절을 확인한다.
          resumeId: '{{fixture.qa-host.resumeId}}'
          resumePublic: true
      expect:
        status: 4xx
        result: ERROR
        error_code: E1002
      save: {}
    - name: 정리(QA 회원 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: member.restore-withdrawn-google-account
    title: 탈퇴했던 회원이 같은 Google 계정으로 복구 확인을 거치면 계정이 복구된다
    suite: sanity
    variant: 회원-및-프로필/S1/restore-withdrawn-google-account
    domains:
    - member
    - auth
    operations:
    - authRestore
    covers:
    - C.member.restore
    - op.authRestore:200
    source:
    - PRD/회원 및 프로필 §2
    - PRD/회원 및 프로필 §4.8
    - OpenAPI POST /v1/auth/restoration
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.member-withdrawn
    steps:
    - name: 같은 Google 계정으로 다시 로그인해 복구 확인 쿠키를 받는다
      cookie_jar: restoreFlow
      actor: qa-guest
      request:
        method: POST
        path: /v1/dev/members/{{memberId}}/social-login
      expect:
        status: 200
        result: SUCCESS
        cookies:
          RESTORE_TOKEN: set
      save: {}
      covers: []
    - name: 탈퇴 계정 복구 확인
      cookie_jar: restoreFlow
      actor: null
      covers:
      - C.member.restore
      - op.authRestore:200
      request:
        method: POST
        path: /v1/auth/restoration
      expect:
        status: 200
        result: SUCCESS
        json:
          data: null
      save: {}
    - name: 정리(QA 회원 삭제)
      always: true
      actor: qa-guest
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: member.profile-resume-happy
    title: 사용자가 마이페이지에서 프로필을 수정하고 이력서를 보관·기본 지정·삭제한다
    suite: sanity
    variant: 회원-및-프로필/S2/happy
    domains:
    - member
    - resume
    operations:
    - updateProfile
    - createResume
    - makeResumeDefault
    - deleteResume
    covers:
    - C.member.update_profile
    - C.resume.create
    - C.resume.set_default
    - C.resume.delete
    - op.updateProfile:200
    - op.createResume:201
    - op.makeResumeDefault:200
    - op.deleteResume:200
    source:
    - PRD/회원 및 프로필 §4.2
    - PRD/회원 및 프로필 §4.3
    - PRD/회원 및 프로필 §4.5
    - PRD/회원 및 프로필 §4.4-1
    - PRD/회원 및 프로필 §6
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 프로필 수정
      covers:
      - C.member.update_profile
      - op.updateProfile:200
      request:
        method: PUT
        path: /v1/members/me/profile
        body:
          nickname: 명랑한해달{{rand}}
          interestJobRoleIds:
          - '{{fixture.jobRoleId}}'
          bio: QA 프로필 수정 sanity
          interestCompanyIds:
          - 1
      expect:
        status: 200
        result: SUCCESS
        json:
          data.memberId: '{{actor.qa-guest.memberId}}'
          data.interestJobRoleIds[0]: '{{fixture.jobRoleId}}'
          data.bio: QA 프로필 수정 sanity
        exists:
        - data.interestCompanies
      save: {}
    - name: 이력서 등록
      covers:
      - C.resume.create
      - op.createResume:201
      request:
        method: POST
        path: /v1/members/me/resumes
        multipart:
          file: 'TODO: OpenAPI 발췌에 이력서 업로드 요청 파트명과 파일 fixture가 없음'
      expect:
        status: 201
        result: SUCCESS
        json:
          data.name: TODO
          data.file.originalName: TODO
          data.file.contentType: application/pdf
          data.aiSummary.status: DONE
          data.isDefault: false
        exists:
        - data.resumeId
        - data.file.sizeBytes
        - data.aiSummary.text
        - data.registeredAt
      save:
        resumeId: data.resumeId
    - name: 이력서 AI 요약 완료 강제
      request:
        method: POST
        path: /v1/dev/resumes/{{resumeId}}/summary
        body:
          summary: '[QA] 테스트용 이력서 요약입니다. 백엔드 3년차, Kotlin·Spring 기반 API 개발 경험이 있습니다.'
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 기본 이력서 지정
      covers:
      - C.resume.set_default
      - op.makeResumeDefault:200
      request:
        method: POST
        path: /v1/members/me/resumes/{{resumeId}}/make-default
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 이력서 삭제
      always: true
      covers:
      - C.resume.delete
      - op.deleteResume:200
      request:
        method: DELETE
        path: /v1/members/me/resumes/{{resumeId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: member.withdraw
    title: 사용자가 회원 탈퇴를 요청하면 탈퇴 처리가 성공한다
    suite: sanity
    variant: 회원-및-프로필/S2/withdraw
    domains:
    - member
    operations:
    - memberWithdraw
    covers:
    - C.member.withdraw
    - op.memberWithdraw:200
    source:
    - PRD/회원 및 프로필 §4.8
    - PRD/회원 및 프로필 §2
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 회원 탈퇴
      covers:
      - C.member.withdraw
      - op.memberWithdraw:200
      request:
        method: DELETE
        path: /v1/members/me
      expect:
        status: 200
        result: SUCCESS
        json:
          data: null
      save: {}
    - name: 정리(QA 회원 초기화)
      always: true
      covers: []
      actor: qa-host
      request:
        method: POST
        path: /v1/dev/members/{{actor.qa-guest.memberId}}/reset
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: member.nickname-check
    title: 닉네임을 바꾸기 전에 쓸 수 있는지 확인한다
    suite: smoke
    variant: 회원-및-프로필/S2/nickname-check
    domains:
    - member
    operations:
    - nicknameAvailability
    covers:
    - op.nicknameAvailability:200
    source:
    - OpenAPI GET /v1/nicknames/availability
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 닉네임 사용 가능 여부 조회
      covers:
      - op.nicknameAvailability:200
      request:
        method: GET
        path: /v1/nicknames/availability
        query:
          nickname: qa{{rand}}
      expect:
        status: 200
        result: SUCCESS
        json:
          data.available: true
        exists:
        - data.available
      save: {}

  - id: member.nickname-not-taken
    title: 다른 회원이 쓰는 닉네임으로 바꾸면 E1007로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/nickname-not-taken
    domains:
    - member
    operations:
    - updateProfile
    covers:
    - G.member.set_nickname#nickname-not-taken
    source:
    - PRD/회원 및 프로필 §4.1
    - PRD/회원 및 프로필 §4.3
    - PRD/회원 및 프로필 §4.5
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 중복 기준이 될 QA 회원 생성
      request:
        method: POST
        path: /v1/dev/members
        body:
          nickname: 중복닉네임{{rand}}
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.memberId
        - data.nickname
      save:
        otherMemberId: data.memberId
        takenNickname: data.nickname
      covers: []
    - name: 이미 다른 회원이 쓰는 닉네임으로 변경 시도
      covers:
      - G.member.set_nickname#nickname-not-taken
      request:
        method: PUT
        path: /v1/members/me/profile
        body:
          nickname: '{{takenNickname}}'
          interestJobRoleIds:
          - '{{fixture.jobRoleId}}'
          bio: QA 닉네임 중복 거절 확인
          interestCompanyIds:
          - 1
      expect:
        status: 409
        result: ERROR
        error_code: E1007
      save: {}
    - name: 정리(QA 회원 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/members/{{otherMemberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

