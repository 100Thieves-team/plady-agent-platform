      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{targetRoomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 정리(QA 준비 룸 1 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 정리(QA 준비 룸 2 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{pendingRoomId2}}
