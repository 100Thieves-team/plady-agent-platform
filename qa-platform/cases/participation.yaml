# participation — QA 플랫폼 폼으로 만든 파일.
cases:
  - id: participation.cancel-own-participation
    title: 다른 사람의 참여를 대신 취소하려고 하면 E1419로 거절된다
    suite: sanity
    variant: 룸-생성/S2/own-participation
    domains:
    - participation
    operations:
    - roomLeave
    covers:
    - G.participation.cancel#own-participation
    - op.roomLeave:E1419
    source:
    - PRD/룸 참여 및 참여자 관리 §3
    - PRD/룸 참여 및 참여자 관리 §4.6
    - PRD/룸 참여 및 참여자 관리 §4.10
    actor: qa-host
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-open
      with:
        title: '[QA] 참여 취소 권한 거절 sanity {{rand}}'
        minParticipants: 2
        maxParticipants: 4
        daysFromNow: 7
    steps:
    - name: 비참여자인 qa-guest가 이 룸에서 본인 참여 나가기를 호출하면 거절된다
      actor: qa-guest
      covers:
      - G.participation.cancel#own-participation
      - op.roomLeave:E1419
      request:
        method: DELETE
        path: /v1/rooms/{{roomId}}/participants/me
      expect:
        status: 403
        result: ERROR
        error_code: E1419
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: participation.cancel-participation-joined
    title: 이미 끝난 참여를 다시 취소하면 E1419로 거절된다
    suite: sanity
    variant: 룸-생성/S2/participation-joined
    domains:
    - participation
    operations:
    - roomLeave
    covers:
    - G.participation.cancel#participation-joined
    - op.roomLeave:E1419
    source:
    - PRD/룸 참여 및 참여자 관리 §3
    - PRD/룸 참여 및 참여자 관리 §4.6
    - PRD/룸 참여 및 참여자 관리 §4.10
    actor: qa-host
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 이미 끝난 참여 재취소 거절 {{rand}}'
    steps:
    - name: 방장이 먼저 룸을 나가 참여를 끝낸다
      request:
        method: DELETE
        path: /v1/rooms/{{roomId}}/participants/me
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 같은 방장이 이미 끝난 참여를 다시 취소하면 거절된다
      covers:
      - G.participation.cancel#participation-joined
      - op.roomLeave:E1419
      request:
        method: DELETE
        path: /v1/rooms/{{roomId}}/participants/me
      expect:
        status: 403
        result: ERROR
        error_code: E1419
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: participation.leave-after-confirm
    title: 진행 확정 뒤에도 참여자가 직접 참여를 취소할 수 있다
    suite: sanity
    variant: 룸-진행-확정/S1/leave-after-confirm
    domains:
    - participation
    operations:
    - roomLeave
    covers:
    - C.participation.cancel
    - op.roomLeave:200
    source:
    - PRD/룸 참여 및 참여자 관리 §3 R23
    - PRD/룸 참여 및 참여자 관리 §4.6 R114
    - PRD/룸 참여 및 참여자 관리 §4.6 R119
    - PRD/룸 참여 및 참여자 관리 §4.6 R120
    - PRD/룸 참여 및 참여자 관리 §6 R156
    - PRD/룸 참여 및 참여자 관리 §6 R158
    - PRD/룸 참여 및 참여자 관리 §6 R159
    - OpenAPI DELETE /v1/rooms/{roomId}/participants/me
    actor: qa-host
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 진행 확정 뒤 참여 취소 sanity {{rand}}'
    steps:
    - name: 진행 확정된 룸에서 참여자가 직접 나간다
      actor: qa-guest
      covers:
      - C.participation.cancel
      - op.roomLeave:200
      request:
        method: DELETE
        path: /v1/rooms/{{roomId}}/participants/me
      expect:
        status: 200
        result: SUCCESS
        json:
          data: null
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

