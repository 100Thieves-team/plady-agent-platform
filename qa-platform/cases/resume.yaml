  - id: resume.account-active
    title: 이용이 제한된 계정이 이력서를 올리면 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/account-active
    domains:
    - resume
    operations:
    - createResume
    covers:
    - G.resume.create#account-active
    source:
    - PRD/회원 및 프로필 R50
    - PRD/회원 및 프로필 R58
    - PRD/회원 및 프로필 R59
    - PRD/회원 및 프로필 §8
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.member-restricted
    steps:
    - name: 이용 제한 회원이 이력서 등록을 시도하면 거절된다
      covers:
      - G.resume.create#account-active
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        body:
          TODO: OpenAPI 발췌에 이력서 등록 요청 형식이 없어 multipart/form-data 필드와 파일 fixture를 확정해야 한다
      expect:
        status: 4xx
        result: ERROR
      save: {}
    - name: 정리(QA 회원 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: resume.set-default-deleted
    title: 지운 이력서를 기본으로 지정하면 E1010으로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/set-default.resume-not-deleted
    domains:
    - resume
    operations:
    - makeResumeDefault
    covers:
    - G.resume.set_default#resume-not-deleted
    - op.makeResumeDefault:E1010
    source:
    - PRD/회원 및 프로필 §4.4-1 R60-R62
    - OpenAPI POST /v1/members/me/resumes/{resumeId}/make-default
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 삭제된 이력서를 기본 이력서로 지정하면 E1010으로 거절된다
      covers:
      - G.resume.set_default#resume-not-deleted
      - op.makeResumeDefault:E1010
      request:
        method: POST
        path: /v1/members/me/resumes/{{deletedResumeId}}/make-default
      expect:
        status: 404
        result: ERROR
        error_code: E1010
      save: {}
    TODO: 삭제된 qa-guest 소유 이력서 id를 만드는 dev 카드나 이력서 삭제 API 계약이 근거에 없어서 deletedResumeId 입력이 필요하다. subject 가 F.resume.owner 인가 조건을 먼저 통과한 뒤 resume-not-deleted 검사만 걸리게 해야 한다.

  - id: resume.set-default-owner-only
    title: 다른 사람의 이력서를 기본으로 지정하면 E1010 으로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/set-default.resume-owner-only
    domains:
    - resume
    operations:
    - makeResumeDefault
    covers:
    - G.resume.set_default#resume-owner-only
    - op.makeResumeDefault:E1010
    source:
    - PRD/회원 및 프로필 R60
    - PRD/회원 및 프로필 R61
    - PRD/회원 및 프로필 R62
    - OpenAPI POST /v1/members/me/resumes/{resumeId}/make-default
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 다른 회원의 이력서를 기본 이력서로 지정 시도
      covers:
      - G.resume.set_default#resume-owner-only
      - op.makeResumeDefault:E1010
      request:
        method: POST
        path: /v1/members/me/resumes/{{fixture.qa-host.resumeId}}/make-default
      expect:
        status: 404
        result: ERROR
        error_code: E1010
      save: {}

  - id: resume.set-default-summary-done
    title: AI 요약이 끝나지 않은 이력서를 기본으로 지정하면 E1012 로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/summary-done
    domains:
    - resume
    operations:
    - makeResumeDefault
    covers:
    - G.resume.set_default#summary-done
    - op.makeResumeDefault:E1012
    source:
    - PRD/회원 및 프로필 §4.4-1 R60
    - PRD/회원 및 프로필 §4.4-1 R61
    - PRD/회원 및 프로필 §4.4-1 R62
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.resume-list
      with:
        actor: qa-guest
    steps:
    - name: 요약 미완료 이력서를 기본 이력서로 지정 시도
      covers:
      - G.resume.set_default#summary-done
      - op.makeResumeDefault:E1012
      request:
        method: POST
        path: /v1/members/me/resumes/{{firstResumeId}}/make-default
      expect:
        status: 409
        result: ERROR
        error_code: E1012
      save: {}
    TODO: setup.resume-list 의 firstSummaryStatus 가 DONE 이 아닌 이력서를 돌려줘야 한다. 주어진 근거에는 요약 미완료 이력서를 새로 만들거나 강제로 미완료 상태로 바꾸는 dev 도구가 없다.

  - id: resume.delete-resume-not-deleted
    title: 이미 지운 이력서를 또 지우면 E1010 으로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/delete.resume-not-deleted
    domains:
    - resume
    operations:
    - deleteResume
    covers:
    - G.resume.delete#resume-not-deleted
    - op.deleteResume:E1010
    source:
    - PRD/회원 및 프로필 R56
    - PRD/회원 및 프로필 R57
    - OpenAPI DELETE /v1/members/me/resumes/{resumeId}
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 전제 만들기 — 소유한 보관 이력서를 먼저 삭제한다
      covers: []
      request:
        method: DELETE
        path: /v1/members/me/resumes/{{fixture.qa-guest.resumeId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 이미 삭제된 이력서를 다시 삭제하면 E1010 으로 거절된다
      covers:
      - G.resume.delete#resume-not-deleted
      - op.deleteResume:E1010
      request:
        method: DELETE
        path: /v1/members/me/resumes/{{fixture.qa-guest.resumeId}}
      expect:
        status: 404
        result: ERROR
        error_code: E1010
      save: {}
