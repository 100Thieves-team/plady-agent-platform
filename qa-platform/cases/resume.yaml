  - id: resume.account-active
    title: 이용이 제한된 계정이 이력서를 올리면 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/account-active
    domains:
    - resume
    operations:
    - createResume
    covers:
    - G.resume.create#account-active
    source:
    - PRD/회원 및 프로필 R50
    - PRD/회원 및 프로필 R58
    - PRD/회원 및 프로필 R59
    - PRD/회원 및 프로필 §8
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.member-restricted
    steps:
    - name: 이용 제한 계정으로 이력서 등록 시도
      actor: null
      covers:
      - G.resume.create#account-active
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        multipart:
          file:
            sample: pdf
            filename: '[QA] 이용 제한 계정 이력서 {{rand}}.pdf'
      expect:
        status: 4xx
        result: ERROR
        error_code: E1002
      save: {}
    - name: 정리(QA 회원 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: resume.set-default-deleted
    title: 지운 이력서를 기본으로 지정하면 E1010 으로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/set-default.resume-not-deleted
    domains:
    - resume
    operations:
    - makeResumeDefault
    covers:
    - G.resume.set_default#resume-not-deleted
    - op.makeResumeDefault:E1010
    source:
    - PRD/회원 및 프로필 R60
    - PRD/회원 및 프로필 R61
    - PRD/회원 및 프로필 R62
    actor: qa-guest
    reviewed:
      at: '2026-10-09'
      by: bebe
    written_by: hermes
    steps:
    - name: 새 QA 회원 만들기 (dev 전용 API)
      covers: []
      request:
        method: POST
        path: /v1/dev/members
      expect:
        status: 200
        result: SUCCESS
      save:
        memberId: data.memberId
        memberToken: data.accessToken
    - name: 기본 지정용 이력서
      covers: []
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        multipart:
          file:
            sample: pdf
            filename: '[QA] 기본 지정용 이력서 {{rand}}.pdf'
      expect:
        status: 2xx
        result: SUCCESS
      save:
        deletedResumeId: data.resumeId
    - name: 전제 만들기 — 올린 이력서를 지운다
      covers: []
      actor: null
      request:
        method: DELETE
        path: /v1/members/me/resumes/{{deletedResumeId}}
        headers:
          Authorization: Bearer {{memberToken}}
      expect:
        status: 200
        result: SUCCESS
    - name: 삭제된 이력서를 기본 이력서로 지정하면 E1010 으로 거절된다
      covers:
      - G.resume.set_default#resume-not-deleted
      - op.makeResumeDefault:E1010
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes/{{deletedResumeId}}/make-default
        headers:
          Authorization: Bearer {{memberToken}}
      expect:
        status: 404
        result: ERROR
        error_code: E1010
    - name: 정리(QA 회원 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS

  - id: resume.set-default-owner-only
    title: 다른 사람의 이력서를 기본으로 지정하면 E1010 으로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/set-default.resume-owner-only
    domains:
    - resume
    operations:
    - makeResumeDefault
    covers:
    - G.resume.set_default#resume-owner-only
    - op.makeResumeDefault:E1010
    source:
    - PRD/회원 및 프로필 R60
    - PRD/회원 및 프로필 R61
    - PRD/회원 및 프로필 R62
    - OpenAPI POST /v1/members/me/resumes/{resumeId}/make-default
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 다른 회원의 이력서를 기본 이력서로 지정 시도
      covers:
      - G.resume.set_default#resume-owner-only
      - op.makeResumeDefault:E1010
      request:
        method: POST
        path: /v1/members/me/resumes/{{fixture.qa-host.resumeId}}/make-default
      expect:
        status: 404
        result: ERROR
        error_code: E1010
      save: {}

  - id: resume.set-default-summary-done
    title: AI 요약이 끝나지 않은 이력서를 기본으로 지정하면 E1012로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/summary-done
    domains:
    - resume
    operations:
    - makeResumeDefault
    covers:
    - G.resume.set_default#summary-done
    - op.makeResumeDefault:E1012
    source:
    - PRD/회원 및 프로필 §4.4-1 R60-R62
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.resume-list
      with:
        actor: qa-guest
    steps:
    - name: 요약 미완료 이력서를 기본 이력서로 지정 시도
      covers:
      - G.resume.set_default#summary-done
      - op.makeResumeDefault:E1012
      request:
        method: POST
        path: /v1/members/me/resumes/{{firstResumeId}}/make-default
      expect:
        status: 409
        result: ERROR
        error_code: E1012
        json:
          error.message: AI 요약이 완료된 이력서만 사용할 수 있습니다.
      save: {}

