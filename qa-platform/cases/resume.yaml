# resume — QA 플랫폼 폼으로 만든 파일.
cases:
  - id: resume.resume-slot-left
    title: 이력서가 이미 10개인데 또 올리면 E1011로 거절된다
    suite: sanity
    variant: 회원-및-프로필/S2/resume-slot-left
    domains:
    - resume
    operations:
    - createResume
    covers:
    - G.resume.create#resume-slot-left
    source:
    - PRD/회원 및 프로필 R50
    - PRD/회원 및 프로필 R58
    - PRD/회원 및 프로필 R59
    - PRD/회원 및 프로필 §8
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    steps:
    - name: 새 QA 회원 만들기 (dev 전용 API)
      covers: []
      request:
        method: POST
        path: /v1/dev/members
      expect:
        status: 200
        result: SUCCESS
      save:
        memberId: data.memberId
        memberToken: data.accessToken
    - name: 보관 이력서 1
      covers: []
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        multipart:
          file:
            sample: pdf
            filename: '[QA] 보관 이력서 1 {{rand}}.pdf'
      expect:
        status: 2xx
        result: SUCCESS
      save:
        resume1: data.resumeId
