# guestbook — QA 플랫폼 폼으로 만든 파일.
cases:
  - id: guestbook.post-happy
    title: 방장과 참여자가 방명록에 준비 내용을 남긴다
    suite: sanity
    variant: 룸-방명록/S1/happy
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - C.guestbook.post
    - op.createRoomComment:200
    source:
    - PRD/룸 방명록 §2
    - PRD/룸 방명록 §4.2
    - PRD/룸 방명록 §4.6
    - PRD/룸 방명록 §6
    actor: qa-host
    reviewed:
      at: '2026-10-10'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 방명록 sanity {{rand}}'
    steps:
    - name: 방장이 방명록에 준비 공지를 남긴다
      covers:
      - C.guestbook.post
      - op.createRoomComment:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 면접 준비 자료는 시작 전까지 확인해 주세요. {{rand}}'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.commentId
        - data.createdAt
      save:
        hostCommentId: data.commentId
        hostCommentCreatedAt: data.createdAt
    - name: 참여자가 방명록 댓글 알림을 받는다
      notify:
        to: qa-guest
        channels:
        - web_push
        within: 60
        type: ROOM_COMMENT_POSTED
        expect:
          link: /interviews/{{roomId}}
      covers: []
    - name: 참여자가 방명록에 질문을 남긴다
      actor: qa-guest
      covers:
      - C.guestbook.post
      - op.createRoomComment:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 자기소개는 각자 3분 정도 준비하면 될까요? {{rand}}'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.commentId
        - data.createdAt
      save:
        guestCommentId: data.commentId
        guestCommentCreatedAt: data.createdAt
    - name: 방장이 방명록 댓글 알림을 받는다
      notify:
        to: qa-host
        channels:
        - web_push
        within: 60
        type: ROOM_COMMENT_POSTED
        expect:
          link: /interviews/{{roomId}}
      covers: []
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: guestbook.guestbook-not-readonly
    title: 읽기 전용이 된 방명록에 글을 쓰면 E2101로 거절된다
    suite: sanity
    variant: 룸-방명록/S1/guestbook-not-readonly
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - G.guestbook.post_write#guestbook-not-readonly
    - op.createRoomComment:E2101
    source:
    - PRD/룸 방명록 R8
    - PRD/룸 방명록 R10
    - PRD/룸 방명록 R28
    - PRD/룸 방명록 R29
    - PRD/룸 방명록 R35
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-ready-to-start
      with:
        title: '[QA] 읽기 전용 방명록 거절 {{rand}}'
    steps:
    - name: 룸을 자동 완료 처리한다
      covers: []
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 읽기 전용 방명록 글 작성 거절
      covers:
      - G.guestbook.post_write#guestbook-not-readonly
      - op.createRoomComment:E2101
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 읽기 전용 방명록에는 새 글을 남길 수 없어야 한다.'
      expect:
        status: 409
        result: ERROR
        error_code: E2101
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: guestbook.account-active
    title: 이용이 제한된 계정이 방명록에 글을 쓰면 거절된다
    suite: sanity
    variant: 룸-방명록/S1/account-active
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - G.guestbook.post_write#account-active
    source:
    - PRD/룸 방명록 §3
    - PRD/룸 방명록 §4.3
    - PRD/룸 방명록 §4.6
    actor: qa-host
    reviewed:
      at: '2026-10-10'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-open
      with:
        title: '[QA] 방명록 이용 제한 검증 룸 {{rand}}'
        minParticipants: 2
        maxParticipants: 4
        daysFromNow: 7
    steps:
    - name: 참여시킬 QA 회원 생성
      request:
        method: POST
        path: /v1/dev/members
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.memberId
        - data.accessToken
      save:
        memberId: data.memberId
        memberToken: data.accessToken
      covers: []
    - name: 참여시킬 회원의 기본 이력서 업로드
      actor: null
      request:
        method: POST
        path: /v1/members/me/resumes
        headers:
          Authorization: Bearer {{memberToken}}
        multipart:
          file:
            sample: pdf
            filename: '[QA] 방명록 참여자 이력서 {{rand}}.pdf'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.resumeId
      save:
        resumeId: data.resumeId
      covers: []
    - name: 이력서 AI 요약 완료 강제
      request:
        method: POST
        path: /v1/dev/resumes/{{resumeId}}/summary
        body:
          summary: '[QA] 방명록 이용 제한 검증용 이력서 요약입니다.'
      expect:
        status: 200
        result: SUCCESS
        json:
          data.status: DONE
      save: {}
      covers: []
    - name: 참여시킬 회원이 룸에 신청
      actor: null
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/applications
        headers:
          Authorization: Bearer {{memberToken}}
        body:
          resumeId: '{{resumeId}}'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.applicationId
      save:
        applicationId: data.applicationId
      covers: []
    - name: 방장이 신청을 수락해 참여 상태를 만든다
      actor: qa-host
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/applications/{{applicationId}}/accept
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.applicationId
      save: {}
      covers: []
    - name: 참여 상태 확인
      actor: null
      request:
        method: GET
        path: /v1/attendances/me
        headers:
          Authorization: Bearer {{memberToken}}
        query:
          roomId: '{{roomId}}'
      expect:
        status: 200
        result: SUCCESS
        json:
          data.memberId: '{{memberId}}'
          data.status: JOINED
      save: {}
      covers: []
    - name: 참여 회원을 이용 제한 상태로 변경
      request:
        method: POST
        path: /v1/dev/members/{{memberId}}/status
        body:
          status: RESTRICTED
      expect:
        status: 200
        result: SUCCESS
        json:
          data.status: RESTRICTED
      save: {}
      covers: []
    - name: 이용 제한 참여자가 방명록 글 작성을 시도하면 거절된다
      actor: null
      covers:
      - G.guestbook.post_write#account-active
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        headers:
          Authorization: Bearer {{memberToken}}
        body:
          content: '[QA] 이용 제한 참여자의 방명록 글 작성 시도 {{rand}}'
      expect:
        status: 4xx
        result: ERROR
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []
    - name: 정리(QA 회원 삭제)
      always: true
      request:
        method: DELETE
        path: /v1/dev/members/{{memberId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
      covers: []

  - id: guestbook.joined-member-only
    title: 룸에 참여하지 않은 사람이 방명록에 글을 쓰면 E1419로 거절된다
    suite: sanity
    variant: 룸-방명록/S1/joined-member-only
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - G.guestbook.post_write#joined-member-only
    - op.createRoomComment:E1419
    source:
    - PRD/룸 방명록 R8
    - PRD/룸 방명록 R10
    - PRD/룸 방명록 R21
    - PRD/룸 방명록 R25
    - PRD/룸 방명록 R28
    - PRD/룸 방명록 R29
    - PRD/룸 방명록 R33
    - PRD/룸 방명록 R35
    - OpenAPI POST /v1/rooms/{roomId}/comments
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-open
      with:
        title: '[QA] 방명록 비참여자 작성 거절 {{rand}}'
        minParticipants: 2
        maxParticipants: 4
        daysFromNow: 7
    steps:
    - name: 참여하지 않은 사용자가 방명록 글 작성을 시도하면 거절된다
      covers:
      - G.guestbook.post_write#joined-member-only
      - op.createRoomComment:E1419
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: 비참여 사용자가 기존 화면에서 글 등록을 시도합니다.
      expect:
        status: 403
        result: ERROR
        error_code: E1419
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
