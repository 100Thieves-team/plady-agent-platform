# guestbook — QA 플랫폼 폼으로 만든 파일.
cases:
  - id: guestbook.post-happy
    title: 방장과 참여자가 방명록에 준비 내용을 남긴다
    suite: sanity
    variant: 룸-방명록/S1/happy
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - C.guestbook.post
    - op.createRoomComment:200
    source:
    - PRD/룸 방명록 §2
    - PRD/룸 방명록 §4.2
    - PRD/룸 방명록 §4.6
    - PRD/룸 방명록 §6
    actor: qa-host
    reviewed:
      at: '2026-09-25'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 방명록 sanity {{rand}}'
    steps:
    - name: 방장이 방명록에 준비 공지를 남긴다
      covers:
      - C.guestbook.post
      - op.createRoomComment:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 면접 준비 자료는 시작 전까지 확인해 주세요. {{rand}}'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.commentId
        - data.createdAt
      save:
        hostCommentId: data.commentId
        hostCommentCreatedAt: data.createdAt
    - name: 참여자가 방명록에 질문을 남긴다
      actor: qa-guest
      covers:
      - C.guestbook.post
      - op.createRoomComment:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 자기소개는 각자 3분 정도 준비하면 될까요? {{rand}}'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.commentId
        - data.createdAt
      save:
        guestCommentId: data.commentId
        guestCommentCreatedAt: data.createdAt
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: guestbook.guestbook-not-readonly
    title: 읽기 전용이 된 방명록에 글을 쓰면 E2101로 거절된다
    suite: sanity
    variant: 룸-방명록/S1/guestbook-not-readonly
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - G.guestbook.post_write#guestbook-not-readonly
    - op.createRoomComment:E2101
    source:
    - PRD/룸 방명록 R8
    - PRD/룸 방명록 R10
    - PRD/룸 방명록 R28
    - PRD/룸 방명록 R29
    - PRD/룸 방명록 R35
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-ready-to-start
      with:
        title: '[QA] 읽기 전용 방명록 거절 {{rand}}'
    steps:
    - name: 룸을 자동 완료 처리한다
      covers: []
      request:
        method: POST
        path: /v1/dev/rooms/{{roomId}}/auto-complete
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 읽기 전용 방명록 글 작성 거절
      covers:
      - G.guestbook.post_write#guestbook-not-readonly
      - op.createRoomComment:E2101
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 읽기 전용 방명록에는 새 글을 남길 수 없어야 한다.'
      expect:
        status: 409
        result: ERROR
        error_code: E2101
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: guestbook.account-active
    title: 이용이 제한된 계정이 방명록에 글을 쓰면 거절된다
    suite: sanity
    variant: 룸-방명록/S1/account-active
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - G.guestbook.post_write#account-active
    - op.createRoomComment:200
    source:
    - PRD/룸 방명록 §3
    - PRD/룸 방명록 §4.3
    - PRD/룸 방명록 §4.4
    - PRD/룸 방명록 §4.6
    - OpenAPI POST /v1/rooms/{roomId}/comments
    actor: qa-host
    reviewed:
      at: '2026-10-10'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-confirmed
      with:
        title: '[QA] 방명록 account-active sanity {{rand}}'
    steps:
    - name: 활성 계정인 방장이 방명록 글을 작성할 수 있다
      actor: qa-host
      covers:
      - op.createRoomComment:200
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 방명록 정상 작성 확인 {{rand}}'
      expect:
        status: 200
        result: SUCCESS
        exists:
        - data.commentId
        - data.createdAt
      save:
        hostCommentId: data.commentId
    - name: 방장을 뺀 참여자에게 방명록 글 작성 알림이 도착한다
      notify:
        to: qa-guest
        channels:
        - web_push
        within: 60
        type: ROOM_COMMENT_POSTED
        expect:
          link: /interviews/{{roomId}}
      covers: []
    - name: 참여자인 qa-guest 계정을 이용 제한 상태로 바꾼다
      actor: qa-host
      covers: []
      request:
        method: POST
        path: /v1/dev/members/{{actor.qa-guest.memberId}}/status
        body:
          status: RESTRICTED
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 이용 제한된 참여자가 방명록 글을 작성하면 거절된다
      actor: qa-guest
      covers:
      - G.guestbook.post_write#account-active
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: '[QA] 이용 제한 계정 방명록 작성 시도 {{rand}}'
      expect:
        status: 4xx
        result: ERROR
      save: {}
    - name: 정리(qa-guest 계정 상태 복구)
      always: true
      actor: qa-host
      covers: []
      request:
        method: POST
        path: /v1/dev/members/{{actor.qa-guest.memberId}}/status
        body:
          status: ACTIVE
      expect:
        status: 200
        result: SUCCESS
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      actor: qa-host
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}

  - id: guestbook.joined-member-only
    title: 룸에 참여하지 않은 사람이 방명록에 글을 쓰면 E1419로 거절된다
    suite: sanity
    variant: 룸-방명록/S1/joined-member-only
    domains:
    - guestbook
    operations:
    - createRoomComment
    covers:
    - G.guestbook.post_write#joined-member-only
    - op.createRoomComment:E1419
    source:
    - PRD/룸 방명록 R8
    - PRD/룸 방명록 R10
    - PRD/룸 방명록 R21
    - PRD/룸 방명록 R25
    - PRD/룸 방명록 R28
    - PRD/룸 방명록 R29
    - PRD/룸 방명록 R33
    - PRD/룸 방명록 R35
    - OpenAPI POST /v1/rooms/{roomId}/comments
    actor: qa-guest
    reviewed:
      at: '2026-10-08'
      by: bebe
    written_by: hermes
    uses:
      setup: setup.room-open
      with:
        title: '[QA] 방명록 비참여자 작성 거절 {{rand}}'
        minParticipants: 2
        maxParticipants: 4
        daysFromNow: 7
    steps:
    - name: 참여하지 않은 사용자가 방명록 글 작성을 시도하면 거절된다
      covers:
      - G.guestbook.post_write#joined-member-only
      - op.createRoomComment:E1419
      request:
        method: POST
        path: /v1/rooms/{{roomId}}/comments
        body:
          content: 비참여 사용자가 기존 화면에서 글 등록을 시도합니다.
      expect:
        status: 403
        result: ERROR
        error_code: E1419
      save: {}
    - name: 정리(QA 룸 삭제)
      always: true
      covers: []
      request:
        method: DELETE
        path: /v1/dev/rooms/{{roomId}}
      expect:
        status: 200
        result: SUCCESS
      save: {}
