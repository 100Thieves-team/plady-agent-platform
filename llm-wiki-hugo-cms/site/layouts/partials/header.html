<header class="site-header">
  <nav class="site-nav">
    <a href="{{ "/" | relURL }}" class="site-title">{{ .Site.Title }}</a>
    <ul class="nav-links">
      {{ range partial "sections.html" . }}
      <li>
        <a href="{{ .RelPermalink }}"
           {{ if and (ne $.Section "") (eq $.Section .Section) }}class="active" aria-current="true"{{ end }}>
          {{ .Title }}
        </a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
