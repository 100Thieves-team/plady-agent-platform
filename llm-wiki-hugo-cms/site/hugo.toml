baseURL = "https://plady.kro.kr/"
title = "100Thieves Wiki"
languageCode = "ko-kr"

# Point directly at the wiki content directory.
# Option A (Hugo site at wiki repo root): contentDir = "wiki"
# Option B (Hugo site in a site/ subdirectory):
# contentDir is set via module mount below (supports excludeFiles patterns)

# Frontmatter field mapping
[frontmatter]
  lastmod = ["last_updated", ":git"]
  date    = ["last_updated", ":git"]

# Taxonomies from wiki frontmatter
[taxonomies]
  tag    = "tags"
  author = "owner"
  type   = "type"

# Mount curated wiki pages and raw source documents as Hugo content.
# `wiki/` stays at the site root (people/topics/sources), while `raw/` is
# exposed under /raw/ so original meeting notes and ADR inputs remain readable.
[module]
  [[module.mounts]]
    source = "../wiki"
    target = "content"
    excludeFiles = [
      "**/*.json",
      "**/*.txt",
      "**/LINT.md",
    ]

  [[module.mounts]]
    source = "../raw"
    target = "content/raw"
    excludeFiles = [
      "attachments/**",
      "views/**",
      "**/*.json",
      "**/*.yml",
      "**/*.yaml",
      "**/*.txt",
      "**/LINT.md",
    ]

# Markup
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true        # required for mermaid fenced blocks and raw HTML
  [markup.highlight]
    style = "monokai"

# Output formats
[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  description = "100Thieves team knowledge base powered by llm-wiki and Hugo"
  mermaid     = true
  showMetadata   = true
  showBacklinks  = true
  showSuperseded = true
