baseURL = "https://plady.kro.kr/"
title = "100Thieves Wiki"
languageCode = "ko-kr"
pluralizeListTitles = false

# Point directly at the wiki content directory.
# Option A (Hugo site at wiki repo root): contentDir = "wiki"
# Option B (Hugo site in a site/ subdirectory):
# contentDir is set via module mount below (supports excludeFiles patterns)

# Frontmatter field mapping
[frontmatter]
  lastmod = ["last_updated", ":git"]
  date    = ["last_updated", ":git"]

# Taxonomies from wiki frontmatter
[taxonomies]
  tag    = "tags"
  author = "owner"
  type   = "type"

# Mount curated wiki pages and raw source documents as Hugo content.
# `wiki/` stays at the site root (people/topics/sources), while `raw/` is
# exposed under /raw/ so original meeting notes and ADR inputs remain readable.
[module]
  [[module.mounts]]
    source = "../wiki"
    target = "content"
    excludeFiles = [
      "**/*.json",
      "**/*.txt",
      # wiki/policy/_src/상태-SSOT.yaml (정책서 SSOT 원본) 등 yaml 은 페이지가 아니다.
      "**/*.yaml",
      "**/*.yml",
      "**/LINT.md",
      # policy/viewer 는 콘텐츠가 아니라 정적 앱(상태-SSOT 인터랙티브 뷰어) —
      # 아래 static 마운트로 verbatim 서빙한다.
      "policy/viewer/**",
    ]

  # 상태-SSOT 인터랙티브 뷰어(자체 CSS/JS 단일 HTML)를 /policy/viewer/ 아래
  # 원본 그대로 서빙. 디렉토리는 wiki-ui 시작 커맨드가 mkdir 로 보장한다
  # (마운트 소스가 없으면 Hugo 빌드가 중단되는 것과 같은 제약).
  [[module.mounts]]
    source = "../wiki/policy/viewer"
    target = "static/policy/viewer"

  [[module.mounts]]
    source = "../raw"
    target = "content/raw"
    excludeFiles = [
      "attachments/**",
      "views/**",
      "**/*.json",
      "**/*.yml",
      "**/*.yaml",
      "**/*.txt",
      "**/LINT.md",
    ]

# Markup
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true        # required for mermaid fenced blocks and raw HTML
  [markup.highlight]
    style = "github"

# Output formats
[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  description = "100Thieves team knowledge base powered by llm-wiki and Hugo"
  sectionOrder = ["topics", "sources", "people", "policy", "raw"]
  mermaid     = true
  showMetadata   = true
  showBacklinks  = true
  showSuperseded = true
