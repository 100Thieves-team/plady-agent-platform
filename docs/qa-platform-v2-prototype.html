<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plady QA 2판 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--text:#191F28;--text2:#4E5968;--text3:#8B95A1;--line:#E5E8EB;--hover:#F9FAFB;
  --blue:#3182F6;--blue-d:#1B64DA;--blue-w:#E8F3FF;
  --red:#F04452;--red-w:#FFEEEF;--green:#1FB26B;--green-w:#E5F8EE;--orange:#F18F01;--orange-w:#FFF3E0;--grey-w:#F2F4F6;
  --r:20px;--r-s:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:0}

/* 윗줄 */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;gap:28px;padding:0 24px}
.logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--blue);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:7px 6px 7px 6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.nav{display:flex;gap:4px;flex:1;align-items:center}
.nav a{padding:8px 12px;border-radius:10px;color:var(--text2);font-weight:600;font-size:15px}
.nav a:hover{background:var(--hover)}
.nav a.on{color:var(--text);background:var(--grey-w)}
.more{position:relative}
.more-menu{display:none;position:absolute;top:44px;left:0;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:8px;min-width:200px}
.more.open .more-menu{display:block}
.more-menu a{display:block;padding:10px 12px;border-radius:10px;color:var(--text);font-weight:500}
.more-menu a:hover{background:var(--hover)}
.more-menu small{display:block;color:var(--text3);font-weight:400;font-size:12px}
.me{display:flex;align-items:center;gap:10px}
.chip-me{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--grey-w);font-weight:600;font-size:14px}
.chip-me b{width:26px;height:26px;border-radius:50%;background:#FFD86B;display:grid;place-items:center;font-size:12px}
.btn-hermes{padding:8px 14px;border-radius:999px;background:var(--text);color:#fff;font-weight:700;font-size:14px}

/* 본문 */
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 140px}
h1{font-size:28px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 14px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--text2);font-size:16px;margin:0 0 28px}
.section{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-head h2{margin:0}
.sec-head a{color:var(--text3);font-size:14px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:24px}
.card+.card{margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.demo{display:inline-block;font-size:11px;font-weight:700;color:var(--text3);background:var(--grey-w);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle;letter-spacing:0}

/* 목록 */
.list{background:var(--card);border-radius:var(--r);padding:8px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px}
.row.link{cursor:pointer}
.row.link:hover{background:var(--hover)}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--text3);font-size:13px;margin-top:2px}
.row.faded{opacity:.55}
.ic.blue{background:var(--blue-w);color:var(--blue)}.ic.red{background:var(--red-w);color:var(--red)}
.ic.green{background:var(--green-w);color:var(--green)}.ic.orange{background:var(--orange-w);color:var(--orange)}.ic.grey{background:var(--grey-w);color:var(--text3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap;transition:background .15s}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.soft{background:var(--blue-w);color:var(--blue)}.btn.soft:hover{background:#D6E9FF}
.btn.grey{background:var(--grey-w);color:var(--text2)}.btn.grey:hover{background:#E5E8EB}
.btn.danger{background:var(--red-w);color:var(--red)}
.btn.big{height:56px;border-radius:16px;font-size:17px;padding:0 24px}
.btn.full{width:100%}

/* 상태 */
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-pass{background:var(--green-w);color:var(--green)}.b-fail{background:var(--red-w);color:var(--red)}
.b-need{background:var(--orange-w);color:var(--orange)}.b-run{background:var(--blue-w);color:var(--blue)}.b-none{background:var(--grey-w);color:var(--text3)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--text2);background:var(--grey-w);border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0}

/* 홈 */
.hello{font-size:15px;color:var(--text3);font-weight:600;margin-bottom:4px}
.job{background:var(--card);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px;min-height:196px;cursor:pointer;transition:transform .15s}
.job:hover{transform:translateY(-2px)}
.job .em{font-size:30px}
.job .n{font-weight:800;font-size:19px}
.job .d{color:var(--text2);font-size:14px;flex:1}
.job .go{color:var(--blue);font-weight:700;font-size:14px}
.prog{height:8px;border-radius:99px;background:var(--grey-w);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--text3);font-size:13px;margin:4px 0 14px}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;background:var(--c)}
.frow{display:grid;grid-template-columns:200px 1fr 150px;gap:18px;align-items:center;padding:12px 8px;border-radius:12px}
.frow:hover{background:var(--hover)}
.frow .nm{font-weight:600}
.frow .ct{color:var(--text3);font-size:13px;text-align:right}
.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty .em{font-size:36px;margin-bottom:8px}
.empty b{display:block;color:var(--text2);font-size:16px;margin-bottom:4px}

/* 세그먼트 */
.seg{display:inline-flex;background:#E9ECEF;border-radius:12px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--text2);font-size:14px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Sanity 결과 */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--text3);font-weight:600;font-size:14px;margin-bottom:14px}
.meta{color:var(--text3);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{border-radius:var(--r);padding:20px 22px;display:flex;gap:14px;align-items:flex-start;margin:22px 0 0}
.banner.need{background:var(--orange-w)}
.banner .em{font-size:22px;line-height:1.2}
.banner b{display:block;font-size:17px;margin-bottom:2px}
.banner p{margin:0;color:var(--text2)}
.cols{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;margin-top:16px}
.steps{background:var(--card);border-radius:var(--r);padding:22px 20px;position:sticky;top:80px}
.st{display:flex;gap:12px;position:relative;padding-bottom:22px}
.st:last-child{padding-bottom:0}
.st:not(:last-child):after{content:"";position:absolute;left:13px;top:30px;bottom:4px;width:2px;background:var(--line)}
.st.done:not(:last-child):after{background:var(--blue)}
.st .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--grey-w);color:var(--text3)}
.st.done .dot{background:var(--blue);color:#fff}
.st.need .dot{background:var(--orange);color:#fff}
.st .n{font-weight:700}
.st .d{color:var(--text3);font-size:13px}
.st.need .d{color:var(--orange);font-weight:600}
.find{background:var(--card);border-radius:var(--r);padding:22px}
.find+.find{margin-top:12px}
.find .k{font-size:13px;font-weight:700;color:var(--orange);margin-bottom:6px}
.find .k.info{color:var(--text3)}
.find h3{font-size:17px;margin:0 0 12px;line-height:1.45}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.vs div{background:var(--bg);border-radius:14px;padding:14px;font-size:14px;color:var(--text2)}
.vs div b{display:block;font-size:12px;color:var(--text3);margin-bottom:4px;font-weight:700}
.q{background:var(--blue-w);border-radius:14px;padding:14px 16px;font-size:15px}
.q b{color:var(--blue)}
.q .rec{color:var(--text2);font-size:14px;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts.done{color:var(--green);font-weight:700}
.scope-f{padding:14px 16px;border-radius:14px}
.scope-f+.scope-f{border-top:1px solid var(--line);border-radius:0}
.scope-f .fn{font-weight:700;display:flex;justify-content:space-between}
.reqs{margin:8px 0 0;padding:0;list-style:none}
.reqs li{font-size:14px;color:var(--text2);padding:3px 0;display:flex;gap:8px}
.reqs li .mono{color:var(--text3);flex:none;padding-top:2px}
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:12px}
.bar-in .sum{flex:1;color:var(--text2);font-size:14px}
.bar-in .sum b{color:var(--text);font-size:16px;display:block}

/* 스모크 */
.pick{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;cursor:pointer}
.pick:hover{background:var(--hover)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid #D1D6DB;display:grid;place-items:center;flex:none;transition:all .12s}
.pick.on .ck{background:var(--blue);border-color:var(--blue)}
.pick.on .ck:after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pick .tx{flex:1}
.pick .t{font-weight:600}
.pick .d{color:var(--text3);font-size:13px}
.pick .n{color:var(--text2);font-weight:700;font-size:14px}
.res-head{display:flex;gap:28px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.running{height:10px;border-radius:99px;background:var(--grey-w);overflow:hidden;margin:18px 0 8px}
.running i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}

/* QA 데이터 */
.left-sum{display:flex;align-items:center;gap:24px}
.left-sum .nums{display:flex;gap:28px;flex:1}
.left-sum .nums div{font-size:13px;color:var(--text3)}
.left-sum .nums b{display:block;font-size:24px;color:var(--text);font-weight:800}
.dcard{background:var(--card);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:background .12s}
.dcard:hover{background:#FCFCFD;box-shadow:inset 0 0 0 1px var(--line)}
.dcard .t{font-weight:700;font-size:16px}
.dcard .d{color:var(--text3);font-size:13px;margin-top:2px}
.warn{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--orange);background:var(--orange-w);border-radius:6px;padding:3px 8px}

/* 바텀 시트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);background:#fff;border-radius:24px 24px 0 0;z-index:41;
  padding:12px 24px 24px;transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#D1D6DB;margin:0 auto 18px}
.sheet h3{font-size:21px;margin:0 0 6px;font-weight:800}
.sheet .sd{color:var(--text2);margin:0 0 20px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.fld input,.fld select{width:100%;height:52px;border-radius:14px;border:0;background:var(--bg);padding:0 16px;font:inherit;font-size:16px;color:var(--text);outline:none}
.fld input:focus{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
.fld .h{font-size:12px;color:var(--text3);margin-top:4px}
.kv{background:var(--bg);border-radius:14px;padding:4px 16px;margin-bottom:18px}
.kv div{display:flex;justify-content:space-between;padding:10px 0;font-size:14px}
.kv div+div{border-top:1px solid var(--line)}
.kv span{color:var(--text3)}
details.raw{margin:4px 0 18px}
details.raw summary{color:var(--text3);font-size:13px;font-weight:600;cursor:pointer}
details.raw pre{background:#191F28;color:#E5E8EB;border-radius:12px;padding:14px;font-size:12px;overflow:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:rgba(25,31,40,.94);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;
  z-index:50;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 휴대폰 */
@media (max-width:760px){
  .top-in{padding:0 16px;gap:12px}.nav{display:none}.chip-me span{display:none}
  .wrap{padding:22px 16px 150px}
  h1{font-size:23px}
  .grid3,.grid2,.cols,.vs{grid-template-columns:1fr}
  .steps{position:static}
  .frow{grid-template-columns:1fr;gap:6px}.frow .ct{text-align:left}
  .tabbar{display:flex}
  .bar-bottom{bottom:62px}
  .bar-in{padding:12px 16px}
  .left-sum{flex-direction:column;align-items:stretch}
}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:16}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);gap:2px}
.tabbar a i{font-style:normal;font-size:19px}
.tabbar a.on{color:var(--text)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/"><i></i>Plady QA</a>
  <nav class="nav" id="nav">
    <a href="#/" data-r="home">홈</a><a href="#/sanity" data-r="sanity">Sanity</a><a href="#/smoke" data-r="smoke">스모크</a><a href="#/data" data-r="data">QA 데이터</a>
    <div class="more" id="more"><a href="javascript:void 0" onclick="document.getElementById('more').classList.toggle('open')">더보기 ▾</a>
      <div class="more-menu">
        <a>시나리오<small>기능 · 시나리오 · 케이스</small></a><a>스크립트<small>YAML 스크립트 목록과 편집</small></a><a>테스트 조건<small>규칙표 · API 문서에서 나온 것</small></a>
        <a>API 호출<small>요청 하나를 dev 에 보내 보기</small></a><a>실행 기록</a><a>감사 로그</a><a>가이드</a>
      </div></div>
  </nav>
  <div class="me"><span class="chip-me"><b>be</b><span>bebe</span></span><button class="btn-hermes">Hermes</button></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="tabbar"><a href="#/" data-r="home"><i>⌂</i>홈</a><a href="#/sanity" data-r="sanity"><i>✓</i>Sanity</a><a href="#/smoke" data-r="smoke"><i>▶</i>스모크</a><a href="#/data" data-r="data"><i>▦</i>QA 데이터</a></nav>
<div class="dim" id="dim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

let smokeMode = "all", smokePick = null, smokeRun = null;
R.smoke = () => {
  const groups = {}; scripts.forEach(c => (groups[GROUP_OF(c)] ||= []).push(c));
  const names = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
  if (!smokePick) smokePick = new Set(names);
  const sel = smokeMode === "all" ? names : smokeMode === "failed" ? ["룸 생성"] : [...smokePick];
  const chosen = smokeMode === "failed" ? scripts.filter(c => c.id.startsWith("room.cancel")) : sel.flatMap(n => groups[n] || []);
  const steps = chosen.reduce((a,c)=>a+c.steps,0);
  if (smokeRun) return smokeResult(chosen);
  return `
  <h1>스모크 테스트</h1>
  <p class="sub">저장된 스크립트로 핵심 흐름 전체가 돌아가는지 한 번에 확인해요.</p>
  <div class="seg">${[["all","전체"],["pick","기능별"],["failed","지난번 실패만"]].map(([k,n]) => `<button class="${smokeMode===k?"on":""}" onclick="smokeMode='${k}';render()">${n}</button>`).join("")}</div>
  <div class="list">${smokeMode === "failed" ? chosen.map(c => `
      <div class="pick on"><div class="ck"></div><div class="tx"><div class="t">${esc(c.title)}</div><div class="d mono">${c.id}</div></div><span class="demo">시안 예시</span></div>`).join("") :
    names.map(n => `
      <div class="pick ${sel.includes(n)?"on":""}" ${smokeMode==="pick"?`onclick="togglePick('${n}')"`:""}><div class="ck"></div>
        <div class="tx"><div class="t">${esc(n)}</div><div class="d">${groups[n].slice(0,3).map(c=>esc(c.title)).join(" · ")}${groups[n].length>3?" …":""}</div></div>
        <div class="n">${groups[n].length}개</div></div>`).join("")}</div>
  <p style="color:var(--text3);font-size:13px;margin:14px 4px">케이스 ${totalCases}개 중 스크립트가 있는 것만 돌아요. 나머지는 Sanity 가 PR 마다 채워 가요.</p>
  <div class="bar-bottom"><div class="bar-in">
    <div class="sum"><b>스크립트 ${chosen.length}개</b>단계 ${steps}개 · 약 ${Math.max(10, Math.round(steps*1.4))}초</div>
    <button class="btn primary big" ${chosen.length?"":"disabled"} onclick="confirmSmoke(${chosen.length})">스모크 실행</button></div></div>`;
};
window.togglePick = n => { smokePick.has(n) ? smokePick.delete(n) : smokePick.add(n); render(); };
window.confirmSmoke = n => openSheet(`<h3>스크립트 ${n}개를 dev 에 실행할까요?</h3><p class="sd">실행 종류는 스프린트 스모크(Cycle 10)로 남아요.</p>
  <div class="kv"><div><span>담당자</span><b>bebe</b></div><div><span>대상</span><b class="mono">api.dev.moimyeon.plady.io</b></div><div><span>Slack 알림</span><b>끝나면 보내요</b></div></div>
  <button class="btn primary big full" onclick="closeSheet();runSmoke()">실행하기</button>`);
window.runSmoke = () => { smokeRun = {p:0}; render(); const t = setInterval(() => { smokeRun.p += 7; if (smokeRun.p >= 100) { smokeRun.p = 100; smokeRun.done = true; clearInterval(t); } render(); }, 120); };
function smokeResult(chosen){
  const fail = chosen.filter(c => c.id.startsWith("room.cancel"));
  if (!smokeRun.done) { const cur = chosen[Math.min(chosen.length-1, Math.floor(smokeRun.p/100*chosen.length))];
    return `<h1>스모크 테스트를 돌리고 있어요</h1><p class="sub">창을 닫아도 계속 돌아요. 끝나면 Slack 으로 알려 드려요.</p>
      <div class="card"><div style="font-weight:700">${esc(cur.title)}</div><div class="mono" style="color:var(--text3)">${cur.id}</div>
      <div class="running"><i style="width:${smokeRun.p}%"></i></div><div style="color:var(--text3);font-size:13px">${Math.floor(smokeRun.p/100*chosen.length)} / ${chosen.length}</div></div>`; }
  const pass = chosen.length - fail.length, pct = Math.round(pass/chosen.length*100);
  return `<a class="back" href="#/smoke" onclick="smokeRun=null">‹ 스모크 테스트</a>
    <div class="card res-head"><div class="ring" style="background:conic-gradient(var(--green) ${pct}%, var(--red) 0)"><span>${pct}%</span></div>
      <div><h1 style="margin:0">${chosen.length}개 중 ${pass}개 통과했어요</h1><p class="sub" style="margin:4px 0 0">실패 ${fail.length}개는 모두 룸 취소 API 가 없어진 탓이에요. <span class="demo">시안 예시</span></p></div></div>
    <div class="section"><h2>실패</h2><div class="list">${fail.map(c => `
      <div class="row link"><div class="ic red">✕</div><div class="tx"><div class="t">${esc(c.title)}</div><div class="d">1단계 · POST /v1/rooms/{roomId}/cancellation → 404 · Hermes 분석: 스크립트 낡음 (PR #138 이 API 를 지웠다)</div></div><span class="badge b-fail">실패</span></div>`).join("") || '<div class="empty"><b>실패 없음</b></div>'}</div></div>
    <div class="section"><h2>통과</h2><div class="list">${chosen.filter(c=>!fail.includes(c)).map(c => `
      <div class="row"><div class="ic green">✓</div><div class="tx"><div class="t">${esc(c.title)}</div><div class="d">${esc(GROUP_OF(c))} · <span class="mono">${c.id}</span></div></div><span class="badge b-pass">통과</span></div>`).join("")}</div></div>`;
}

  <p class="sub">테스트용 데이터를 dev 에 만들고 지워요. 만든 데이터는 이름이 [QA] 로 시작해요.</p>
  <div class="card left-sum"><div style="flex:1"><div style="font-weight:700;margin-bottom:12px">지금 dev 에 남은 QA 데이터 <span class="demo">시안 예시</span></div>
    <div class="nums"><div><b>3</b>룸</div><div><b>2</b>회원</div><div><b>4</b>이력서</div></div></div>
    <button class="btn danger big" onclick="confirmClean()">전부 지우기</button></div>
  ${DGROUP.map(([g, ids]) => `<div class="section"><h2>${g} 만들기</h2><div class="grid2">${ids.map(card).join("")}</div></div>`).join("")}`;
};
window.openData = id => {
  const c = EXTRA[id] || setups.find(x => x.id === id);
  const ins = (c.inputs || []).map(i => `<div class="fld"><label>${esc(i.label || INPUT_LABEL[i.name] || i.name)}</label>
    <input value="${esc(i.default ?? "")}" placeholder="${i.required?"꼭 넣어 주세요":"비워 두면 기본값"}">${i.hint?`<div class="h">${esc(i.hint)}</div>`:""}</div>`).join("");
  openSheet(`<h3>${esc(c.title)}</h3><p class="sd">${esc(c.desc || "")}</p>${ins || '<p style="color:var(--text3)">넣을 값이 없어요. 바로 만들 수 있어요.</p>'}
    <details class="raw"><summary>요청 원문 보기</summary><pre>POST /v1/dev/…  (단계 ${c.steps || 1}개, 담당자 bebe)</pre></details>
    <button class="btn primary big full" onclick="made('${id}')">만들기</button>`);
};
window.made = id => { const c = EXTRA[id] || setups.find(x => x.id === id);
  openSheet(`<div style="text-align:center;padding:8px 0 4px"><div style="font-size:44px">✅</div><h3>만들었어요</h3><p class="sd">${esc(c.title)}</p></div>
    <div class="kv">${(c.outputs && c.outputs.length ? c.outputs : ["roomId"]).slice(0,4).map(o => `<div><span>${esc(o)}</span><b class="mono">0199…${Math.random().toString(16).slice(2,8)}</b></div>`).join("")}</div>
    <div class="grid2"><button class="btn grey big" onclick="closeSheet();toast('복사했어요')">값 복사</button><button class="btn danger big" onclick="closeSheet();toast('지웠어요')">바로 지우기</button></div>`); };
window.confirmClean = () => openSheet(`<h3>QA 데이터를 전부 지울까요?</h3><p class="sd">이름이 [QA] 로 시작하는 데이터만 지워요. 지우면 되돌릴 수 없어요.</p>
  <div class="kv"><div><span>룸</span><b>[QA] 룸 방명록 sanity 외 2개</b></div><div><span>회원</span><b>[QA] 회원 2명</b></div><div><span>이력서</span><b>4개</b></div></div>
  <button class="btn danger big full" onclick="closeSheet();toast('지웠어요. 감사 로그에 남겼어요')">지우기</button>`);

// ---- 라우터 --------------------------------------------------------------------------------
function render(){
  const h = location.hash || "#/";
  const key = h.startsWith("#/sanity/138") ? "sanity138" : h.startsWith("#/sanity") ? "sanity" : h.startsWith("#/smoke") ? "smoke" : h.startsWith("#/data") ? "data" : "home";
  const nav = key === "sanity138" ? "sanity" : key;
  document.querySelectorAll("[data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === nav));
  $("#app").innerHTML = R[key]();
}
addEventListener("hashchange", () => { closeSheet(); if (!location.hash.startsWith("#/smoke")) smokeRun = null; scrollTo(0,0); render(); });
document.addEventListener("click", e => { if (!e.target.closest("#more")) $("#more").classList.remove("open"); });
render();
</script>
