<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plady QA 2판 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--text:#191F28;--text2:#4E5968;--text3:#8B95A1;--line:#E8EBED;--hover:#F7F8FA;
  --blue:#3182F6;--blue-d:#1B64DA;--blue-w:#EBF3FE;
  --red:#F04452;--red-w:#FEEEEF;--green:#1FA463;--green-w:#E6F6EE;--orange:#E8870E;--orange-w:#FFF4E5;--grey-w:#F2F4F6;
  --side:232px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;min-width:1180px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:0;color:var(--text3)}

/* 왼쪽 메뉴 */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.logo{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;padding:4px 10px 18px}
.logo i{width:24px;height:24px;border-radius:7px;background:var(--blue);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:6px;top:6px;width:11px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg)}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--text2);font-weight:600}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--blue-w);color:var(--blue)}
.nav a .ic{width:18px;text-align:center;font-size:14px}
.nav a .cnt{margin-left:auto;font-size:12px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--grey-w);color:var(--text3)}
.nav a .cnt.warn{background:var(--orange-w);color:var(--orange)}
.nav .lbl{font-size:12px;color:var(--text3);font-weight:600;padding:18px 10px 6px}
.nav.sub a{font-weight:500;height:32px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:8px;flex:1;padding:4px 6px;border-radius:8px;font-weight:600}
.me b{width:26px;height:26px;border-radius:50%;background:#FFD86B;display:grid;place-items:center;font-size:11px}
.me small{display:block;color:var(--text3);font-weight:500;font-size:11px}
.btn-hermes{height:30px;padding:0 11px;border-radius:8px;background:var(--text);color:#fff;font-weight:700;font-size:12px}

/* 본문 */
.main{margin-left:var(--side);min-height:100%}
.head{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.94);backdrop-filter:blur(8px);padding:18px 32px 14px;display:flex;align-items:flex-end;gap:16px}
.head .tt{flex:1;min-width:0}
.crumb{color:var(--text3);font-size:13px;font-weight:600;margin-bottom:2px}
.crumb a:hover{color:var(--text2)}
h1{font-size:22px;line-height:1.35;margin:0;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{color:var(--text2);margin:2px 0 0}
.body{padding:4px 32px 40px}
h2{font-size:15px;margin:0;font-weight:700}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{flex:1}
.card-h a{color:var(--text3);font-size:13px;font-weight:600}
.card-b{padding:16px 18px}
.demo{display:inline-block;font-size:11px;font-weight:700;color:var(--text3);background:var(--grey-w);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;letter-spacing:0}
.g{display:grid;gap:16px}

/* 버튼·상태 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.soft{background:var(--blue-w);color:var(--blue)}
.btn.grey{background:var(--grey-w);color:var(--text2)}.btn.grey:hover{background:#E8EBED}
.btn.danger{background:var(--red-w);color:var(--red)}
.btn.lg{height:40px;padding:0 18px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-pass{background:var(--green-w);color:var(--green)}.b-fail{background:var(--red-w);color:var(--red)}
.b-need{background:var(--orange-w);color:var(--orange)}.b-run{background:var(--blue-w);color:var(--blue)}.b-none{background:var(--grey-w);color:var(--text3)}
.kbd{font-size:11px;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 4px;margin-left:4px}

/* 표 */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--text3);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}tr.link:hover td{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t1{font-weight:600}.t2{color:var(--text3);font-size:12px}

/* 홈 */
.home{grid-template-columns:1fr 340px;align-items:start}
.todo{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border-bottom:0}
.todo:hover{background:var(--hover)}
.dot{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.dot.orange{background:var(--orange-w);color:var(--orange)}.dot.blue{background:var(--blue-w);color:var(--blue)}.dot.grey{background:var(--grey-w);color:var(--text3)}.dot.red{background:var(--red-w);color:var(--red)}
.todo .tx{flex:1;min-width:0}
.todo .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .d{color:var(--text3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobs{grid-template-columns:repeat(3,1fr)}
.job{padding:16px 18px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.job:hover{border-color:#C9D6E8}
.job .n{font-weight:800;font-size:15px}
.job .d{color:var(--text2);font-size:13px;flex:1}
.job .go{color:var(--blue);font-weight:700;font-size:13px;margin-top:6px}
.prog{height:6px;border-radius:99px;background:var(--grey-w);overflow:hidden;display:flex;min-width:140px}
.prog i{display:block;height:100%}
.legend{display:flex;gap:12px;color:var(--text3);font-size:12px}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.stat{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}.stat span{color:var(--text2)}.stat b{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:28px 16px;color:var(--text3)}
.empty b{display:block;color:var(--text2);margin-bottom:2px}

/* Sanity: 목록 + 상세 */
.split{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.split .list{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.pr{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.pr:hover{background:var(--hover)}
.pr.sel{background:var(--blue-w);box-shadow:inset 3px 0 0 var(--blue)}
.pr.faded .t{color:var(--text3)}
.pr .tx{flex:1;min-width:0}
.pr .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .d{color:var(--text3);font-size:12px}
.pr-sec{font-size:12px;font-weight:700;color:var(--text3);padding:9px 16px 6px;background:#FAFBFC;border-bottom:1px solid var(--line)}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);padding:14px 18px;gap:6px}
.stp{display:flex;align-items:center;gap:8px}
.stp .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:var(--grey-w);color:var(--text3)}
.stp.done .c{background:var(--blue);color:#fff}.stp.need .c{background:var(--orange);color:#fff}
.stp .n{font-weight:700;font-size:13px;line-height:1.3}
.stp .d{color:var(--text3);font-size:12px}
.stp.need .d{color:var(--orange);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;padding:12px 18px;background:var(--orange-w);border-top:1px solid #FBE3C2;border-radius:0 0 14px 14px}
.banner .tx{flex:1}.banner b{display:block}.banner span{color:var(--text2);font-size:13px}
.find{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.find .hd{grid-column:1/-1;display:flex;align-items:baseline;gap:10px}
.find .hd .k{font-size:12px;font-weight:700;color:var(--orange);white-space:nowrap}
.find .hd .t{font-weight:700;font-size:14px;flex:1}
.box{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text2)}
.box b{display:block;font-size:11px;color:var(--text3);margin-bottom:3px}
.box.q{background:var(--blue-w)}.box.q b{color:var(--blue)}
.box.q .rec{margin-top:6px;color:var(--text3);font-size:12px}
.box.q .acts{display:flex;gap:6px;margin-top:10px}
.done-mark{color:var(--green);font-weight:700;font-size:13px;margin-top:10px}
.reqs{margin:0;padding:0;list-style:none}
.reqs li{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:13px;color:var(--text2);padding:2px 0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr)}
.metrics div{padding:14px 18px;border-right:1px solid var(--line)}.metrics div:last-child{border-right:0}
.metrics span{color:var(--text3);font-size:12px}.metrics b{display:block;font-size:22px;font-weight:800}

/* 스모크 */
.smoke{grid-template-columns:1fr 320px;align-items:start}
.panel{position:sticky;top:84px}
.ck{width:18px;height:18px;border-radius:5px;border:2px solid #C9CED4;display:inline-grid;place-items:center;vertical-align:middle}
.ck.on{background:var(--blue);border-color:var(--blue)}
.ck.on:after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.seg{display:inline-flex;background:var(--grey-w);border-radius:9px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-weight:600;color:var(--text2);font-size:13px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.running{height:8px;border-radius:99px;background:var(--grey-w);overflow:hidden;margin:4px 0 6px}
.running i{display:block;height:100%;background:var(--blue);transition:width .2s}
.big{font-size:28px;font-weight:800;line-height:1.2}

/* QA 데이터 */
.data{grid-template-columns:1fr 1fr;align-items:start}
.dcard{display:flex;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.dcard:last-child{border-bottom:0}
.dcard:hover{background:var(--hover)}
.dcard.sel{background:var(--blue-w)}
.dcard .t{font-weight:600}.dcard .d{color:var(--text3);font-size:12px}
.warn{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:var(--orange);background:var(--orange-w);border-radius:5px;padding:1px 6px}

/* 오른쪽 패널 · 확인 창 */
.shade{position:fixed;inset:0;background:rgba(25,31,40,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:41;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.08)}
.drawer.on{transform:none}
.drawer .dh{padding:20px 24px 12px;display:flex;gap:10px;align-items:flex-start}
.drawer .dh h3{margin:0;font-size:18px}
.drawer .dh p{margin:4px 0 0;color:var(--text2);font-size:13px}
.drawer .db{flex:1;overflow:auto;padding:4px 24px}
.drawer .df{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{width:30px;height:30px;border-radius:8px;color:var(--text3);font-size:18px}.x:hover{background:var(--hover)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;width:440px;background:#fff;border-radius:16px;z-index:42;padding:22px 24px 18px;transition:all .15s;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 4px;font-size:18px}.modal .sd{color:var(--text2);margin:0 0 14px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.fld input{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 12px;font:inherit;color:var(--text);outline:none}
.fld input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-w)}
.fld .h{font-size:12px;color:var(--text3);margin-top:4px}
.kv{border:1px solid var(--line);border-radius:10px;padding:2px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}
.kv div+div{border-top:1px solid var(--line)}
.kv span{color:var(--text3);white-space:nowrap}
details.raw summary{color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;margin:10px 0 6px}
details.raw pre{background:#191F28;color:#E5E8EB;border-radius:8px;padding:12px;font-size:12px;overflow:auto}
.toast{position:fixed;left:calc(50% + var(--side)/2);bottom:24px;transform:translate(-50%,20px);background:rgba(25,31,40,.94);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;
  z-index:50;opacity:0;transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<aside class="side">
  <a class="logo" href="#/"><i></i>Plady QA</a>
  <nav class="nav" id="nav"></nav>
  <div class="nav sub"><div class="lbl">관리</div>
    <a><span class="ic">▤</span>시나리오</a><a><span class="ic">{}</span>스크립트</a><a><span class="ic">≡</span>테스트 조건</a>
    <a><span class="ic">↗</span>API 호출</a><a><span class="ic">◷</span>실행 기록</a><a><span class="ic">☰</span>감사 로그</a><a><span class="ic">?</span>가이드</a>
  </div>
  <div class="side-foot"><div class="me"><b>be</b><div>bebe<small>담당자 · 바꾸기</small></div></div><button class="btn-hermes">Hermes</button></div>
</aside>
<div class="main" id="app"></div>
<div class="shade" id="shade" onclick="closeAll()"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

let sanitySel = 138;
R.sanity = () => {
  const st = p => p.number === 138 ? `<span class="badge b-need">확인 필요</span>` : p.api ? `<span class="badge b-none">검증 안 함</span>` : "";
  const item = p => `<div class="pr ${p.api?"":"faded"} ${p.number===sanitySel?"sel":""}" onclick="location.hash='#/sanity/${p.number}'">
      <div class="tx"><div class="t">#${p.number} ${esc(p.title)}</div>
      <div class="d">${esc(p.author)} · ${ago(p.mergedAt)} · 파일 ${fmt(p.changedFiles)}개 <span style="color:var(--green)">+${fmt(p.additions)}</span> <span style="color:var(--red)">−${fmt(p.deletions)}</span></div></div>
      ${st(p)}</div>`;
  const p = D.prs.find(x => x.number === sanitySel);
  const right = p.number === 138 ? detail138() : p.api ? notStarted(p) : noApi(p);
  return head("Sanity 테스트", "머지된 PR 하나를 골라 스펙대로 동작하는지 확인해요. 시작은 사람이 눌러요.",
    `<div class="seg"><button class="on">전체 ${D.prs.length}</button><button>검증 안 함 ${API_PRS.length-1}</button><button>확인 필요 1</button><button>끝남 0</button></div>`) + `
  <div class="body split">
    <div class="card list"><div class="pr-sec">API 가 바뀐 PR</div>${API_PRS.map(item).join("")}<div class="pr-sec">API 변경이 없는 PR</div>${D.prs.filter(p=>!p.api).map(item).join("")}</div>
    <div>${right}</div>
  </div>`;
};
function prHead(p, badge, actions){
  return `<div class="card-h" style="align-items:flex-start"><div style="flex:1;min-width:0">
    <div class="t2">PR #${p.number} · ${esc(p.author)} · ${ago(p.mergedAt)} 머지 · 파일 ${fmt(p.changedFiles)}개</div>
    <div style="font-size:17px;font-weight:800;margin-top:2px">${esc(p.title)}</div>
    <div style="margin-top:6px;display:flex;gap:8px;align-items:center">${badge}</div></div>${actions}</div>`;
}
function notStarted(p){
  return `<div class="card">${prHead(p, `<span class="badge b-none">검증 안 함</span>`, `<button class="btn primary lg" onclick="startSanity(${p.number})">Sanity 시작</button>`)}
    <div class="empty" style="padding:48px"><b>아직 이 PR 을 검증하지 않았어요</b>시작하면 관련 스펙 찾기 → 스펙 점검 → 케이스 준비 → 스크립트 만들기 → 실행 순서로 진행해요.<br>스펙이 모호하거나 코드와 다르면 그 자리에서 멈추고 알려 드려요.</div></div>`;
}
function noApi(p){
  return `<div class="card">${prHead(p, `<span class="t2">API 변경 없음</span>`, `<button class="btn grey lg" onclick="startSanity(${p.number})">그래도 시작</button>`)}
    <div class="empty" style="padding:48px"><b>API 를 바꾼 파일이 없어요</b>인프라·로그·문서만 바뀐 PR 이에요. 보통은 Sanity 가 필요 없어요.</div></div>`;
}
function detail138(){
  const p = D.prs.find(x => x.number === 138);
  const cs = S138.cases, auto = cs.filter(v => v.state==="auto").length;
  const make = cs.filter(v => v.state==="untested" && v.mode!=="manual").length;
  const man = cs.length - auto - make;
  const left = S138.findings.length - resolved.size;
  const steps = [["관련 스펙 찾기", `기능 ${S138.scope.length} · 요구 ${S138.scope.reduce((a,x)=>a+x.reqs.length,0)}`, "done"],
    ["스펙 점검", left ? `확인 필요 ${left}건` : "모두 정했어요", left ? "need" : "done"],
    ["케이스 준비", `케이스 ${cs.length}개`, ""], ["스크립트 만들기", `새로 ${make}개 예정`, ""], ["실행·검사", "dev", ""]];
  return `<div class="g">
  <div class="card">${prHead(p, `<span class="badge ${left?"b-need":"b-run"}">${left?"확인 필요":"이어서 할 수 있어요"}</span><span class="t2">bebe 가 오늘 11:20 에 시작 · MOI-541</span><span class="demo">시안 예시</span>`,
      `<div style="display:flex;gap:8px"><button class="btn grey lg">위키 고친 뒤 다시 점검</button><button class="btn primary lg" onclick="toast('시안이에요. 실제로는 3단계부터 이어서 해요')">이대로 계속</button></div>`)}
    <div class="stepper">${steps.map(([n,d,c],i) => `<div class="stp ${c}"><div class="c">${c==="done"?"✓":c==="need"?"!":i+1}</div><div><div class="n">${n}</div><div class="d">${d}</div></div></div>`).join("")}</div>
    <div class="banner"><div class="tx"><b>${left ? `스펙을 정해야 할 곳이 ${left}군데 있어요` : "모두 정했어요. 이어서 진행할 수 있어요"}</b>
      <span>정하면 케이스를 준비하고 스크립트를 만들어 dev 에서 확인해요. [이대로 계속]하면 정하지 않은 항목의 케이스는 사람이 확인으로 둬요.</span></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>스펙 확인이 필요해요</h2><span class="t2">${S138.findings.length}건 중 ${resolved.size}건 정함</span></div>
    ${S138.findings.map((f,i) => `<div class="find"><div class="hd"><span class="k">${f.kind}</span><span class="t">${esc(f.title)}</span></div>
      <div class="box"><b>스펙</b>${esc(f.spec)}</div><div class="box"><b>코드</b>${esc(f.code)}</div>
      <div class="box q"><b>질문</b>${esc(f.q)}<div class="rec">${esc(f.rec)}</div>
        ${resolved.has(i) ? `<div class="done-mark">✓ 추천대로 정했어요 · bebe</div>` :
        `<div class="acts"><button class="btn primary" onclick="resolveF(${i})">추천대로</button><button class="btn grey">다르게</button><button class="btn grey">Slack 으로 묻기</button></div>`}</div></div>`).join("")}</div>
  <div class="g" style="grid-template-columns:1.25fr 1fr;align-items:start">
    <div class="card"><div class="card-h"><h2>관련 스펙</h2><span class="t2">요구 ${S138.scope.reduce((a,x)=>a+x.reqs.length,0)}개</span></div>
      <table>${S138.scope.map(x => `<tr><td style="width:34%;vertical-align:top"><div class="t1">${esc(x.f)}</div><div class="t2">${x.s} · 이번 범위 케이스 ${cs.filter(v=>v.f===x.f).length}개</div></td>
        <td><ul class="reqs">${x.reqs.map(([r,t]) => `<li><span class="mono">${r}</span><span>${esc(t)}</span></li>`).join("")}</ul></td></tr>`).join("")}</table></div>
    <div class="g">
      <div class="card"><div class="card-h"><h2>이대로 계속하면</h2></div><div class="metrics">
        <div><span>스크립트 있음</span><b>${auto}</b></div><div><span>Hermes 가 만들 스크립트</span><b style="color:var(--blue)">${make}</b></div><div><span>사람이 확인</span><b style="color:var(--orange)">${man}</b></div></div></div>
      <div class="card"><div class="card-h"><h2>영향 받는 스크립트와 데이터</h2></div>
        <table>${S138.impact.map(x => `<tr><td><div class="t1">${esc(x.t)}</div><div class="t2"><span class="mono">${x.id}</span> · ${esc(x.d)}</div></td></tr>`).join("")}</table></div>
    </div>
  </div>
  <div class="card"><div class="card-h"><h2>이번 범위의 케이스</h2><span class="t2">${cs.length}개</span></div>
    <table><tr><th>기능 · 시나리오</th><th>종류</th><th>케이스</th><th>상태</th></tr>
    ${cs.map(v => `<tr><td class="t2" style="white-space:nowrap">${esc(v.f)} ${v.s}</td><td style="white-space:nowrap">${KIND[v.kind]}</td><td>${esc(v.title)} <span class="mono">${v.key}</span></td><td><span class="badge ${STATE[v.state][0]}">${STATE[v.state][1]}</span></td></tr>`).join("")}</table></div>
  </div>`;
}
window.startSanity = n => {
  const p = D.prs.find(x => x.number === n);
  openModal(`<h3>PR #${n} Sanity 를 시작할까요?</h3><p class="sd">${esc(p.title)}</p>
    <div class="kv"><div><span>담당자</span><b>bebe</b></div><div><span>대상</span><b class="mono" style="color:var(--text)">api.dev.moimyeon.plady.io</b></div>
    <div><span>하는 일</span><b>스펙 찾기 → 점검 → 준비 → 스크립트 → 실행</b></div></div>
    <p class="t2" style="margin:10px 0 0">스펙이 모호하거나 코드와 다르면 그 자리에서 멈춰요. 시작한 사람과 시각은 감사 로그에 남아요.</p>
    <div class="mf"><button class="btn grey lg" onclick="closeAll()">닫기</button><button class="btn primary lg" onclick="closeAll();toast('시안이에요. 실제로는 여기서 Hermes 가 시작해요')">시작하기</button></div>`);
};
window.resolveF = i => { resolved.add(i); render(); toast("정했어요. 감사 로그에 남겼어요"); };

let smokeMode = "all", smokePick = null, smokeRun = null;
R.smoke = () => {
  const groups = {}; scripts.forEach(c => (groups[GROUP_OF(c)] ||= []).push(c));
  const names = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
  if (!smokePick) smokePick = new Set(names);
  const sel = smokeMode === "all" ? names : [...smokePick];
  const chosen = smokeMode === "failed" ? scripts.filter(c => c.id.startsWith("room.cancel")) : sel.flatMap(n => groups[n] || []);
  const steps = chosen.reduce((a,c)=>a+c.steps,0);
  if (smokeRun) return smokeResult(chosen);
  const rows = smokeMode === "failed" ? chosen.map(c => `<tr><td style="width:34px"><span class="ck on"></span></td><td class="t1">${esc(c.title)}</td><td class="mono">${c.id}</td><td class="num">${c.steps}</td><td><span class="badge b-fail">실패</span><span class="demo">시안 예시</span></td></tr>`).join("")
    : names.map(n => `<tr class="link" ${smokeMode==="pick"?`onclick="togglePick('${n}')"`:""}><td style="width:34px"><span class="ck ${sel.includes(n)?"on":""}"></span></td>
        <td><div class="t1">${esc(n)}</div><div class="t2">${groups[n].slice(0,3).map(c=>esc(c.title)).join(" · ")}${groups[n].length>3?" …":""}</div></td>
        <td class="num">${groups[n].length}</td><td class="num">${groups[n].reduce((a,c)=>a+c.steps,0)}</td><td><span class="t2">–</span></td></tr>`).join("");
  return head("스모크 테스트", "저장된 스크립트로 핵심 흐름 전체가 돌아가는지 한 번에 확인해요.") + `
  <div class="body g smoke">
    <div class="card"><div class="card-h"><div class="seg">${[["all","전체"],["pick","기능별로 고르기"],["failed","지난번 실패만"]].map(([k,n]) => `<button class="${smokeMode===k?"on":""}" onclick="smokeMode='${k}';render()">${n}</button>`).join("")}</div><span style="flex:1"></span><span class="t2">케이스 ${totalCases}개 중 스크립트가 있는 것만 돌아요</span></div>
      <table>${smokeMode==="failed" ? `<tr><th></th><th>스크립트</th><th>id</th><th class="num">단계</th><th>지난 결과</th></tr>` : `<tr><th></th><th>기능</th><th class="num">스크립트</th><th class="num">단계</th><th>지난 결과</th></tr>`}${rows}</table></div>
    <div class="card panel"><div class="card-h"><h2>실행</h2></div><div class="card-b">
      <div class="big">${chosen.length}개</div><div class="t2" style="margin-bottom:14px">스크립트 · 단계 ${steps}개 · 약 ${Math.max(10, Math.round(steps*1.4))}초</div>
      <div class="kv" style="margin-bottom:14px"><div><span>실행 종류</span><b>스프린트 스모크 (Cycle 10)</b></div><div><span>대상</span><b>dev</b></div><div><span>끝나면</span><b>Slack 알림</b></div></div>
      <button class="btn primary lg" style="width:100%" ${chosen.length?"":"disabled"} onclick="confirmSmoke(${chosen.length})">스모크 실행</button>
      <div class="t2" style="margin-top:14px">지난 스모크: 없음</div></div></div>
  </div>`;
};
window.togglePick = n => { smokePick.has(n) ? smokePick.delete(n) : smokePick.add(n); render(); };
window.confirmSmoke = n => openModal(`<h3>스크립트 ${n}개를 dev 에 실행할까요?</h3><p class="sd">실행 종류는 스프린트 스모크(Cycle 10)로 남아요.</p>
  <div class="kv"><div><span>담당자</span><b>bebe</b></div><div><span>대상</span><b class="mono" style="color:var(--text)">api.dev.moimyeon.plady.io</b></div></div>
  <div class="mf"><button class="btn grey lg" onclick="closeAll()">닫기</button><button class="btn primary lg" onclick="closeAll();runSmoke()">실행하기</button></div>`);
window.runSmoke = () => { smokeRun = {p:0}; render(); const t = setInterval(() => { smokeRun.p += 6; if (smokeRun.p >= 100) { smokeRun.p = 100; smokeRun.done = true; clearInterval(t); } render(); }, 110); };
function smokeResult(chosen){
  const fail = chosen.filter(c => c.id.startsWith("room.cancel"));
  const done = smokeRun.done ? chosen.length : Math.floor(smokeRun.p/100*chosen.length);
  const failDone = fail.filter(c => chosen.indexOf(c) < done).length;
  const rows = chosen.map((c,i) => { const s = i < done ? (fail.includes(c) ? "fail" : "pass") : i === done ? "run" : "wait";
    return [s, `<tr class="${s==="fail"?"link":""}"><td><div class="t1">${esc(c.title)}</div><div class="t2">${esc(GROUP_OF(c))} · <span class="mono">${c.id}</span></div></td>
      <td class="t2">${s==="fail" ? "1단계 · POST /v1/rooms/{roomId}/cancellation → 404<br>Hermes 분석: 스크립트 낡음 (PR #138 이 API 를 지웠다)" : ""}</td>
      <td class="num t2">${s==="pass"||s==="fail" ? (0.4 + c.steps*0.3).toFixed(1)+"초" : ""}</td>
      <td>${{pass:'<span class="badge b-pass">통과</span>',fail:'<span class="badge b-fail">실패</span>',run:'<span class="badge b-run">도는 중</span>',wait:'<span class="t2">대기</span>'}[s]}</td></tr>`]; });
  rows.sort((a,b) => (b[0]==="fail") - (a[0]==="fail"));
  const pass = chosen.length - fail.length;
  return head(smokeRun.done ? `${chosen.length}개 중 ${pass}개 통과했어요` : "스모크 테스트를 돌리고 있어요",
    smokeRun.done ? `실패 ${fail.length}개는 모두 룸 취소 API 가 없어진 탓이에요 (PR #138). <span class="demo">시안 예시</span>` : "창을 닫아도 계속 돌아요. 끝나면 Slack 으로 알려 드려요.",
    smokeRun.done ? `<div style="display:flex;gap:8px"><button class="btn grey lg">위키에 보고서 게시</button><button class="btn primary lg" onclick="smokeRun=null;render()">다시 고르기</button></div>` : "",
    `<a href="#/smoke" onclick="smokeRun=null">스모크 테스트</a> › 실행`) + `
  <div class="body g"><div class="card"><div class="card-b" style="display:flex;gap:32px;align-items:center">
      <div style="flex:1"><div class="running"><i style="width:${smokeRun.p}%"></i></div><div class="t2">${done} / ${chosen.length}</div></div>
      <div><span class="t2">통과</span><div class="big" style="color:var(--green)">${done - failDone}</div></div>
      <div><span class="t2">실패</span><div class="big" style="color:var(--red)">${failDone}</div></div></div></div>
    <div class="card"><table><tr><th>스크립트</th><th>실패 이유</th><th class="num">시간</th><th>결과</th></tr>${rows.map(r=>r[1]).join("")}</table></div></div>`;
}

const DGROUP = [
  ["룸", ["setup.room-open","setup.room-with-application","setup.room-confirmed","setup.room-reschedule","setup.room-ready-to-start"]],
  ["계정 · 이력서", ["qa-member","setup.resume-list","setup.resume-summary"]],
];
const EXTRA = {"qa-member": {id:"qa-member", title:"QA 회원 만들기", desc:"이름이 [QA] 로 시작하는 새 회원을 만들어 테스트 계정으로 써요. 이력서와 요약까지 함께 준비돼요.", inputs:[{name:"nickname", label:"닉네임", default:"[QA] 새 회원"}], outputs:["memberId"], steps:3}};
const ONE = s => { const t = String(s||"").split(/(?<=[.다요])\s/)[0]; return t.length > 80 ? t.slice(0,78)+"…" : t; };
const LEFT = [["룸","[QA] 룸 방명록 sanity","2일 전"],["룸","[QA] 참가 신청 sanity","2일 전"],["룸","[QA] 준비 작업 룸","3일 전"],["회원","[QA] 회원 1","3일 전"],["회원","[QA] 회원 2","3일 전"]];
let dataSel = null;
R.data = () => {
  const card = id => { const c = EXTRA[id] || setups.find(x => x.id === id); if (!c) return "";
    const old = id === "setup.room-ready-to-start";
    return `<div class="dcard ${dataSel===id?"sel":""}" onclick="openData('${id}')"><div class="dot ${old?"orange":"blue"}">${id.includes("resume")?"📄":id==="qa-member"?"👤":"🏠"}</div>
      <div style="flex:1;min-width:0"><div class="t">${esc(c.title)}</div><div class="d">${esc(ONE(c.desc))}</div>${old?'<span class="warn">MVP 에는 진행 중이 없어요 · PR #138</span>':""}</div><span class="t2">›</span></div>`; };
  return head("QA 데이터", "테스트용 데이터를 dev 에 만들고 지워요. 만든 데이터는 이름이 [QA] 로 시작해요.") + `
  <div class="body g data">
    <div class="g">${DGROUP.map(([g, ids]) => `<div class="card"><div class="card-h"><h2>${g} 만들기</h2></div>${ids.map(card).join("")}</div>`).join("")}</div>
    <div class="card"><div class="card-h"><h2>지금 dev 에 남은 QA 데이터 <span class="demo">시안 예시</span></h2><button class="btn danger" onclick="confirmClean()">전부 지우기</button></div>
      <table><tr><th>종류</th><th>이름</th><th>만든 때</th><th></th></tr>
      ${LEFT.map(([k,n,t]) => `<tr><td class="t2">${k}</td><td class="t1">${esc(n)}</td><td class="t2">${t}</td><td style="text-align:right"><button class="btn grey" onclick="toast('지웠어요')">지우기</button></td></tr>`).join("")}</table></div>
  </div>`;
};
window.openData = id => {
  dataSel = id; render();
  const c = EXTRA[id] || setups.find(x => x.id === id);
  const ins = (c.inputs || []).map(i => `<div class="fld"><label>${esc(i.label || i.name)}${i.required?' <span style="color:var(--red)">*</span>':""}</label>
    <input value="${esc(i.default ?? "")}" placeholder="${i.required?"꼭 넣어 주세요":"비워 두면 기본값"}">${i.hint?`<div class="h">${esc(i.hint)}</div>`:""}</div>`).join("");
  openDrawer(`<div class="dh"><div style="flex:1"><h3>${esc(c.title)}</h3><p>${esc(c.desc || "")}</p></div><button class="x" onclick="closeAll()">×</button></div>
    <div class="db">${ins || '<p class="t2">넣을 값이 없어요. 바로 만들 수 있어요.</p>'}
      <div class="kv" style="margin-top:4px"><div><span>담당자</span><b>bebe</b></div><div><span>단계</span><b>${c.steps || 1}개</b></div><div><span>결과값</span><b class="mono" style="color:var(--text)">${(c.outputs||[]).join(", ") || "–"}</b></div></div>
      <details class="raw"><summary>요청 원문 보기</summary><pre>POST /v1/rooms …  (${esc(c.id)})</pre></details></div>
    <div class="df" id="df"><button class="btn grey lg" onclick="closeAll()">닫기</button><button class="btn primary lg" onclick="made('${id}')">만들기 <span class="kbd">⌘↵</span></button></div>`);
};
window.made = id => { const c = EXTRA[id] || setups.find(x => x.id === id);
  $("#drawer .db").insertAdjacentHTML("afterbegin", `<div class="box" style="background:var(--green-w);margin-bottom:14px"><b style="color:var(--green)">만들었어요</b>
    ${(c.outputs && c.outputs.length ? c.outputs : ["roomId"]).map(o => `<div style="display:flex;justify-content:space-between"><span>${esc(o)}</span><span class="mono" style="color:var(--text)">0199…${Math.random().toString(16).slice(2,8)} <a style="color:var(--blue);font-weight:700;cursor:pointer" onclick="toast('복사했어요')">복사</a></span></div>`).join("")}</div>`);
  $("#df").innerHTML = `<button class="btn danger lg" onclick="closeAll();toast('지웠어요')">방금 만든 것 지우기</button><span style="flex:1"></span><button class="btn grey lg" onclick="closeAll()">닫기</button>`; };
window.confirmClean = () => openModal(`<h3>QA 데이터 ${LEFT.length}개를 전부 지울까요?</h3><p class="sd">이름이 [QA] 로 시작하는 데이터만 지워요. 지우면 되돌릴 수 없어요.</p>
  <div class="kv">${LEFT.map(([k,n]) => `<div><span>${k}</span><b>${esc(n)}</b></div>`).join("")}</div>
  <div class="mf"><button class="btn grey lg" onclick="closeAll()">닫기</button><button class="btn danger lg" onclick="closeAll();toast('지웠어요. 감사 로그에 남겼어요')">지우기</button></div>`);

// ---- 라우터 --------------------------------------------------------------------------------
function nav(key){
  const items = [["home","⌂","홈",""],["sanity","✓","Sanity",`<span class="cnt warn">${API_PRS.length}</span>`],["smoke","▶","스모크",`<span class="cnt">${scripts.length}</span>`],["data","▦","QA 데이터",""]];
  $("#nav").innerHTML = items.map(([k,i,n,c]) => `<a href="#/${k==="home"?"":k}" class="${key===k?"on":""}"><span class="ic">${i}</span>${n}${c}</a>`).join("");
}
function render(){
  const h = location.hash || "#/";
  const m = h.match(/^#\/sanity\/(\d+)/); if (m) sanitySel = +m[1];
  const key = h.startsWith("#/sanity") ? "sanity" : h.startsWith("#/smoke") ? "smoke" : h.startsWith("#/data") ? "data" : "home";
  nav(key);
  $("#app").innerHTML = R[key]();
}
addEventListener("hashchange", () => { closeAll(); if (!location.hash.startsWith("#/smoke")) smokeRun = null; scrollTo(0,0); render(); });
render();
</script>
</body>
</html>
