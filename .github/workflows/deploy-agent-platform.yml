name: Deploy agent-platform

# Branch push = deploy. Builds the platform images, pushes to ECR, then drives an
# unmanned EC2 deploy via SSM Run Command (no inbound SSH), and finally smoke-tests
# the four public endpoints. Mirrors plady's deploy-aws.yml (ECS) translated to the
# EC2 + docker compose model (ECS update-service -> SSM Run Command). See PLA-273.
#
# Trigger is `main` only because the OIDC role trust policy currently allows only
# refs/heads/main (infra/terraform/platform/iam.tf). Adding `dev` requires widening
# that trust (a PLA-247 follow-up).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-agent-platform.yml
      - scripts/ec2-deploy.sh
      - compose.ec2.yaml
      - docker/**
      - n8n/workflows/**
      - qa-platform/**
      - llm-wiki/**
      - llm-wiki-hugo-cms/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-agent-platform
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_LLM_WIKI_REPOSITORY: ${{ vars.ECR_LLM_WIKI_REPOSITORY || 'plady-agent-platform/llm-wiki' }}
  ECR_WIKI_UI_REPOSITORY: ${{ vars.ECR_WIKI_UI_REPOSITORY || 'plady-agent-platform/wiki-ui' }}
  ECR_QA_PLATFORM_REPOSITORY: ${{ vars.ECR_QA_PLATFORM_REPOSITORY || 'plady-agent-platform/qa-platform' }}
  PLATFORM_INSTANCE_ID: ${{ vars.PLATFORM_INSTANCE_ID }}
  PLATFORM_ENV: ${{ vars.PLATFORM_ENV || 'dev' }}
  WIKI_PUBLIC_HOST: ${{ vars.WIKI_PUBLIC_HOST || 'wiki.agent.plady.io' }}
  MCP_PUBLIC_HOST: ${{ vars.MCP_PUBLIC_HOST || 'mcp.agent.plady.io' }}
  HERMES_PUBLIC_HOST: ${{ vars.HERMES_PUBLIC_HOST || 'hermes.agent.plady.io' }}
  QA_PUBLIC_HOST: ${{ vars.QA_PUBLIC_HOST || 'qa.agent.plady.io' }}

jobs:
  deploy:
    # Skip cleanly until the platform OIDC role + instance id are wired as repo vars.
    if: ${{ vars.AWS_ROLE_TO_ASSUME != '' && vars.PLATFORM_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 빌드 캐시는 이미지마다 scope 를 나눈다. scope 없이 쓰면 세 빌드가 같은 gha 캐시 칸을 번갈아
      # 덮어써서, 마지막 qa-platform 이 llm-wiki 캐시를 지운다 — llm-wiki 가 매 배포 Rust 를 처음부터
      # 컴파일해 8~9분이 걸렸다 (2026-09-23 확인).

      - name: Build and push llm-wiki
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/llm-wiki.Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_LLM_WIKI_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_LLM_WIKI_REPOSITORY }}:latest
          cache-from: type=gha,scope=llm-wiki
          cache-to: type=gha,mode=max,scope=llm-wiki

      - name: Build and push wiki-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hugo.Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WIKI_UI_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WIKI_UI_REPOSITORY }}:latest
          cache-from: type=gha,scope=wiki-ui
          cache-to: type=gha,mode=max,scope=wiki-ui

      - name: Build and push qa-platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/qa-platform.Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_QA_PLATFORM_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_QA_PLATFORM_REPOSITORY }}:latest
          cache-from: type=gha,scope=qa-platform
          cache-to: type=gha,mode=max,scope=qa-platform

      - name: Deploy to EC2 via SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Build the remote bootstrap: write compose + deploy script + the
          # wiki-auth sidecar source (bind-mounted by compose.ec2.yaml), export the
          # image/env coordinates, then run the deploy. The box needs no repo checkout.
          # One gzip tarball for everything the box needs (compose, deploy script,
          # wiki-auth sidecar source, n8n workflow definitions — docs/webex-ingest.md).
          # SSM SendCommand caps the whole document at 97 KB; shipping files as
          # separate plain base64 blobs blew past it once n8n/workflows joined.
          PAYLOAD_B64="$(tar -czf - compose.ec2.yaml scripts/ec2-deploy.sh docker/wiki-auth/app.py n8n/workflows | base64 -w0)"
          echo "payload: $(( ${#PAYLOAD_B64} / 1024 )) KB base64"

          REMOTE=$(cat <<EOF
          set -euo pipefail
          P=\$(mktemp -d)
          echo "${PAYLOAD_B64}" | base64 -d | tar -xzf - -C "\$P"
          mkdir -p /opt/plady-agent-platform/docker/wiki-auth /opt/plady-agent-platform/n8n
          cp "\$P/compose.ec2.yaml" /opt/plady-agent-platform/compose.ec2.yaml
          # If a deploy ever ran while app.py was missing, docker created a
          # DIRECTORY at the bind-mount source path; clear it before writing the file.
          rm -rf /opt/plady-agent-platform/docker/wiki-auth/app.py
          cp "\$P/docker/wiki-auth/app.py" /opt/plady-agent-platform/docker/wiki-auth/app.py
          rm -rf /opt/plady-agent-platform/n8n/workflows
          cp -r "\$P/n8n/workflows" /opt/plady-agent-platform/n8n/workflows
          cp "\$P/scripts/ec2-deploy.sh" /tmp/ec2-deploy.sh
          rm -rf "\$P"
          export AWS_REGION="${AWS_REGION}"
          export ECR_REGISTRY="${ECR_REGISTRY}"
          export LLM_WIKI_REPO="${ECR_LLM_WIKI_REPOSITORY}"
          export WIKI_UI_REPO="${ECR_WIKI_UI_REPOSITORY}"
          export QA_PLATFORM_REPO="${ECR_QA_PLATFORM_REPOSITORY}"
          export IMAGE_TAG="${IMAGE_TAG}"
          export PLATFORM_ENV="${PLATFORM_ENV}"
          export WIKI_PUBLIC_HOST="${WIKI_PUBLIC_HOST}"
          export MCP_PUBLIC_HOST="${MCP_PUBLIC_HOST}"
          export HERMES_PUBLIC_HOST="${HERMES_PUBLIC_HOST}"
          export QA_PUBLIC_HOST="${QA_PUBLIC_HOST}"
          bash /tmp/ec2-deploy.sh
          EOF
          )

          PARAMS="$(mktemp)"
          jq -n --arg c "$REMOTE" '{commands: [$c], executionTimeout: ["1800"]}' > "$PARAMS"

          CMD_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$PLATFORM_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "PLA-273 deploy ${IMAGE_TAG}" \
            --parameters "file://${PARAMS}" \
            --query Command.CommandId --output text)"
          rm -f "$PARAMS"
          echo "SSM command: ${CMD_ID}"

          # Poll to a terminal state (ssm wait can time out on long installs).
          # Budget must cover executionTimeout (1800s) + margin, else a slow
          # first deploy is abandoned mid-run and reported failed: 190*10s=1900s.
          for i in $(seq 1 190); do
            STATUS="$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD_ID" --instance-id "$PLATFORM_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "::group::SSM stdout"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$PLATFORM_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::SSM stderr"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD_ID" --instance-id "$PLATFORM_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"

          echo "Final SSM status: ${STATUS}"
          [ "$STATUS" = "Success" ] || { echo "Deploy failed on the instance"; exit 1; }

      - name: Smoke test public endpoints
        run: |
          set -euo pipefail
          fail=0

          # 200 = 게이트 미구성(공개), 302→/auth/login = 게이트 활성(비밀번호 세션).
          # 둘 다 정상 상태다 — docs/wiki-token-issuer.md.
          echo "== wiki: https://${WIKI_PUBLIC_HOST}/ (expect 200, or 302 to /auth/login)"
          out="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "https://${WIKI_PUBLIC_HOST}/" || echo 000)"
          code="${out%% *}"; redirect="${out#* }"
          echo "  -> ${code} ${redirect}"
          case "${code}:${redirect}" in
            200:*) ;;
            302:*/auth/login*) ;;
            *) echo "  FAIL"; fail=1 ;;
          esac

          echo "== mcp: https://${MCP_PUBLIC_HOST}/mcp no-auth (expect 401)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Accept: text/event-stream' "https://${MCP_PUBLIC_HOST}/mcp" || echo 000)"
          echo "  -> ${code}"; [ "$code" = "401" ] || { echo "  FAIL"; fail=1; }

          echo "== hermes: https://${HERMES_PUBLIC_HOST}/health (expect status ok)"
          body="$(curl -sS --max-time 20 "https://${HERMES_PUBLIC_HOST}/health" || true)"
          echo "  -> ${body}"; printf '%s' "$body" | grep -qE '"status":[[:space:]]*"ok"' || { echo "  FAIL"; fail=1; }

          echo "== hermes: /v1/models no-auth (expect 401)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://${HERMES_PUBLIC_HOST}/v1/models" || echo 000)"
          echo "  -> ${code}"; [ "$code" = "401" ] || { echo "  FAIL"; fail=1; }

          # qa-platform (docs/qa-platform.md): /health 만 무인증. 루트는 팀 세션 게이트 → 302 /auth/login.
          # 프로필이 꺼져 있으면(Caddy 가 upstream 을 못 찾음) 502 가 오므로 경고만 하고 실패시키지 않는다.
          echo "== qa: https://${QA_PUBLIC_HOST}/health (expect status ok; 502 = profile off)"
          out="$(curl -sS -o /tmp/qa-health -w '%{http_code}' --max-time 20 "https://${QA_PUBLIC_HOST}/health" || echo 000)"
          echo "  -> ${out} $(head -c 200 /tmp/qa-health 2>/dev/null)"
          case "${out}" in
            200) grep -qE '"status":[[:space:]]*"ok"' /tmp/qa-health || { echo "  FAIL"; fail=1; } ;;
            502|503) echo "  WARN: qa-platform 이 꺼져 있다 (profile qa 미활성)" ;;
            *) echo "  FAIL"; fail=1 ;;
          esac

          [ "$fail" = 0 ] && echo "All public smoke checks passed." || { echo "Smoke checks failed."; exit 1; }
