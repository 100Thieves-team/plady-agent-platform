services:
  llm-wiki:
    build:
      context: .
      dockerfile: docker/llm-wiki.Dockerfile
    image: 100thieves/llm-wiki:local
    environment:
      LLM_WIKI_NAME: 100thieves
      LLM_WIKI_DESCRIPTION: 100 Thieves team LLM Wiki
      LLM_WIKI_CONFIG: /config/config.toml
      LLM_WIKI_WORKSPACE: /workspace
    volumes:
      - ./wiki-workspace:/workspace
      - llm-wiki-config:/config
    expose:
      - "18765"
    restart: unless-stopped

  # 토큰 발급/검증 사이드카 (docs/wiki-token-issuer.md). mcp-proxy가
  # auth_request로 검증을 위임한다: 기존 정적 MCP_BEARER_TOKEN 또는
  # POST /auth/token 이 발급한 단기 JWT 둘 다 통과. 발급기는
  # WIKI_TOKEN_PASSWORD_HASH + WIKI_TOKEN_JWT_SECRET 둘 다 있어야 켜진다
  # (없으면 503, 정적 토큰 검증만 동작 — 스택은 기존과 동일하게 뜬다).
  wiki-auth:
    image: python:3.12-alpine
    volumes:
      - ./docker/wiki-auth/app.py:/app/app.py:ro
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN}
      WIKI_TOKEN_PASSWORD_HASH: ${WIKI_TOKEN_PASSWORD_HASH:-}
      WIKI_TOKEN_JWT_SECRET: ${WIKI_TOKEN_JWT_SECRET:-}
    command: ["python", "/app/app.py"]
    expose:
      - "8790"
    restart: unless-stopped

  mcp-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - llm-wiki
      - wiki-auth
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 18765;
          resolver 127.0.0.11 valid=10s ipv6=off;

          location = /auth/token {
            set $$wiki_auth_upstream wiki-auth:8790;
            proxy_http_version 1.1;
            proxy_pass http://$$wiki_auth_upstream;
          }

          location = /_wiki_auth_verify {
            internal;
            set $$wiki_auth_upstream wiki-auth:8790;
            proxy_pass http://$$wiki_auth_upstream/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $$http_authorization;
          }

          location @unauthorized {
            add_header WWW-Authenticate "Bearer" always;
            return 401;
          }

          location / {
            auth_request /_wiki_auth_verify;
            error_page 401 = @unauthorized;

            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Authorization $$http_authorization;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            set $$llm_wiki_upstream llm-wiki:18765;
            proxy_pass http://$$llm_wiki_upstream;
          }
        }
        NGINX
        nginx -g 'daemon off;'
    ports:
      - "18765:18765"
    restart: unless-stopped

  wiki-ui:
    build:
      context: .
      dockerfile: docker/hugo.Dockerfile
    image: 100thieves/llm-wiki-hugo:local
    depends_on:
      - llm-wiki
    working_dir: /workspace/site
    command: >-
      sh -c 'until [ -d /workspace/wiki ]; do echo "waiting for llm-wiki workspace..."; sleep 1; done; hugo server --bind 0.0.0.0 --port 1313 --baseURL http://localhost:1313/ --buildDrafts --destination /tmp/hugo-public --cacheDir /tmp/hugo-cache --noBuildLock --disableFastRender'
    volumes:
      - ./wiki-workspace:/workspace
      - ./llm-wiki-hugo-cms/site:/workspace/site:ro
    ports:
      - "1313:1313"
    restart: unless-stopped

  # Hermes Agent Gateway (NousResearch/hermes-agent). OpenAI-compatible API
  # server on port 8642. Gated behind the `hermes` profile so a default
  # `docker compose up` is unaffected and provider keys are not required.
  # See docs/hermes-gateway.md.
  hermes-gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.4.3}
    # Image publishes linux/amd64 only; pin platform so it pulls on Apple
    # Silicon (via emulation) and EC2 (native amd64) alike.
    platform: ${HERMES_PLATFORM:-linux/amd64}
    profiles:
      - hermes
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # Required at runtime when the `hermes` profile is used (value from
      # /plady/agent-platform/<env>/hermes-api-server-key). Left optional here
      # (`:-`) on purpose: a `:?` guard would abort interpolation for the whole
      # file — including non-hermes `docker compose up`/`config` — because
      # Compose interpolates every service before profile filtering. Hermes
      # itself requires this key for every deployment and refuses to serve
      # without it, so an empty value fails fast in the container, not the file.
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-home:/opt/data
    # Loopback-only host publish: the gateway persists OAuth tokens and tool
    # credentials in /opt/data, so do not expose it on all host interfaces.
    ports:
      - "127.0.0.1:8642:8642"
    restart: unless-stopped

  # Internal-only OpenTelemetry Collector (contrib distribution — needs the
  # redaction processor + file exporter). Receives OTLP on the compose network
  # ONLY: gRPC otel-collector:4317, HTTP otel-collector:4318. There is no host
  # publish (`expose:` only, never `ports:`) and no public endpoint
  # (no otel.agent.plady.io). Gated behind the `otel` profile so a default
  # `docker compose up` is unaffected. Privacy + file/local-first export contract
  # live in otel/collector-config.yaml. See docs/otel-collector.md.
  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.154.0}
    profiles:
      - otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # The otel-data named volume is root-owned on first mount; run as root so
    # the file exporter can write /var/lib/otel. Internal-only service.
    user: "0:0"
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-data:/var/lib/otel
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # n8n — local run of the Webex ingest workflow (docs/webex-ingest.md).
  # Loopback publish so the editor is reachable at http://localhost:5678 and
  # scripts/webex-ingest-stub.py can hit the webhook; production (compose.ec2.yaml)
  # publishes nothing and sits behind Caddy/ALB. $WEBEX_API_BASE / $HERMES_API_URL
  # can point at the stub (host.docker.internal:18790) for an end-to-end test
  # with no Webex account and no model.
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.37.9}
    profiles:
      - n8n
    environment:
      N8N_PORT: "5678"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-only-not-a-secret}
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_TASK_TIMEOUT: "1200"       # Code 노드 상한(초). Hermes 컴파일은 최대 15분
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_SECURE_COOKIE: "false"             # plain http on localhost
      LLM_WIKI_MCP_URL: http://mcp-proxy:18765/mcp
      LLM_WIKI_MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
      HERMES_API_URL: ${HERMES_API_URL:-http://hermes-gateway:8642}
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-gpt-5.5}
      WEBEX_API_BASE: ${WEBEX_API_BASE:-https://webexapis.com}
      WEBEX_WEBHOOK_SECRET: ${WEBEX_WEBHOOK_SECRET:-}
      WEBEX_WEBHOOK_OWNED_BY: ${WEBEX_WEBHOOK_OWNED_BY:-creator}
      WIKI_SLACK_WEBHOOK_URL: ${WIKI_SLACK_WEBHOOK_URL:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    restart: unless-stopped
  # ---------------------------------------------------------------------------

volumes:
  llm-wiki-config:
  n8n-data:
  hermes-home:
  otel-data:
